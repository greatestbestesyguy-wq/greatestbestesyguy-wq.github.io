<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Ascent - Platformer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0f; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #00f2ff;
            pointer-events: none; text-shadow: 0 0 10px rgba(0,242,255,0.5);
        }
        .instr { font-size: 14px; color: #888; margin-top: 5px; }
        #scoreBoard { font-size: 18px; color: #ffd700; margin-top: 5px; font-weight: bold; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
    </style>
</head>
<body>

<div id="ui">
    <div style="font-size: 24px; font-weight: bold;">NEON ASCENT</div>
    <div id="status">Explore the level...</div>
    <div id="scoreBoard">Coins: 0 / 15</div>
    <div class="instr">WASD/Arrows to Move • Space to Jump (Single Jump Only)</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game Constants
    const GRAVITY = 0.5;
    const JUMP_FORCE = -10;
    const SPEED = 5;
    const LEVEL_WIDTH = 11000; 
    const LEVEL_HEIGHT = 1500;

    let player = {
        x: 100, y: 600, w: 30, h: 40,
        vx: 0, vy: 0,
        jumps: 0,
        checkpoint: { x: 100, y: 600 },
        color: '#00f2ff'
    };

    let camera = { x: 0, y: 0 };
    const keys = {};
    let time = 0;
    let score = 0;
    const totalCoins = 15;

    // Platform Types: 
    // 0 = Solid, 1 = Hazard (Lava), 2 = Checkpoint, 3 = Goal, 4 = Bounce Pad, 5 = Coin, 6 = Blinking Block
    const world = [
        // --- ZONE 1: The Basics (0 - 1500) ---
        { x: 0, y: 700, w: 500, h: 100, type: 0 },
        { x: 250, y: 650, w: 20, h: 20, type: 5 }, // Coin 1
        { x: 600, y: 650, w: 150, h: 20, type: 0 },
        { x: 665, y: 600, w: 20, h: 20, type: 5 }, // Coin 2
        { x: 850, y: 600, w: 150, h: 20, type: 0 },
        { x: 1100, y: 550, w: 150, h: 20, type: 0 },
        
        { x: 1350, y: 550, w: 100, h: 10, type: 2, active: false }, // Checkpoint 1
        { x: 1300, y: 600, w: 200, h: 200, type: 0 },

        // --- ZONE 2: Bounce Pad City (1500 - 3500) ---
        { x: 1500, y: 850, w: 2000, h: 50, type: 1 }, // Giant Lava Pit
        { x: 1650, y: 650, w: 100, h: 20, type: 0 },
        { x: 1700, y: 630, w: 50, h: 20, type: 4 }, // Bounce Pad 1
        { x: 1900, y: 300, w: 150, h: 20, type: 0 },
        { x: 1965, y: 250, w: 20, h: 20, type: 5 }, // Coin 3
        
        { x: 2200, y: 400, w: 100, h: 20, type: 0 },
        { x: 2400, y: 500, w: 100, h: 20, type: 0 },
        { x: 2450, y: 480, w: 50, h: 20, type: 4 }, // Bounce Pad 2
        { x: 2700, y: 150, w: 150, h: 20, type: 0 },
        { x: 2765, y: 100, w: 20, h: 20, type: 5 }, // Coin 4

        // Drop down to next checkpoint
        { x: 3000, y: 500, w: 100, h: 10, type: 2, active: false }, // Checkpoint 2
        { x: 2950, y: 550, w: 200, h: 300, type: 0 },

        // --- ZONE 3: The Blinking Void (3500 - 6000) ---
        { x: 3250, y: 550, w: 100, h: 20, type: 6, interval: 100, offset: 0 },
        { x: 3450, y: 500, w: 100, h: 20, type: 6, interval: 100, offset: 50 },
        { x: 3500, y: 450, w: 20, h: 20, type: 5 }, // Coin 5
        { x: 3650, y: 450, w: 100, h: 20, type: 6, interval: 100, offset: 0 },
        { x: 3850, y: 400, w: 100, h: 20, type: 0 },

        { x: 4100, y: 350, w: 80, h: 20, type: 6, interval: 80, offset: 0 },
        { x: 4300, y: 300, w: 80, h: 20, type: 6, interval: 80, offset: 40 },
        { x: 4500, y: 250, w: 80, h: 20, type: 6, interval: 80, offset: 0 },
        { x: 4530, y: 200, w: 20, h: 20, type: 5 }, // Coin 6

        { x: 4800, y: 400, w: 100, h: 10, type: 2, active: false }, // Checkpoint 3
        { x: 4750, y: 450, w: 200, h: 500, type: 0 },
        { x: 4750, y: 900, w: 2000, h: 50, type: 1 }, // Lava floor

        // --- ZONE 4: The Gauntlet (6000 - 8500) ---
        // Requires tight jumps and immediate bounce pad reactions
        { x: 5100, y: 550, w: 80, h: 20, type: 0 },
        { x: 5300, y: 650, w: 80, h: 20, type: 0 },
        { x: 5320, y: 630, w: 40, h: 20, type: 4 }, // Bounce Pad 3
        { x: 5500, y: 200, w: 80, h: 20, type: 0 },
        { x: 5530, y: 150, w: 20, h: 20, type: 5 }, // Coin 7

        { x: 5800, y: 400, w: 50, h: 20, type: 0 },
        { x: 6000, y: 550, w: 50, h: 20, type: 0 },
        { x: 6200, y: 700, w: 50, h: 20, type: 0 },
        { x: 6215, y: 680, w: 20, h: 20, type: 4 }, // Bounce Pad 4 (Tiny)
        { x: 6500, y: 150, w: 200, h: 20, type: 0 },
        { x: 6550, y: 100, w: 20, h: 20, type: 5 }, // Coin 8
        { x: 6650, y: 100, w: 20, h: 20, type: 5 }, // Coin 9

        { x: 6900, y: 350, w: 100, h: 10, type: 2, active: false }, // Checkpoint 4
        { x: 6850, y: 400, w: 200, h: 600, type: 0 },

        // --- ZONE 5: The Final Climb (8500 - 10500) ---
        { x: 7200, y: 500, w: 100, h: 20, type: 6, interval: 60, offset: 0 }, // Fast blink
        { x: 7400, y: 450, w: 100, h: 20, type: 6, interval: 60, offset: 30 },
        { x: 7600, y: 400, w: 100, h: 20, type: 6, interval: 60, offset: 0 },
        { x: 7640, y: 350, w: 20, h: 20, type: 5 }, // Coin 10
        
        { x: 7900, y: 600, w: 100, h: 20, type: 0 },
        { x: 7950, y: 580, w: 50, h: 20, type: 4 }, // Bounce Pad 5
        { x: 8200, y: 200, w: 50, h: 20, type: 0 },
        { x: 8215, y: 150, w: 20, h: 20, type: 5 }, // Coin 11

        { x: 8500, y: 400, w: 50, h: 20, type: 0 },
        { x: 8700, y: 550, w: 50, h: 20, type: 0 },
        { x: 8900, y: 700, w: 50, h: 20, type: 0 },
        { x: 8915, y: 680, w: 20, h: 20, type: 4 }, // Bounce Pad 6
        { x: 9200, y: 150, w: 100, h: 20, type: 0 },
        { x: 9240, y: 100, w: 20, h: 20, type: 5 }, // Coin 12

        { x: 9500, y: 300, w: 100, h: 10, type: 2, active: false }, // Checkpoint 5
        { x: 9450, y: 350, w: 200, h: 800, type: 0 },

        // The Stairway to Victory
        { x: 9800, y: 450, w: 150, h: 20, type: 0 },
        { x: 9865, y: 400, w: 20, h: 20, type: 5 }, // Coin 13
        { x: 10000, y: 350, w: 150, h: 20, type: 0 },
        { x: 10065, y: 300, w: 20, h: 20, type: 5 }, // Coin 14
        { x: 10200, y: 250, w: 150, h: 20, type: 0 },
        { x: 10265, y: 200, w: 20, h: 20, type: 5 }, // Coin 15
        
        // --- THE GOAL ---
        { x: 10600, y: 150, w: 60, h: 60, type: 3 },
        { x: 10500, y: 250, w: 400, h: 1200, type: 0 }
    ];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function update() {
        time++;

        // Horizontal Movement
        if (keys['ArrowLeft'] || keys['a']) player.vx = -SPEED;
        else if (keys['ArrowRight'] || keys['d']) player.vx = SPEED;
        else player.vx *= 0.8; // Friction

        player.x += player.vx;

        // Vertical Movement
        player.vy += GRAVITY;
        player.y += player.vy;

        let onGround = false;

        // Collision Detection
        world.forEach(obj => {
            // Handle Blinking Blocks state
            if (obj.type === 6) {
                obj.isActive = ((time + obj.offset) % obj.interval) < (obj.interval / 2);
            }

            // AABB Collision Check
            let isColliding = player.x < obj.x + obj.w && player.x + player.w > obj.x &&
                              player.y < obj.y + obj.h && player.y + player.h > obj.y;

            if (isColliding) {
                if (obj.type === 0 || (obj.type === 6 && obj.isActive)) { // Solid or Active Blinking
                    // Top collision
                    if (player.vy > 0 && player.y + player.h - player.vy <= obj.y + 10) {
                        player.y = obj.y - player.h;
                        player.vy = 0;
                        player.jumps = 0; // Reset jump
                        onGround = true;
                    } 
                    // Bottom collision
                    else if (player.vy < 0 && player.y - player.vy >= obj.y + obj.h - 10) {
                        player.y = obj.y + obj.h;
                        player.vy = 0;
                    }
                    // Side collisions
                    else {
                        if (player.vx > 0) player.x = obj.x - player.w;
                        else if (player.vx < 0) player.x = obj.x + obj.w;
                        player.vx = 0;
                    }
                } else if (obj.type === 1) { // Hazard (Lava)
                    respawn();
                } else if (obj.type === 2) { // Checkpoint
                    player.checkpoint = { x: obj.x + 10, y: obj.y - 60 };
                    document.getElementById('status').innerText = "Checkpoint Saved!";
                    document.getElementById('status').style.color = "#00ff88";
                    obj.active = true;
                } else if (obj.type === 3) { // Goal
                    document.getElementById('status').innerText = `YOU WIN! Collected ${score}/${totalCoins} Coins.`;
                    document.getElementById('status').style.color = "#ffaa00";
                } else if (obj.type === 4) { // Bounce Pad
                    if (player.vy > 0 && player.y + player.h - player.vy <= obj.y + 15) {
                        player.vy = JUMP_FORCE * 1.8; // Super jump!
                        player.jumps = 1; // Prevent jumping in air after bounce
                    }
                } else if (obj.type === 5 && !obj.collected) { // Coin
                    obj.collected = true;
                    score++;
                    document.getElementById('scoreBoard').innerText = `Coins: ${score} / ${totalCoins}`;
                }
            }
        });

        // Death by Void
        if (player.y > LEVEL_HEIGHT) respawn();

        // Camera Follow (Smooth follow)
        let targetCamX = player.x - canvas.width / 2;
        let targetCamY = player.y - canvas.height / 2;
        camera.x += (targetCamX - camera.x) * 0.1;
        camera.y += (targetCamY - camera.y) * 0.1;
        
        // Clamp Camera X
        camera.x = Math.max(0, Math.min(camera.x, LEVEL_WIDTH - canvas.width));
    }

    function respawn() {
        player.x = player.checkpoint.x;
        player.y = player.checkpoint.y;
        player.vx = 0;
        player.vy = 0;
        document.getElementById('status').innerText = "Restarting at Checkpoint...";
        document.getElementById('status').style.color = "#ff0044";
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // Draw World
        world.forEach(obj => {
            ctx.shadowBlur = 0;
            if (obj.type === 0) { // Solid
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                ctx.strokeStyle = '#303050';
                ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
            } else if (obj.type === 1) { // Lava
                ctx.fillStyle = '#ff0044';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff0044';
                // Animate lava surface
                let lavaOffset = Math.sin(time * 0.05 + obj.x) * 5;
                ctx.fillRect(obj.x, obj.y + lavaOffset, obj.w, obj.h - lavaOffset);
            } else if (obj.type === 2) { // Checkpoint
                ctx.fillStyle = obj.active ? '#00ff88' : '#444';
                ctx.fillRect(obj.x + obj.w/2 - 2, obj.y - 40, 4, 40); // Pole
                ctx.beginPath();
                ctx.moveTo(obj.x + obj.w/2, obj.y - 40);
                ctx.lineTo(obj.x + obj.w/2 + 20, obj.y - 30);
                ctx.lineTo(obj.x + obj.w/2, obj.y - 20);
                ctx.fill();
            } else if (obj.type === 3) { // Goal
                ctx.fillStyle = '#ffaa00';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffaa00';
                ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                ctx.fillStyle = '#fff';
                ctx.font = "bold 16px sans-serif";
                ctx.fillText("GOAL", obj.x + 8, obj.y + 35);
            } else if (obj.type === 4) { // Bounce Pad
                ctx.fillStyle = '#00ff44';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ff44';
                // Animate bounce pad slightly
                let padHeight = obj.h + Math.sin(time * 0.2) * 2;
                ctx.fillRect(obj.x, obj.y + (obj.h - padHeight), obj.w, padHeight);
            } else if (obj.type === 5 && !obj.collected) { // Coin
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffd700';
                let floatY = Math.sin(time * 0.1) * 5;
                ctx.beginPath();
                ctx.arc(obj.x + obj.w/2, obj.y + obj.h/2 + floatY, obj.w/2, 0, Math.PI * 2);
                ctx.fill();
            } else if (obj.type === 6 && obj.isActive) { // Blinking Block
                ctx.fillStyle = '#8a2be2';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#8a2be2';
                ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                ctx.strokeStyle = '#dda0dd';
                ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
            } else if (obj.type === 6 && !obj.isActive) { // Inactive Blinking Block
                ctx.strokeStyle = 'rgba(138, 43, 226, 0.2)';
                ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
            }
        });

        // Draw Player
        ctx.shadowBlur = 15;
        ctx.shadowColor = player.color;
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.w, player.h);
        
        ctx.restore();

        update();
        requestAnimationFrame(draw);
    }

    window.addEventListener('keydown', e => {
        keys[e.key] = true;
        // Restricted to SINGLE JUMP (jumps < 1)
        if ((e.key === ' ' || e.key === 'w' || e.key === 'ArrowUp') && player.jumps < 1) {
            player.vy = JUMP_FORCE;
            player.jumps++;
        }
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    draw();
</script>
</body>
</html>
