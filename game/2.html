<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platformer Race - Neon Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0f; font-family: 'Segoe UI', sans-serif; color: white; user-select: none; }
        canvas { display: block; }
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 10, 15, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .panel { background: #16213e; padding: 30px; border-radius: 12px; border: 2px solid #00f2ff; text-align: center; width: 400px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
        input, button, select { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; font-size: 16px; box-sizing: border-box; }
        input, select { background: #0f3460; color: white; border: 1px solid #00f2ff; }
        button { background: #00f2ff; color: #0a0a0f; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #00c2cc; box-shadow: 0 0 10px #00f2ff; }
        .hidden { display: none !important; }
        .lobby-list { max-height: 200px; overflow-y: auto; margin-top: 15px; text-align: left; background: #0f3460; padding: 10px; border-radius: 6px; }
        .lobby-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #1a1a2e; }
        .kick-btn { width: auto; background: #ff0044; color: white; padding: 4px 8px; font-size: 12px; margin: 0; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 50; pointer-events: none; }
        .hud-box { background: rgba(22, 33, 62, 0.9); padding: 12px 20px; border-left: 4px solid #00f2ff; border-radius: 4px; font-size: 20px; font-weight: bold; margin-bottom: 10px;}
        #leaderboard { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 40px; border-radius: 10px; border: 2px solid #ffaa00; text-align: center; z-index: 80; }
    </style>
</head>
<body>

<div id="menu-overlay" class="overlay">
    <div class="panel">
        <h1 style="color:#00f2ff; margin:0 0 10px 0; text-shadow: 0 0 10px #00f2ff;">NEON RACER</h1>
        <input type="text" id="username" placeholder="Your Name" maxlength="12">
        <input type="text" id="custom-room-name" placeholder="Room Name (for host)" maxlength="15">
        <button onclick="createLobby()">Create New Lobby</button>
        <div class="lobby-list" id="active-lobbies">
            <div style="text-align: center; color: #888;">Loading active lobbies...</div>
        </div>
    </div>
</div>

<div id="lobby-overlay" class="overlay hidden">
    <div class="panel" style="position: absolute; top: 20px; right: 20px; width: 300px; background: rgba(22, 33, 62, 0.9);">
        <h2 id="lobby-title" style="color: #00f2ff;">Lobby</h2>
        <div id="player-list-display" style="text-align: left; margin-bottom: 15px; font-size: 14px;"></div>
        <div id="host-controls" class="hidden">
            <select id="map-select">
                <option value="1">Map 1: Neon Ascent (Long)</option>
                <option value="2">Map 2: The Lava Caverns</option>
                <option value="3">Map 3: The Sky Maze</option>
            </select>
            <button onclick="startGame()" style="margin-top: 20px;">START RACE</button>
        </div>
        <div id="guest-controls">
            <p>Waiting for host to start...</p>
        </div>
        <button onclick="leaveLobby()" style="background: #444; color: white;">Leave</button>
    </div>
</div>

<div id="ui" class="hidden">
    <div class="hud-box" id="timer-display">00:00.00</div>
    <div class="hud-box" id="status-display" style="font-size: 14px; border-left-color: #00ff88;">Practice Mode</div>
</div>

<div id="leaderboard" class="hidden">
    <h2 style="color: #ffaa00;">Race Results</h2>
    <div id="results-list" style="margin-bottom: 20px; font-size: 18px; line-height: 1.6;"></div>
    <button onclick="returnToLobby()">Back to Lobby</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // --- GAME DATA & CONFIG ---
    let supabaseClient;
    const myId = Math.random().toString(36).substr(2, 9);
    let myData = { id: myId, name: '', x: 100, y: 100, vx: 0, vy: 0, color: `hsl(${Math.random()*360}, 100%, 60%)`, finished: false, time: 0, checkpoint: {x: 100, y: 100} };
    let players = {};
    let currentRoomId = null;
    let roomState = 'menu'; 
    let isHost = false;
    let startTime = 0;
    
    // Physics & Controls
    const keys = { ArrowUp: false, ArrowLeft: false, ArrowRight: false, Space: false, w: false, a: false, d: false };
    const GRAVITY = 0.6;
    const FRICTION = 0.8;
    const SPEED = 5;
    const JUMP_FORCE = -12;
    const WALL_JUMP_X = 8;
    let jumpsLeft = 2;
    let roomSettings = { map: 0, roomName: "Neon Room" };
    let camera = { x: 0, y: 0 };

    const MAPS = [
        {
            // MAP 0: THE LOBBY ROOM (Practice area)
            width: 1200, height: 800, spawn: {x: 100, y: 600},
            blocks: [
                { x: 0, y: 750, w: 1200, h: 50, type: 1 }, // Floor
                { x: 0, y: 0, w: 40, h: 800, type: 1 },    // Left Wall
                { x: 1160, y: 0, w: 40, h: 800, type: 1 }, // Right Wall
                { x: 400, y: 550, w: 400, h: 20, type: 1 }, // Platform
                { x: 200, y: 350, w: 150, h: 20, type: 1 }, // Higher platform
                { x: 850, y: 350, w: 150, h: 20, type: 1 }
            ]
        },
        {
            // MAP 1: Neon Ascent
            width: 8000, height: 1200, spawn: {x: 100, y: 500},
            blocks: [
                { x: 0, y: 700, w: 600, h: 100, type: 1 },
                { x: 700, y: 650, w: 200, h: 20, type: 1 },
                { x: 1000, y: 600, w: 200, h: 20, type: 1 },
                { x: 1250, y: 600, w: 200, h: 100, type: 1 },
                { x: 1300, y: 550, w: 100, h: 50, type: 4 },
                { x: 1500, y: 850, w: 1000, h: 50, type: 2 },
                { x: 1600, y: 500, w: 100, h: 20, type: 1 },
                { x: 1850, y: 450, w: 100, h: 20, type: 1 },
                { x: 2100, y: 400, w: 100, h: 20, type: 1 },
                { x: 2350, y: 450, w: 200, h: 400, type: 1 },
                { x: 2400, y: 400, w: 100, h: 50, type: 4 },
                { x: 2700, y: 400, w: 50, h: 15, type: 1 },
                { x: 2900, y: 300, w: 50, h: 15, type: 1 },
                { x: 3100, y: 400, w: 50, h: 15, type: 1 },
                { x: 3300, y: 250, w: 50, h: 15, type: 1 },
                { x: 3550, y: 350, w: 300, h: 600, type: 1 },
                { x: 3600, y: 300, w: 100, h: 50, type: 4 },
                { x: 4000, y: 800, w: 150, h: 20, type: 1 },
                { x: 4200, y: 700, w: 150, h: 20, type: 1 },
                { x: 4400, y: 600, w: 150, h: 20, type: 1 },
                { x: 4600, y: 500, w: 150, h: 20, type: 1 },
                { x: 4950, y: 500, w: 300, h: 100, type: 1 },
                { x: 5000, y: 450, w: 100, h: 50, type: 4 },
                { x: 5400, y: 400, w: 80, h: 15, type: 1 },
                { x: 5400, y: 250, w: 80, h: 15, type: 1 },
                { x: 5600, y: 150, w: 80, h: 15, type: 1 },
                { x: 5800, y: 300, w: 80, h: 15, type: 1 },
                { x: 6000, y: 450, w: 80, h: 15, type: 1 },
                { x: 6300, y: 200, w: 1000, h: 20, type: 1 },
                { x: 6300, y: 600, w: 1000, h: 20, type: 1 },
                { x: 6600, y: 220, w: 20, h: 300, type: 1 },
                { x: 6900, y: 350, w: 20, h: 250, type: 1 },
                { x: 7600, y: 200, w: 400, h: 1000, type: 1 },
                { x: 7700, y: 100, w: 100, h: 100, type: 3 }
            ]
        },
        {
            // MAP 2: Lava Caverns
            width: 4000, height: 1000, spawn: {x: 100, y: 600},
            blocks: [
                {x: 0, y: 700, w: 400, h: 100, type: 1}, 
                {x: 400, y: 900, w: 3000, h: 100, type: 2},
                {x: 600, y: 600, w: 100, h: 20, type: 1}, 
                {x: 900, y: 500, w: 100, h: 20, type: 1},
                {x: 1200, y: 400, w: 100, h: 20, type: 1},
                {x: 1500, y: 300, w: 200, h: 20, type: 1},
                {x: 1550, y: 250, w: 100, h: 50, type: 4},
                {x: 1900, y: 500, w: 50, h: 50, type: 1},
                {x: 2200, y: 700, w: 50, h: 50, type: 1},
                {x: 2600, y: 600, w: 50, h: 50, type: 1},
                {x: 3000, y: 400, w: 200, h: 20, type: 1},
                {x: 3500, y: 400, w: 200, h: 400, type: 1},
                {x: 3550, y: 300, w: 100, h: 100, type: 3}
            ]
        },
        {
            // MAP 3: Sky Maze
            width: 3000, height: 1500, spawn: {x: 100, y: 1200},
            blocks: [
                {x: 0, y: 1300, w: 300, h: 50, type: 1},
                {x: 400, y: 1150, w: 100, h: 20, type: 1},
                {x: 200, y: 1000, w: 100, h: 20, type: 1},
                {x: 500, y: 850, w: 100, h: 20, type: 1},
                {x: 800, y: 850, w: 200, h: 20, type: 1},
                {x: 850, y: 800, w: 100, h: 50, type: 4},
                {x: 1100, y: 700, w: 50, h: 50, type: 1},
                {x: 1400, y: 550, w: 50, h: 50, type: 1},
                {x: 1100, y: 400, w: 50, h: 50, type: 1},
                {x: 1500, y: 250, w: 300, h: 20, type: 1},
                {x: 2000, y: 350, w: 100, h: 20, type: 1},
                {x: 2400, y: 500, w: 200, h: 20, type: 1},
                {x: 2700, y: 500, w: 200, h: 200, type: 1},
                {x: 2750, y: 400, w: 100, h: 100, type: 3}
            ]
        }
    ];
    let currentMap = MAPS[0];

    async function initSupabase() {
        supabaseClient = supabase.createClient(window.location.origin + '/supabase', 'sb_publishable_rIUr6wF4GKnrhuG_DMFbEw_9IOrXgw7');
        setInterval(fetchLobbies, 3000);
        setInterval(syncPlayer, 50); 
        setInterval(syncRoom, 500);
        requestAnimationFrame(gameLoop);
    }

    async function fetchLobbies() {
        if(roomState !== 'menu') return;
        const { data } = await supabaseClient.from('rooms').select('*').eq('state', 'lobby');
        const list = document.getElementById('active-lobbies');
        list.innerHTML = '';
        if(!data || data.length === 0) {
            list.innerHTML = '<div style="color:#888;">No active lobbies. Create one!</div>';
            return;
        }
        data.forEach(room => {
            const div = document.createElement('div');
            div.className = 'lobby-item';
            const name = room.settings.roomName || "Neon Lobby";
            div.innerHTML = `<span><b>${name}</b></span> <button style="width:auto; padding: 4px 8px; margin:0;" onclick="joinLobby('${room.id}')">Join</button>`;
            list.appendChild(div);
        });
    }

    async function createLobby() {
        const name = document.getElementById('username').value.trim() || 'Guest';
        const rName = document.getElementById('custom-room-name').value.trim() || 'Neon Room';
        myData.name = name;
        roomSettings.roomName = rName;
        currentRoomId = 'room_' + Math.random().toString(36).substr(2, 6);
        isHost = true;
        roomState = 'lobby';
        
        await supabaseClient.from('rooms').insert({
            id: currentRoomId, host_id: myId, state: 'lobby', settings: roomSettings
        });
        enterLobbyUI();
    }

    async function joinLobby(roomId) {
        const name = document.getElementById('username').value.trim() || 'Guest';
        myData.name = name;
        currentRoomId = roomId;
        isHost = false;
        roomState = 'lobby';
        enterLobbyUI();
    }

    function enterLobbyUI() {
        document.getElementById('menu-overlay').classList.add('hidden');
        document.getElementById('lobby-overlay').classList.remove('hidden');
        document.getElementById('ui').classList.remove('hidden'); // Show HUD for practice
        document.getElementById('host-controls').classList.toggle('hidden', !isHost);
        document.getElementById('guest-controls').classList.toggle('hidden', isHost);
        document.getElementById('lobby-title').innerText = roomSettings.roomName;
        currentMap = MAPS[0]; 
        fullResetPlayer(currentMap.spawn);
    }

    async function kickPlayer(targetId) {
        if(!isHost) return;
        await supabaseClient.from('players').delete().eq('id', targetId);
    }

    async function leaveLobby() {
        if(isHost) await supabaseClient.from('rooms').delete().eq('id', currentRoomId);
        currentRoomId = null;
        roomState = 'menu';
        document.getElementById('lobby-overlay').classList.add('hidden');
        document.getElementById('ui').classList.add('hidden');
        document.getElementById('menu-overlay').classList.remove('hidden');
    }

    async function startGame() {
        if(!isHost) return;
        roomSettings.map = parseInt(document.getElementById('map-select').value) || 1;
        await supabaseClient.from('rooms').update({ state: 'playing', settings: roomSettings }).eq('id', currentRoomId);
    }

    function returnToLobby() {
        document.getElementById('leaderboard').classList.add('hidden');
        if(isHost) supabaseClient.from('rooms').update({ state: 'lobby' }).eq('id', currentRoomId);
    }

    async function syncPlayer() {
        if(!currentRoomId) return;
        
        const { data: me, error } = await supabaseClient.from('players').upsert({
            id: myId, room_id: currentRoomId, name: myData.name, 
            x: myData.x, y: myData.y, color: myData.color, 
            finished: myData.finished, time: myData.time, last_seen: new Date().toISOString()
        }).select().maybeSingle();

        // If I am kicked (not found in DB), return to menu
        if (error || !me) {
             leaveLobby();
             return;
        }
        
        const { data } = await supabaseClient.from('players').select('*').eq('room_id', currentRoomId);
        if(data) {
            let activeIds = [];
            const listDiv = document.getElementById('player-list-display');
            let listHtml = "<b>Players:</b><br>";
            
            data.forEach(p => {
                if(p.id === myId) return;
                activeIds.push(p.id);
                if(!players[p.id]) players[p.id] = { ...p, tx: p.x, ty: p.y };
                else {
                    players[p.id].tx = p.x; players[p.id].ty = p.y;
                    players[p.id].finished = p.finished; players[p.id].time = p.time;
                }
                
                let kickBtn = isHost ? `<button class="kick-btn" onclick="kickPlayer('${p.id}')">Kick</button>` : "";
                listHtml += `<div style="display:flex; justify-content:space-between; margin-top:5px;">${p.name} ${kickBtn}</div>`;
            });
            listDiv.innerHTML = listHtml;
            for(let id in players) if(!activeIds.includes(id)) delete players[id];
        }
    }

    async function syncRoom() {
        if(!currentRoomId) return;
        const { data } = await supabaseClient.from('rooms').select('*').eq('id', currentRoomId).maybeSingle();
        if(data) {
            roomSettings = data.settings;
            if(data.state === 'playing' && roomState === 'lobby') {
                roomState = 'playing';
                currentMap = MAPS[roomSettings.map] || MAPS[1];
                fullResetPlayer(currentMap.spawn);
                startTime = Date.now();
                document.getElementById('lobby-overlay').classList.add('hidden');
                document.getElementById('status-display').innerText = "Race Started!";
            } else if (data.state === 'lobby' && (roomState === 'playing' || roomState === 'finished')) {
                roomState = 'lobby';
                document.getElementById('leaderboard').classList.add('hidden');
                document.getElementById('lobby-overlay').classList.remove('hidden');
                document.getElementById('status-display').innerText = "Practice Mode";
                currentMap = MAPS[0];
                fullResetPlayer(currentMap.spawn);
            }
        }
    }

    function fullResetPlayer(spawnPos) {
        myData.checkpoint = { x: spawnPos.x, y: spawnPos.y };
        respawnAtCheckpoint();
        myData.finished = false;
        myData.time = 0;
    }

    function respawnAtCheckpoint() {
        myData.x = myData.checkpoint.x;
        myData.y = myData.checkpoint.y;
        myData.vx = 0;
        myData.vy = 0;
    }

    function checkCollision(x, y, w, h) {
        for(let b of currentMap.blocks) {
            if(x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y) return b;
        }
        return null;
    }

    function updatePhysics() {
        if(roomState === 'menu' || myData.finished) return;

        myData.vy += GRAVITY;
        if(keys.ArrowLeft || keys.a) myData.vx -= 0.8;
        if(keys.ArrowRight || keys.d) myData.vx += 0.8;
        myData.vx *= FRICTION;

        // X Movement
        myData.x += myData.vx;
        let colX = checkCollision(myData.x, myData.y, 30, 40);
        let onWall = false;
        let wallSide = 0; // -1 left, 1 right

        if(colX) {
            if(colX.type === 3) finishRace();
            else if(colX.type === 4) setCheckpoint(colX);
            else if(colX.type === 2) die();
            else {
                if(myData.vx > 0) { myData.x = colX.x - 30; wallSide = 1; }
                else { myData.x = colX.x + colX.w; wallSide = -1; }
                myData.vx = 0;
                onWall = true;
            }
        }

        // Y Movement
        myData.y += myData.vy;
        let colY = checkCollision(myData.x, myData.y, 30, 40);
        if(colY) {
            if(colY.type === 3) finishRace();
            else if(colY.type === 4) setCheckpoint(colY);
            else if(colY.type === 2) die();
            else {
                if(myData.vy > 0) { 
                    myData.y = colY.y - 40;
                    jumpsLeft = 2;
                } else { 
                    myData.y = colY.y + colY.h;
                }
                myData.vy = 0;
            }
        }

        // WALL JUMP LOGIC
        if (onWall && myData.vy > 0) {
            myData.vy = 1; // Slide down wall
            jumpsLeft = 1; // Give a jump back while touching wall
        }

        if(myData.y > currentMap.height + 500) die();
    }

    function setCheckpoint(block) {
        let newX = block.x + (block.w / 2) - 15;
        let newY = block.y - 50;
        if(myData.checkpoint.x !== newX || myData.checkpoint.y !== newY) {
            myData.checkpoint = { x: newX, y: newY };
            document.getElementById('status-display').innerText = "Checkpoint Saved!";
            document.getElementById('status-display').style.color = "#00ff88";
        }
    }

    function die() {
        respawnAtCheckpoint();
        document.getElementById('status-display').innerText = "Respawned!";
        document.getElementById('status-display').style.color = "#ff0044";
    }

    window.addEventListener('keydown', e => {
        if(keys.hasOwnProperty(e.key)) keys[e.key] = true;
        if(keys.hasOwnProperty(e.code)) keys[e.code] = true;
        
        if((e.code === 'Space' || e.key === 'w' || e.key === 'ArrowUp') && jumpsLeft > 0 && !myData.finished) {
            // Check for Wall Kick
            let colLeft = checkCollision(myData.x - 5, myData.y, 30, 40);
            let colRight = checkCollision(myData.x + 5, myData.y, 30, 40);
            
            if (colLeft && colLeft.type === 1) {
                myData.vx = WALL_JUMP_X;
                myData.vy = JUMP_FORCE;
            } else if (colRight && colRight.type === 1) {
                myData.vx = -WALL_JUMP_X;
                myData.vy = JUMP_FORCE;
            } else {
                myData.vy = JUMP_FORCE;
            }
            jumpsLeft--;
        }
    });
    window.addEventListener('keyup', e => {
        if(keys.hasOwnProperty(e.key)) keys[e.key] = false;
        if(keys.hasOwnProperty(e.code)) keys[e.code] = false;
    });

    function finishRace() {
        if(roomState !== 'playing') return;
        myData.finished = true;
        myData.time = Date.now() - startTime;
        roomState = 'finished';
        showLeaderboard();
    }

    function showLeaderboard() {
        const lb = document.getElementById('leaderboard');
        const list = document.getElementById('results-list');
        lb.classList.remove('hidden');
        lb.querySelector('button').style.display = isHost ? 'inline-block' : 'none';

        let allPlayers = Object.values(players).concat(myData);
        allPlayers.sort((a,b) => {
            if(!a.finished && !b.finished) return 0;
            if(!a.finished) return 1;
            if(!b.finished) return -1;
            return a.time - b.time;
        });

        list.innerHTML = allPlayers.map((p, i) => {
            let timeStr = p.finished ? (p.time / 1000).toFixed(2) + "s" : "DNF";
            return `<div>${i+1}. <span style="color:${p.color}; font-weight:bold;">${p.name}</span> - ${timeStr}</div>`;
        }).join('');
    }

    function gameLoop() {
        updatePhysics();
        if(roomState === 'playing' && !myData.finished) {
            let t = Date.now() - startTime;
            document.getElementById('timer-display').innerText = (t/1000).toFixed(2) + "s";
        }

        camera.x += (myData.x - canvas.width/2 - camera.x) * 0.1;
        camera.y += (myData.y - canvas.height/2 - camera.y) * 0.1;
        camera.x = Math.max(0, Math.min(camera.x, currentMap.width - canvas.width));

        ctx.fillStyle = '#0a0a0f'; 
        ctx.fillRect(0,0,canvas.width,canvas.height);
        
        ctx.save();
        if(roomState !== 'menu') {
            ctx.translate(-camera.x, -camera.y);
            currentMap.blocks.forEach(b => {
                ctx.shadowBlur = 0;
                if(b.type === 1) {
                    ctx.fillStyle = '#16213e';
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.strokeStyle = '#00f2ff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(b.x, b.y, b.w, b.h);
                } else if(b.type === 2) {
                    ctx.fillStyle = '#ff0044';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ff0044';
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                } else if(b.type === 3) {
                    ctx.fillStyle = '#ffaa00';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ffaa00';
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                } else if(b.type === 4) {
                    ctx.fillStyle = '#00ff88';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00ff88';
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                }
            });

            for(let id in players) {
                let p = players[id];
                p.x += (p.tx - p.x) * 0.3; 
                p.y += (p.ty - p.y) * 0.3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 30, 40);
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white'; 
                ctx.font = '12px sans-serif'; 
                ctx.textAlign = 'center';
                ctx.fillText(p.name, p.x + 15, p.y - 10);
            }

            ctx.shadowBlur = 15;
            ctx.shadowColor = myData.color;
            ctx.fillStyle = myData.color;
            ctx.fillRect(myData.x, myData.y, 30, 40);
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white'; 
            ctx.font = 'bold 12px sans-serif'; 
            ctx.textAlign = 'center';
            ctx.fillText(myData.name, myData.x + 15, myData.y - 10);
        }
        ctx.restore();
        requestAnimationFrame(gameLoop);
    }

    initSupabase();

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
</script>
</body>
</html>
