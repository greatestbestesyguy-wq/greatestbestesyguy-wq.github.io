<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Ascent Multiplayer</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0f; font-family: 'Segoe UI', sans-serif; color: white; user-select: none; }
        canvas { display: block; }
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 10, 15, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .panel { background: #16213e; padding: 30px; border-radius: 12px; border: 2px solid #0f3460; text-align: center; width: 400px; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
        input, button, select { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; font-size: 16px; box-sizing: border-box; }
        input, select { background: #0f3460; color: white; border: 1px solid #1a1a2e; }
        button { background: #e94560; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: #ff5773; box-shadow: 0 0 15px rgba(233, 69, 96, 0.4); }
        .hidden { display: none !important; }
        .lobby-list { max-height: 200px; overflow-y: auto; margin-top: 15px; text-align: left; background: #0b1221; padding: 10px; border-radius: 6px; }
        .lobby-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #1a1a2e; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 50; pointer-events: none; }
        .hud-box { background: rgba(22, 33, 62, 0.9); padding: 12px 20px; border-left: 4px solid #00f2ff; border-radius: 4px; font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        #leaderboard { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 15, 0.95); padding: 40px; border-radius: 10px; border: 2px solid #e94560; text-align: center; z-index: 80; min-width: 300px; }
    </style>
</head>
<body>

<div id="menu-overlay" class="overlay">
    <div class="panel">
        <h1 style="color:#00f2ff; margin:0 0 10px 0; text-shadow: 0 0 10px #00f2ff;">NEON RACER</h1>
        <input type="text" id="username" placeholder="Enter Username" maxlength="12">
        <button onclick="createLobby()">Create New Lobby</button>
        <div class="lobby-list" id="active-lobbies">
            <div style="text-align: center; color: #888;">Scanning for lobbies...</div>
        </div>
    </div>
</div>

<div id="lobby-overlay" class="overlay hidden">
    <div class="panel">
        <h2 id="lobby-title" style="color: #00f2ff;">Lobby</h2>
        <div id="host-controls" class="hidden">
            <label style="display: block; margin-top: 10px; text-align: left; font-size: 14px; color: #888;">
                <input type="checkbox" id="double-jump-toggle" checked style="width: auto;"> Enable Double Jump
            </label>
            <button onclick="startGame()">START RACE</button>
        </div>
        <div id="guest-controls">
            <p>Waiting for Host...</p>
        </div>
        <button onclick="leaveLobby()" style="background: #333; margin-top: 20px;">Leave Lobby</button>
    </div>
</div>

<div id="ui" class="hidden">
    <div class="hud-box" id="timer-display">0.00s</div>
    <div class="hud-box" id="coin-display" style="border-left-color: #ffd700; color: #ffd700;">Coins: 0 / 15</div>
</div>

<div id="leaderboard" class="hidden">
    <h2 style="color: #e94560;">Race Results</h2>
    <div id="results-list" style="margin-bottom: 20px; font-size: 18px; line-height: 1.8;"></div>
    <button onclick="returnToLobby()">Return to Lobby</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- CONFIG & MULTIPLAYER ---
    let supabaseClient;
    const myId = Math.random().toString(36).substr(2, 9);
    let myData = { id: myId, name: '', x: 100, y: 600, vx: 0, vy: 0, color: `hsl(${Math.random()*360}, 100%, 60%)`, finished: false, time: 0, score: 0 };
    let players = {};
    let currentRoomId = null;
    let roomState = 'menu';
    let isHost = false;
    let startTime = 0;
    let gameTime = 0;

    // Physics
    const GRAVITY = 0.5;
    const JUMP_FORCE = -11;
    const SPEED = 5;
    const FRICTION = 0.8;
    let jumpsLeft = 2;
    let roomSettings = { doubleJump: true };
    let camera = { x: 0, y: 0 };
    const keys = {};

    // --- THE WORLD (Integrated 11,000px Gauntlet) ---
    // Types: 0: Solid, 1: Lava, 2: Checkpoint, 3: Goal, 4: Bounce, 5: Coin, 6: Blink
    const levelBlocks = [
        { x: 0, y: 700, w: 500, h: 100, type: 0 },
        { x: 250, y: 650, w: 20, h: 20, type: 5 }, 
        { x: 600, y: 650, w: 150, h: 20, type: 0 },
        { x: 850, y: 600, w: 150, h: 20, type: 0 },
        { x: 1100, y: 550, w: 150, h: 20, type: 0 },
        { x: 1300, y: 600, w: 200, h: 200, type: 0 },
        { x: 1350, y: 550, w: 100, h: 10, type: 2 }, // CP1
        { x: 1500, y: 850, w: 2000, h: 50, type: 1 }, // Lava
        { x: 1700, y: 630, w: 50, h: 20, type: 4 }, // Bounce
        { x: 1900, y: 300, w: 150, h: 20, type: 0 },
        { x: 2450, y: 480, w: 50, h: 20, type: 4 }, 
        { x: 2950, y: 550, w: 200, h: 300, type: 0 },
        { x: 3000, y: 500, w: 100, h: 10, type: 2 }, // CP2
        { x: 3250, y: 550, w: 100, h: 20, type: 6, interval: 100, offset: 0 },
        { x: 3450, y: 500, w: 100, h: 20, type: 6, interval: 100, offset: 50 },
        { x: 4750, y: 450, w: 200, h: 500, type: 0 },
        { x: 4800, y: 400, w: 100, h: 10, type: 2 }, // CP3
        { x: 4750, y: 900, w: 6000, h: 50, type: 1 }, // Giant Floor Lava
        { x: 5320, y: 630, w: 40, h: 20, type: 4 },
        { x: 6215, y: 680, w: 20, h: 20, type: 4 },
        { x: 6850, y: 400, w: 200, h: 600, type: 0 },
        { x: 6900, y: 350, w: 100, h: 10, type: 2 }, // CP4
        { x: 9450, y: 350, w: 200, h: 800, type: 0 },
        { x: 9500, y: 300, w: 100, h: 10, type: 2 }, // CP5
        { x: 10600, y: 150, w: 60, h: 60, type: 3 }, // GOAL
        { x: 10500, y: 250, w: 400, h: 1200, type: 0 }
    ];

    // Add 15 Coins randomly on platforms
    for(let i=0; i<15; i++) {
        levelBlocks.push({ x: 1000 + (i*600), y: 300, w: 20, h: 20, type: 5, id: i });
    }

    // --- SUPABASE WRAPPERS ---
    async function initSupabase() {
        supabaseClient = supabase.createClient(window.location.origin + '/supabase', 'sb_publishable_rIUr6wF4GKnrhuG_DMFbEw_9IOrXgw7');
        setInterval(fetchLobbies, 3000);
        setInterval(syncPlayer, 50);
        setInterval(syncRoom, 500);
        requestAnimationFrame(gameLoop);
    }

    async function fetchLobbies() {
        if(roomState !== 'menu') return;
        const { data } = await supabaseClient.from('rooms').select('*').eq('state', 'lobby');
        const list = document.getElementById('active-lobbies');
        list.innerHTML = data?.length ? '' : '<div style="color:#888;">No active lobbies.</div>';
        data?.forEach(room => {
            const div = document.createElement('div');
            div.className = 'lobby-item';
            div.innerHTML = `<span>Room ${room.id.substr(-4)}</span> <button style="width:auto;" onclick="joinLobby('${room.id}')">Join</button>`;
            list.appendChild(div);
        });
    }

    async function createLobby() {
        myData.name = document.getElementById('username').value || 'Pilot';
        currentRoomId = 'room_' + Math.random().toString(36).substr(2, 6);
        isHost = true;
        roomState = 'lobby';
        await supabaseClient.from('rooms').insert({ id: currentRoomId, host_id: myId, state: 'lobby', settings: roomSettings });
        enterLobbyUI();
    }

    async function joinLobby(id) {
        myData.name = document.getElementById('username').value || 'Runner';
        currentRoomId = id;
        isHost = false;
        roomState = 'lobby';
        enterLobbyUI();
    }

    function enterLobbyUI() {
        document.getElementById('menu-overlay').classList.add('hidden');
        document.getElementById('lobby-overlay').classList.remove('hidden');
        document.getElementById('host-controls').classList.toggle('hidden', !isHost);
        document.getElementById('guest-controls').classList.toggle('hidden', isHost);
    }

    async function startGame() {
        if(!isHost) return;
        roomSettings.doubleJump = document.getElementById('double-jump-toggle').checked;
        await supabaseClient.from('rooms').update({ state: 'playing', settings: roomSettings }).eq('id', currentRoomId);
    }

    // --- PHYSICS ENGINE ---
    function updatePhysics() {
        if(roomState !== 'playing' || myData.finished) return;
        gameTime++;

        myData.vy += GRAVITY;
        if(keys['a'] || keys['ArrowLeft']) myData.vx -= 0.8;
        if(keys['d'] || keys['ArrowRight']) myData.vx += 0.8;
        myData.vx *= FRICTION;

        myData.x += myData.vx;
        handleCollisions('x');
        myData.y += myData.vy;
        handleCollisions('y');

        if(myData.y > 2000) respawn();
    }

    function handleCollisions(axis) {
        levelBlocks.forEach(b => {
            let activeBlink = b.type === 6 ? ((gameTime + b.offset) % b.interval < b.interval/2) : true;
            if(!activeBlink && b.type === 6) return;

            if(myData.x < b.x + b.w && myData.x + 30 > b.x && myData.y < b.y + b.h && myData.y + 30 > b.y) {
                if(b.type === 0 || b.type === 6) {
                    if(axis === 'x') {
                        myData.x -= myData.vx;
                        myData.vx = 0;
                    } else {
                        if(myData.vy > 0) {
                            myData.y = b.y - 30;
                            jumpsLeft = roomSettings.doubleJump ? 2 : 1;
                        } else {
                            myData.y = b.y + b.h;
                        }
                        myData.vy = 0;
                    }
                } else if (b.type === 1) respawn();
                else if (b.type === 4 && axis === 'y' && myData.vy > 0) {
                    myData.vy = JUMP_FORCE * 1.8;
                    jumpsLeft = 1;
                }
                else if (b.type === 5 && !b.collected) {
                    b.collected = true;
                    myData.score++;
                    document.getElementById('coin-display').innerText = `Coins: ${myData.score} / 15`;
                }
                else if (b.type === 2) {
                    myData.spawnX = b.x; myData.spawnY = b.y - 50;
                }
                else if (b.type === 3) finishRace();
            }
        });
    }

    function respawn() {
        myData.x = myData.spawnX || 100;
        myData.y = myData.spawnY || 600;
        myData.vx = 0; myData.vy = 0;
    }

    function finishRace() {
        myData.finished = true;
        myData.time = Date.now() - startTime;
        showLeaderboard();
    }

    // --- RENDER ---
    function gameLoop() {
        updatePhysics();
        if(roomState === 'playing') {
            camera.x += (myData.x - canvas.width/2 - camera.x) * 0.1;
            camera.y += (myData.y - canvas.height/2 - camera.y) * 0.1;
            document.getElementById('timer-display').innerText = ((Date.now() - startTime)/1000).toFixed(2) + "s";
        }

        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        levelBlocks.forEach(b => {
            ctx.shadowBlur = 0;
            if(b.type === 0) {
                ctx.fillStyle = '#16213e';
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.strokeStyle = '#00f2ff';
                ctx.strokeRect(b.x, b.y, b.w, b.h);
            } else if(b.type === 1) {
                ctx.fillStyle = '#ff0044';
                ctx.shadowBlur = 15; ctx.shadowColor = '#ff0044';
                ctx.fillRect(b.x, b.y + Math.sin(gameTime*0.1)*5, b.w, b.h);
            } else if(b.type === 4) {
                ctx.fillStyle = '#00ff44';
                ctx.fillRect(b.x, b.y, b.w, b.h);
            } else if(b.type === 5 && !b.collected) {
                ctx.fillStyle = '#ffd700';
                ctx.beginPath(); ctx.arc(b.x+10, b.y+10, 8, 0, Math.PI*2); ctx.fill();
            } else if(b.type === 6) {
                let active = (gameTime + b.offset) % b.interval < b.interval/2;
                ctx.globalAlpha = active ? 1 : 0.2;
                ctx.fillStyle = '#8a2be2';
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.globalAlpha = 1;
            } else if(b.type === 3) {
                ctx.fillStyle = '#ffaa00'; ctx.fillRect(b.x, b.y, b.w, b.h);
            }
        });

        // Players
        Object.values(players).forEach(p => {
            ctx.fillStyle = p.color; ctx.globalAlpha = 0.6;
            ctx.fillRect(p.x, p.y, 30, 30);
            ctx.fillStyle = 'white'; ctx.fillText(p.name, p.x, p.y - 10);
        });
        ctx.globalAlpha = 1;
        ctx.fillStyle = myData.color; ctx.shadowBlur = 15; ctx.shadowColor = myData.color;
        ctx.fillRect(myData.x, myData.y, 30, 30);
        
        ctx.restore();
        requestAnimationFrame(gameLoop);
    }

    // --- INPUTS ---
    window.addEventListener('keydown', e => {
        keys[e.key] = true;
        if((e.key === ' ' || e.key === 'w' || e.key === 'ArrowUp') && jumpsLeft > 0) {
            myData.vy = JUMP_FORCE;
            jumpsLeft--;
        }
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    // Sync helpers
    async function syncPlayer() {
        if(!currentRoomId) return;
        await supabaseClient.from('players').upsert({ id: myId, room_id: currentRoomId, x: myData.x, y: myData.y, name: myData.name, color: myData.color, finished: myData.finished, time: myData.time });
        const { data } = await supabaseClient.from('players').select('*').eq('room_id', currentRoomId).neq('id', myId);
        if(data) data.forEach(p => players[p.id] = p);
    }

    async function syncRoom() {
        if(!currentRoomId) return;
        const { data } = await supabaseClient.from('rooms').select('*').eq('id', currentRoomId).maybeSingle();
        if(data) {
            roomSettings = data.settings;
            if(data.state === 'playing' && roomState === 'lobby') {
                roomState = 'playing'; startTime = Date.now();
                document.getElementById('lobby-overlay').classList.add('hidden');
                document.getElementById('ui').classList.remove('hidden');
            }
        }
    }

    function showLeaderboard() {
        document.getElementById('leaderboard').classList.remove('hidden');
        const list = document.getElementById('results-list');
        const all = [...Object.values(players), myData].sort((a,b) => a.time - b.time);
        list.innerHTML = all.map(p => `<div>${p.name}: ${p.finished ? (p.time/1000).toFixed(2)+'s' : 'Racing...'}</div>`).join('');
    }

    initSupabase();
</script>
</body>
</html>
