<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tycoon Wars - V3</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #02020a; font-family: 'Segoe UI', sans-serif; color: white; user-select: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        .hud-box { background: rgba(10, 10, 25, 0.9); padding: 12px 20px; border-left: 4px solid #00f2ff; border-radius: 4px; margin-bottom: 10px; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #050510; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .panel { background: #111122; padding: 40px; border-radius: 12px; border: 1px solid #333; text-align: center; width: 300px; }
        input, button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 6px; border: none; font-size: 16px; }
        input { background: #050510; color: white; border: 1px solid #444; }
        button { background: #00f2ff; color: #000; font-weight: bold; cursor: pointer; }
        #damage-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: red; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="panel">
        <h1 style="color:#00f2ff; margin:0 0 10px 0;">NEON TYCOON</h1>
        <input type="text" id="username" placeholder="Username" maxlength="12">
        <button onclick="joinGame()">SPAWN</button>
    </div>
</div>

<div id="ui">
    <div class="hud-box">
        <div style="font-size: 11px; color: #888;">CASH</div>
        <div id="wallet-display" style="font-size: 24px; font-weight: bold; color: #00ffaa;">$0</div>
    </div>
    <div class="hud-box" style="border-left-color: #ff0055;">
        <div style="font-size: 11px; color: #888;">HP</div>
        <div id="health-display" style="font-size: 24px; font-weight: bold; color: #ff0055;">100</div>
    </div>
</div>
<div id="damage-overlay"></div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let supabaseClient;
    const myId = Math.random().toString(36).substr(2, 9);
    
    // --- 8 PLOTS CONFIG ---
    const PLOT_DIST = 3000;
    const PLOTS = [];
    const colors = ['#00f2ff', '#ff0055', '#00ffaa', '#ffaa00', '#aa00ff', '#ffff00', '#00ff00', '#ff00ff'];
    for(let i=0; i<8; i++) {
        const a = i * (Math.PI / 4);
        PLOTS.push({ id: i, x: Math.cos(a) * PLOT_DIST, y: Math.sin(a) * PLOT_DIST, color: colors[i] });
    }

    const ITEMS = {
        'claim': { name: "Claim", cost: 0, bx: 0, by: 200, type: 'claim' },
        'mine_1': { name: "Mine I", cost: 50, bx: -150, by: -150, rx: -150, ry: -200, income: 5, req: 'claim' },
        'walls': { name: "Walls", cost: 200, bx: 150, by: 150, type: 'visual', req: 'mine_1' },
        'mine_2': { name: "Mine II", cost: 500, bx: -50, by: -150, rx: -50, ry: -200, income: 15, req: 'walls' },
        'pistol': { name: "Laser Pistol", cost: 1000, bx: -150, by: 50, type: 'weapon', req: 'mine_2' },
        'shield': { name: "Neon Shield", cost: 2500, bx: 150, by: 0, type: 'visual', req: 'pistol' },
        'rifle': { name: "Plasma Rifle", cost: 5000, bx: -150, by: 150, type: 'weapon', req: 'shield' }
    };

    let myData = { id: myId, name: '', cash: 0, vault: 0, health: 100, plot: -1, unlocked: [], x: 0, y: 0, color: '#fff' };
    let players = {};
    let lasers = [];
    let camX = 0, camY = 0;
    const keys = { w:0, a:0, s:0, d:0 };
    let mouseX = 0, mouseY = 0;
    let lastShot = 0;

    async function joinGame() {
        const name = document.getElementById('username').value.trim();
        if(!name) return;
        myData.name = name;
        document.getElementById('login-overlay').style.display = 'none';
        
        supabaseClient = supabase.createClient(window.location.origin + '/supabase', 'sb_publishable_rIUr6wF4GKnrhuG_DMFbEw_9IOrXgw7');
        const { data } = await supabaseClient.from('players').select('*').eq('id', myId).maybeSingle();
        if(data) {
            myData.cash = data.cash || 0;
            myData.unlocked = data.unlocked_items || [];
            myData.plot = data.plot ?? -1;
            if(myData.plot !== -1) myData.color = PLOTS[myData.plot].color;
        }

        setInterval(sync, 100);
        setInterval(() => {
            if(myData.plot === -1) return;
            let inc = 0;
            myData.unlocked.forEach(id => { if(ITEMS[id]?.income) inc += ITEMS[id].income; });
            myData.vault += inc;
        }, 1000);
        requestAnimationFrame(loop);
    }

    async function sync() {
        await supabaseClient.from('players').upsert({
            id: myId, name: myData.name, x: myData.x, y: myData.y,
            cash: myData.cash, vault: myData.vault, health: myData.health,
            plot: myData.plot, unlocked_items: myData.unlocked,
            color: myData.color, last_seen: new Date().toISOString()
        });
        const { data } = await supabaseClient.from('players').select('*').neq('id', myId);
        if(data) {
            data.forEach(p => {
                if(!players[p.id]) players[p.id] = { ...p, sx: p.x, sy: p.y };
                else Object.assign(players[p.id], p);
            });
        }
        document.getElementById('wallet-display').innerText = "$" + Math.floor(myData.cash);
        document.getElementById('health-display').innerText = myData.health;
    }

    function checkInteractions() {
        // Hub Teleporters
        if(Math.hypot(myData.x, myData.y) < 600) {
            PLOTS.forEach(p => {
                const a = p.id * (Math.PI/4);
                const tx = Math.cos(a)*250, ty = Math.sin(a)*250;
                if(Math.hypot(myData.x - tx, myData.y - ty) < 40) {
                    myData.x = p.x; myData.y = p.y + 550; // Land well outside the return pad
                }
            });
        }

        // Plot Logic
        PLOTS.forEach(p => {
            const dist = Math.hypot(myData.x - p.x, myData.y - p.y);
            if(dist > 1000) return;

            // Return Pad
            if(Math.hypot(myData.x - p.x, myData.y - (p.y+450)) < 40) {
                myData.x = 0; myData.y = 0;
            }

            // Ownership check
            let owner = (myData.plot === p.id) ? myData : Object.values(players).find(pl => pl.plot === p.id);
            
            if(!owner && myData.plot === -1) {
                if(Math.hypot(myData.x - p.x, myData.y - (p.y+200)) < 30) {
                    myData.plot = p.id; myData.unlocked.push('claim'); myData.color = p.color;
                }
            } else if(owner?.id === myId) {
                if(dist < 50) { myData.cash += myData.vault; myData.vault = 0; }
                for(let id in ITEMS) {
                    const it = ITEMS[id];
                    if(myData.unlocked.includes(id) || (it.req && !myData.unlocked.includes(it.req))) continue;
                    if(Math.hypot(myData.x - (p.x+it.bx), myData.y - (p.y+it.by)) < 30 && myData.cash >= it.cost) {
                        myData.cash -= it.cost; myData.unlocked.push(id);
                    }
                }
            }
        });
    }

    window.addEventListener('mousedown', async () => {
        const pistol = myData.unlocked.includes('pistol'), rifle = myData.unlocked.includes('rifle');
        if(!pistol && !rifle) return;
        const now = Date.now(), cd = rifle ? 150 : 400;
        if(now - lastShot < cd) return;
        lastShot = now;

        const tx = mouseX - canvas.width/2 + camX, ty = mouseY - canvas.height/2 + camY;
        const ang = Math.atan2(ty - myData.y, tx - myData.x);
        const ex = myData.x + Math.cos(ang)*800, ey = myData.y + Math.sin(ang)*800;
        lasers.push({ x1: myData.x, y1: myData.y, x2: ex, y2: ey, a: 1, c: rifle ? '#ff00ff' : '#00f2ff' });

        for(let id in players) {
            let p = players[id];
            const d = pointDistToLine(p.sx, p.sy, myData.x, myData.y, ex, ey);
            if(d < 30) await supabaseClient.from('players').update({ health: Math.max(0, p.health - (rifle?25:12)) }).eq('id', id);
        }
    });

    function pointDistToLine(px, py, x1, y1, x2, y2) {
        const l2 = Math.pow(x2-x1,2) + Math.pow(y2-y1,2);
        if(l2==0) return Math.hypot(px-x1, py-y1);
        let t = ((px-x1)*(x2-x1)+(py-y1)*(y2-y1))/l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px-(x1+t*(x2-x1)), py-(y1+t*(y2-y1)));
    }

    function loop() {
        if(myData.health <= 0) { myData.health=100; myData.x=0; myData.y=0; }
        if(keys.w) myData.y -= 7; if(keys.s) myData.y += 7; if(keys.a) myData.x -= 7; if(keys.d) myData.x += 7;
        checkInteractions();
        camX += (myData.x - camX)*0.1; camY += (myData.y - camY)*0.1;

        ctx.fillStyle = '#02020a'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.save(); ctx.translate(canvas.width/2-camX, canvas.height/2-camY);
        
        // Hub & Leaderboard
        ctx.fillStyle = '#0a0a15'; ctx.beginPath(); ctx.arc(0,0,600,0,Math.PI*2); ctx.fill();
        ctx.textAlign = 'center'; ctx.fillStyle = '#00f2ff'; ctx.font = 'bold 30px sans-serif';
        ctx.fillText("NEON HUB", 0, -150);
        
        let lb = Object.values(players).concat(myData).sort((a,b)=>b.cash-a.cash).slice(0,5);
        lb.forEach((p,i) => {
            ctx.fillStyle = p.color || '#fff'; ctx.font = '16px monospace';
            ctx.fillText(`${i+1}. ${p.name.padEnd(12)} $${Math.floor(p.cash)}`, 0, -80 + (i*25));
        });

        PLOTS.forEach(p => {
            const tx = Math.cos(p.id*(Math.PI/4))*250, ty = Math.sin(p.id*(Math.PI/4))*250;
            ctx.fillStyle = p.color; ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.arc(tx,ty,40,0,Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1; ctx.strokeStyle = '#fff'; ctx.stroke();
            
            // Plot Drawing
            ctx.fillStyle = '#080810'; ctx.fillRect(p.x-300, p.y-300, 600, 600);
            ctx.strokeStyle = p.color; ctx.strokeRect(p.x-300, p.y-300, 600, 600);
            
            let owner = (myData.plot === p.id) ? myData : Object.values(players).find(pl => pl.plot === p.id);
            ctx.fillStyle = '#fff'; ctx.fillText(owner ? owner.name : "EMPTY", p.x, p.y-320);
            
            // Vault
            ctx.fillStyle = (owner?.vault > 0) ? '#00ffaa' : '#222';
            ctx.fillRect(p.x-30, p.y-30, 60, 60);

            // Return Pad
            ctx.fillStyle = '#444'; ctx.beginPath(); ctx.arc(p.x, p.y+450, 40, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.fillText("HUB", p.x, p.y+453);

            let items = owner?.unlocked_items || owner?.unlocked || [];
            items.forEach(id => {
                const it = ITEMS[id];
                if(it?.income) {
                    ctx.fillStyle = p.color; ctx.fillRect(p.x+it.rx-15, p.y+it.ry-15, 30, 30);
                    ctx.strokeStyle = '#333'; ctx.lineWidth=8; ctx.beginPath(); ctx.moveTo(p.x+it.rx, p.y+it.ry); ctx.lineTo(p.x, p.y); ctx.stroke();
                }
                if(id==='walls') { ctx.strokeStyle = '#555'; ctx.lineWidth=10; ctx.strokeRect(p.x-300, p.y-300, 600, 600); }
                if(id==='shield') { ctx.strokeStyle = p.color; ctx.shadowBlur=15; ctx.shadowColor=p.color; ctx.strokeRect(p.x-310, p.y-310, 620, 620); ctx.shadowBlur=0; }
            });

            if(owner?.id === myId || (!owner && myData.plot === -1)) {
                for(let id in ITEMS) {
                    const it = ITEMS[id];
                    if(items.includes(id) || (it.req && !items.includes(it.req))) continue;
                    if(!owner && it.type !== 'claim') continue;
                    ctx.fillStyle = myData.cash >= it.cost ? '#00ffaa' : '#ff0055';
                    ctx.beginPath(); ctx.arc(p.x+it.bx, p.y+it.by, 20, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.fillText(it.name, p.x+it.bx, p.y+it.by-25);
                }
            }
        });

        lasers = lasers.filter(l => {
            ctx.strokeStyle = l.c; ctx.globalAlpha = l.a; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
            l.a -= 0.1; return l.a > 0;
        });

        const drawP = (x,y,n,c,h) => {
            ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x,y,15,0,Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.fillText(n, x, y-25);
            ctx.fillStyle = '#444'; ctx.fillRect(x-20, y-20, 40, 4);
            ctx.fillStyle = '#ff0055'; ctx.fillRect(x-20, y-20, 40*(h/100), 4);
        };
        for(let id in players) {
            let p = players[id]; p.sx += (p.x - p.sx)*0.2; p.sy += (p.y - p.sy)*0.2;
            drawP(p.sx, p.sy, p.name, p.color, p.health);
        }
        drawP(myData.x, myData.y, myData.name, myData.color, myData.health);

        ctx.restore(); ctx.globalAlpha = 1;
        requestAnimationFrame(loop);
    }

    window.onkeydown = e => keys[e.key.toLowerCase()] = 1;
    window.onkeyup = e => keys[e.key.toLowerCase()] = 0;
    window.onmousemove = e => { mouseX = e.clientX; mouseY = e.clientY; };
</script>
</body>
</html>
