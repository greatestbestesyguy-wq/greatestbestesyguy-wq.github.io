<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supabase Race - .COM Version</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; }
        #ui { margin-top: 20vh; background: #333; padding: 20px; display: inline-block; border-radius: 10px; border: 2px solid #3ecf8e; }
        canvas { display: block; background: #222; margin: 0 auto; }
        input, button { padding: 10px; margin: 5px; border-radius: 5px; border: none; }
        button { background: #3ecf8e; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <h1>SUPABASE RACE</h1>
        <input type="text" id="nameInput" placeholder="Name..." maxlength="10">
        <button onclick="startGame()">JOIN</button>
    </div>
    <canvas id="gameCanvas" style="display:none;"></canvas>

<script>
    // --- STEP 1: CHANGE .CO TO .COM ---
    const SUPABASE_URL = 'https://wraecvlsqeevehjiqfrg.supabase.com'; 
    const SUPABASE_KEY = 'sb_publishable_rIUr6wF4GKnrhuG_DMFbEw_9IOrXgw7';
    
    const { createClient } = supabase;

    // --- STEP 2: REMOVE CUSTOM TRANSPORT FOR NOW ---
    // Sometimes the "this.transport" error is caused by the library 
    // failing to find the 'longpolling' module if the CDN is partially blocked.
    // Let's try the default first with the .com URL.
    const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let myPlayer = { id: Math.random().toString(36).substring(7), name: '', x: 50, y: 100, color: 'lime' };
    let otherPlayers = {};
    let channel;

    async function startGame() {
        myPlayer.name = document.getElementById('nameInput').value || 'Player';
        document.getElementById('ui').style.display = 'none';
        canvas.style.display = 'block';
        canvas.width = 800;
        canvas.height = 400;

        channel = _supabase.channel('room1');

        channel.on('broadcast', { event: 'move' }, ({ payload }) => {
            otherPlayers[payload.id] = payload;
        });

        await channel.subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                console.log("Connected successfully!");
                gameLoop();
            } else {
                console.log("Status:", status);
            }
        });
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw Ground
        ctx.fillStyle = '#444';
        ctx.fillRect(0, 350, 800, 50);

        // Movement (Simple)
        window.onkeydown = (e) => {
            if (e.key === 'ArrowRight') myPlayer.x += 10;
            if (e.key === 'ArrowLeft') myPlayer.x -= 10;
            
            // Send position
            channel.send({
                type: 'broadcast',
                event: 'move',
                payload: myPlayer
            });
        };

        // Draw Me
        ctx.fillStyle = myPlayer.color;
        ctx.fillRect(myPlayer.x, 320, 30, 30);
        ctx.fillStyle = 'white';
        ctx.fillText(myPlayer.name, myPlayer.x, 310);

        // Draw Others
        Object.values(otherPlayers).forEach(p => {
            ctx.fillStyle = 'red';
            ctx.fillRect(p.x, 320, 30, 30);
            ctx.fillText(p.name, p.x, 310);
        });

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
