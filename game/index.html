<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Drift - Multiplayer</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a12; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; user-select: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; text-shadow: 0 0 5px black; }
        #leaderboard { position: absolute; top: 20px; right: 20px; text-align: right; pointer-events: none; text-shadow: 0 0 5px black; }
        
        #login-overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: rgba(10, 10, 18, 0.9); display: flex; justify-content: center; align-items: center; z-index: 100;
            backdrop-filter: blur(5px);
        }
        .panel {
            background: #151522; padding: 40px; border-radius: 12px; border: 1px solid #333;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2); text-align: center; width: 300px;
        }
        input { 
            width: 100%; padding: 12px; margin: 15px 0; background: #0a0a12; border: 1px solid #444; 
            color: white; border-radius: 6px; box-sizing: border-box; font-size: 16px; outline: none;
        }
        input:focus { border-color: #00f2ff; box-shadow: 0 0 10px rgba(0,242,255,0.3); }
        button { 
            width: 100%; padding: 12px; background: #00f2ff; color: #000; border: none; 
            border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #00c2cc; transform: scale(1.02); }
        h1 { margin-top: 0; color: #00f2ff; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="panel">
        <h1>Neon Drift</h1>
        <p style="color:#aaa; font-size:14px; margin-bottom: 20px;">Fight for the center. Drift to survive.</p>
        <input type="text" id="username" placeholder="Enter Pilot Name" maxlength="12">
        <button onclick="startGame()">ENTER ARENA</button>
    </div>
</div>

<div id="ui">
    <div id="status" style="color: #00f2ff; font-weight: bold;">Connecting to Proxy...</div>
    <div style="margin-top:10px; color:#aaa; font-size: 14px;">Controls: W, A, S, D or Arrows to thrust.</div>
</div>

<div id="leaderboard">
    <h3 style="margin: 0 0 10px 0; color: #ff0055;">LEADERBOARD</h3>
    <div id="lb-list"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    let supabaseClient;
    const myId = Math.random().toString(36).substr(2, 9);
    
    // Generate a random neon color for this player
    const colors = ['#00f2ff', '#ff0055', '#00ffaa', '#ffaa00', '#aa00ff'];
    const myColor = colors[Math.floor(Math.random() * colors.length)];

    let players = {};
    let myPlayer = { 
        name: '', x: Math.random() * 800 - 400, y: Math.random() * 800 - 400, 
        vx: 0, vy: 0, score: 0, history: [] 
    };

    const keys = { w:false, a:false, s:false, d:false, ArrowUp:false, ArrowLeft:false, ArrowDown:false, ArrowRight:false };

    // --- SUPABASE PROXY INIT ---
    function initSupabase() {
        const PROXY_URL = window.location.origin + '/supabase';
        const API_KEY = 'sb_publishable_rIUr6wF4GKnrhuG_DMFbEw_9IOrXgw7';
        
        supabaseClient = supabase.createClient(PROXY_URL, API_KEY);
        document.getElementById('status').innerText = "SYSTEM ONLINE";
        
        // Fast polling for movement, slower for cleanup
        setInterval(syncMyPosition, 100);
        setInterval(fetchOtherPlayers, 100);
        setInterval(updateLeaderboard, 1000);
    }

    async function syncMyPosition() {
        if (!supabaseClient) return;
        await supabaseClient.from('players').upsert({ 
            id: myId, name: myPlayer.name, x: myPlayer.x, y: myPlayer.y, 
            score: Math.floor(myPlayer.score), color: myColor, last_seen: new Date().toISOString() 
        });
    }

    async function fetchOtherPlayers() {
        if (!supabaseClient) return;
        const { data } = await supabaseClient.from('players').select('*').neq('id', myId);
        if (data) {
            const now = new Date();
            data.forEach(p => {
                // Ignore players who haven't updated in 5 seconds (ghosts)
                if (now - new Date(p.last_seen) > 5000) return; 

                if (!players[p.id]) {
                    // New player discovered
                    players[p.id] = { ...p, targetX: p.x, targetY: p.y, history: [] };
                } else {
                    // Update target for Lerping
                    players[p.id].targetX = p.x;
                    players[p.id].targetY = p.y;
                    players[p.id].score = p.score;
                    players[p.id].color = p.color;
                }
            });
        }
    }

    function updateLeaderboard() {
        let all = Object.values(players);
        all.push({ name: myPlayer.name, score: Math.floor(myPlayer.score), color: myColor });
        all.sort((a, b) => b.score - a.score);
        
        let html = '';
        all.slice(0, 5).forEach((p, i) => {
            html += `<div style="color:${p.color}; margin-bottom:5px;">${i+1}. ${p.name} - ${p.score}</div>`;
        });
        document.getElementById('lb-list').innerHTML = html;
    }

    // --- GAME ENGINE ---
    function startGame() {
        const name = document.getElementById('username').value.trim();
        if (!name) return;
        myPlayer.name = name;
        document.getElementById('login-overlay').style.display = 'none';
        initSupabase();
        requestAnimationFrame(gameLoop);
    }

    function gameLoop() {
        // 1. Physics & Movement (Momentum based)
        const accel = 0.4;
        const friction = 0.96; // Sliding friction

        if (keys.w || keys.ArrowUp) myPlayer.vy -= accel;
        if (keys.s || keys.ArrowDown) myPlayer.vy += accel;
        if (keys.a || keys.ArrowLeft) myPlayer.vx -= accel;
        if (keys.d || keys.ArrowRight) myPlayer.vx += accel;

        myPlayer.vx *= friction;
        myPlayer.vy *= friction;
        myPlayer.x += myPlayer.vx;
        myPlayer.y += myPlayer.vy;

        // Trail history
        myPlayer.history.push({x: myPlayer.x, y: myPlayer.y});
        if (myPlayer.history.length > 20) myPlayer.history.shift();

        // 2. Game Logic: King of the Hill (Center 0,0)
        const distToCenter = Math.hypot(myPlayer.x, myPlayer.y);
        if (distToCenter < 300) {
            myPlayer.score += 0.5; // Gain score while in the zone
        }

        // 3. Render Setup
        ctx.fillStyle = '#0a0a12';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        // Camera Follows Player
        ctx.translate(canvas.width/2 - myPlayer.x, canvas.height/2 - myPlayer.y);

        // Draw Infinite Grid
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 1;
        const gridSize = 100;
        const startX = Math.floor((myPlayer.x - canvas.width/2) / gridSize) * gridSize;
        const startY = Math.floor((myPlayer.y - canvas.height/2) / gridSize) * gridSize;
        
        ctx.beginPath();
        for (let x = startX; x < startX + canvas.width + gridSize; x += gridSize) {
            ctx.moveTo(x, myPlayer.y - canvas.height); ctx.lineTo(x, myPlayer.y + canvas.height);
        }
        for (let y = startY; y < startY + canvas.height + gridSize; y += gridSize) {
            ctx.moveTo(myPlayer.x - canvas.width, y); ctx.lineTo(myPlayer.x + canvas.width, y);
        }
        ctx.stroke();

        // Draw The "Hill" (Scoring Zone)
        ctx.beginPath();
        ctx.arc(0, 0, 300, 0, Math.PI * 2);
        ctx.fillStyle = distToCenter < 300 ? 'rgba(0, 242, 255, 0.15)' : 'rgba(255, 0, 85, 0.05)';
        ctx.fill();
        ctx.strokeStyle = distToCenter < 300 ? '#00f2ff' : '#ff0055';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Draw Other Players (With LERP and Trails)
        for (let id in players) {
            let p = players[id];
            
            // LERP: Move 15% towards the database target frame
            p.x += (p.targetX - p.x) * 0.15;
            p.y += (p.targetY - p.y) * 0.15;

            p.history.push({x: p.x, y: p.y});
            if (p.history.length > 20) p.history.shift();

            drawShip(p.x, p.y, p.name, p.color, p.history);
        }

        // Draw Local Player
        drawShip(myPlayer.x, myPlayer.y, myPlayer.name, myColor, myPlayer.history);

        ctx.restore();
        requestAnimationFrame(gameLoop);
    }

    function drawShip(x, y, name, color, history) {
        // Draw Trail
        if (history.length > 1) {
            ctx.beginPath();
            ctx.moveTo(history[0].x, history[0].y);
            for (let i = 1; i < history.length; i++) ctx.lineTo(history[i].x, history[i].y);
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.globalAlpha = 0.4;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        // Draw glowing ship core
        ctx.beginPath();
        ctx.arc(x, y, 12, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.shadowColor = color;
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0; // reset

        // Draw name
        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(name, x, y - 20);
    }

    // Input listening
    window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
    window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });
</script>

</body>
</html>
