<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Factory Tycoon</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0f0f1a; font-family: 'Segoe UI', sans-serif; color: white; }
        canvas { display: block; }
        
        /* UI Overlay */
        #gui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        .stat-card { background: rgba(20, 20, 35, 0.8); padding: 15px; border-left: 4px solid #00f2ff; border-radius: 4px; margin-bottom: 10px; }
        
        /* Shop Menu */
        #shop { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); 
            background: #1a1a2e; padding: 15px; border-radius: 10px; display: flex; gap: 10px;
            border: 1px solid #333; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .shop-item { 
            background: #252545; padding: 10px; border-radius: 5px; cursor: pointer; 
            text-align: center; width: 100px; transition: 0.2s; font-size: 12px;
        }
        .shop-item:hover { background: #353565; transform: translateY(-5px); }
        .shop-item.locked { opacity: 0.5; cursor: not-allowed; }

        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f0f1a; display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-box { background: #1a1a2e; padding: 40px; border-radius: 15px; text-align: center; border: 1px solid #00f2ff; }
        input { padding: 10px; width: 200px; border-radius: 5px; border: none; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #00f2ff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1 style="color:#00f2ff">CYBER TYCOON</h1>
        <input type="text" id="username" placeholder="Pilot Name" maxlength="12"><br>
        <button onclick="enterGame()">INITIALIZE BASE</button>
    </div>
</div>

<div id="gui">
    <div class="stat-card">
        <div style="font-size: 12px; color: #aaa;">CREDITS</div>
        <div id="cash-display" style="font-size: 24px; font-weight: bold; color: #00f2ff;">$0</div>
    </div>
    <div id="status" style="font-size: 12px; color: #00ffaa;">Connecting...</div>
</div>

<div id="shop">
    <div class="shop-item" onclick="buyItem('dropper_1', 50)">
        <b>Dropper T1</b><br>$50
    </div>
    <div class="shop-item" onclick="buyItem('dropper_2', 250)">
        <b>Dropper T2</b><br>$250
    </div>
    <div class="shop-item" onclick="buyItem('shield_wall', 500)">
        <b>Shield Wall</b><br>$500
    </div>
    <div class="shop-item" onclick="buyItem('neon_tower', 1000)">
        <b>Neon Tower</b><br>$1000
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let supabaseClient;
    const myId = Math.random().toString(36).substr(2, 9);
    
    // Game State
    let myData = {
        name: '',
        cash: 100,
        unlocked: [],
        x: 0, y: 0,
        color: '#00f2ff'
    };

    let otherPlayers = {};
    const keys = {};
    let camX = 0, camY = 0;

    // Define items and their positions relative to the base center
    const ITEM_DATA = {
        'dropper_1': { x: -60, y: -60, color: '#00ffaa', income: 1 },
        'dropper_2': { x: 60, y: -60, color: '#00f2ff', income: 5 },
        'shield_wall': { x: 0, y: 80, color: '#ff0055', isWall: true },
        'neon_tower': { x: 0, y: -100, color: '#aa00ff', income: 20 }
    };

    async function initSupabase() {
        const PROXY_URL = window.location.origin + '/supabase';
        const API_KEY = 'sb_publishable_rIUr6wF4GKnrhuG_DMFbEw_9IOrXgw7';
        supabaseClient = supabase.createClient(PROXY_URL, API_KEY);
        
        document.getElementById('status').innerText = "SYSTEM: ONLINE";
        
        // Load existing data if any
        const { data } = await supabaseClient.from('players').select('*').eq('id', myId).single();
        if (data) {
            myData.cash = data.cash;
            myData.unlocked = data.unlocked_items || [];
        }

        setInterval(syncToDB, 500);
        setInterval(fetchOthers, 500);
        setInterval(processIncome, 1000);
    }

    function processIncome() {
        myData.unlocked.forEach(itemId => {
            if (ITEM_DATA[itemId]?.income) {
                myData.cash += ITEM_DATA[itemId].income;
            }
        });
        document.getElementById('cash-display').innerText = "$" + Math.floor(myData.cash);
    }

    async function syncToDB() {
        if (!supabaseClient) return;
        await supabaseClient.from('players').upsert({
            id: myId, name: myData.name, cash: myData.cash,
            unlocked_items: myData.unlocked, x: myData.x, y: myData.y,
            color: myData.color, last_seen: new Date().toISOString()
        });
    }

    async function fetchOthers() {
        if (!supabaseClient) return;
        const { data } = await supabaseClient.from('players').select('*').neq('id', myId);
        if (data) {
            data.forEach(p => {
                if (new Date() - new Date(p.last_seen) > 10000) return; // Cleanup stale
                otherPlayers[p.id] = p;
            });
        }
    }

    function buyItem(id, cost) {
        if (myData.cash >= cost && !myData.unlocked.includes(id)) {
            myData.cash -= cost;
            myData.unlocked.push(id);
        }
    }

    function enterGame() {
        const name = document.getElementById('username').value;
        if (!name) return;
        myData.name = name;
        document.getElementById('login-screen').style.display = 'none';
        
        // Assign a random plot position
        myData.baseX = (Math.floor(Math.random() * 5) - 2) * 800;
        myData.baseY = (Math.floor(Math.random() * 5) - 2) * 800;
        myData.x = myData.baseX;
        myData.y = myData.baseY;

        initSupabase();
        requestAnimationFrame(loop);
    }

    function loop() {
        // Player Movement
        const speed = 5;
        if (keys['w'] || keys['ArrowUp']) myData.y -= speed;
        if (keys['s'] || keys['ArrowDown']) myData.y += speed;
        if (keys['a'] || keys['ArrowLeft']) myData.x -= speed;
        if (keys['d'] || keys['ArrowRight']) myData.x += speed;

        // Camera smoothing
        camX += (myData.x - camX) * 0.1;
        camY += (myData.y - camY) * 0.1;

        // Draw
        ctx.fillStyle = '#0f0f1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width/2 - camX, canvas.height/2 - camY);

        // Draw Grid
        ctx.strokeStyle = '#1a1a2e';
        for(let i = -5000; i < 5000; i += 100) {
            ctx.beginPath(); ctx.moveTo(i, -5000); ctx.lineTo(i, 5000); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-5000, i); ctx.lineTo(5000, i); ctx.stroke();
        }

        // Draw My Tycoon Plot
        drawTycoon(myData.baseX, myData.baseY, myData.name, myData.unlocked, true);

        // Draw Others
        for (let id in otherPlayers) {
            let p = otherPlayers[id];
            // Plot is always at a fixed location based on where they started
            // For simplicity in this demo, we assume their base is near where they are
            drawTycoon(p.x - (p.x % 100), p.y - (p.y % 100), p.name, p.unlocked_items || [], false);
            
            // Draw their ship
            ctx.fillStyle = p.color || '#fff';
            ctx.fillRect(p.x - 10, p.y - 10, 20, 20);
        }

        // Draw My Ship
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 15; ctx.shadowColor = '#00f2ff';
        ctx.fillRect(myData.x - 12, myData.y - 12, 24, 24);
        ctx.shadowBlur = 0;

        ctx.restore();
        requestAnimationFrame(loop);
    }

    function drawTycoon(bx, by, name, items, isMe) {
        // Floor
        ctx.fillStyle = isMe ? '#16162d' : '#2d1616';
        ctx.fillRect(bx - 200, by - 200, 400, 400);
        ctx.strokeStyle = isMe ? '#00f2ff' : '#ff4444';
        ctx.strokeRect(bx - 200, by - 200, 400, 400);
        
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.fillText(name + "'s Factory", bx, by - 210);

        // Draw Buildings
        items.forEach(itemId => {
            const config = ITEM_DATA[itemId];
            if (config) {
                ctx.fillStyle = config.color;
                if (config.isWall) {
                    ctx.fillRect(bx + config.x - 150, by + config.y, 300, 20);
                } else {
                    ctx.beginPath();
                    ctx.arc(bx + config.x, by + config.y, 25, 0, Math.PI*2);
                    ctx.fill();
                    // Glow effect
                    ctx.shadowBlur = 10; ctx.shadowColor = config.color;
                    ctx.stroke(); ctx.shadowBlur = 0;
                }
            }
        });
    }

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
</script>

</body>
</html>
