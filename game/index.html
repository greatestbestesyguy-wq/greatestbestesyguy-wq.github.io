<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer - HTTP Proxy Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; color: white; }
        canvas { display: block; background: #333; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        #login { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: white; padding: 20px; border-radius: 8px; z-index: 100; color: black;
        }
        input, button { padding: 10px; margin-top: 10px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="login">
    <h3 style="margin-top:0">Join Race</h3>
    <input type="text" id="username" placeholder="Name" maxlength="10">
    <button onclick="startGame()">Connect</button>
</div>

<div id="ui">
    <div id="status">Ready</div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let supabaseClient;
    let channel;
    let myId = Math.random().toString(36).substr(2, 9);
    let players = {};
    let myPlayer = { x: 100, y: 100, vx: 0, vy: 0, name: '' };

    function initSupabase() {
        // We use the Vercel proxy path
        const PROXY_URL = window.location.origin + '/supabase';
        const API_KEY = 'sb_publishable_rIUr6wF4GKnrhuG_DMFbEw_9IOrXgw7';

        // Initialize with global fetch settings to ensure headers pass through Vercel
        supabaseClient = supabase.createClient(PROXY_URL, API_KEY, {
            realtime: {
                // This tells the library to expect a non-standard socket environment
                params: {
                    eventsPerSecond: 10
                }
            }
        });
        
        // Use a high-level channel config
        channel = supabaseClient.channel('race-room');

        channel
            .on('broadcast', { event: 'move' }, ({ payload }) => {
                players[payload.id] = payload;
            })
            .subscribe((status) => {
                document.getElementById('status').innerText = "Status: " + status;
                if (status === 'SUBSCRIBED') {
                    // Start sending position updates
                    setInterval(sendUpdate, 50); 
                }
            });
    }

    function sendUpdate() {
        if (channel && channel.state === 'joined') {
            channel.send({
                type: 'broadcast',
                event: 'move',
                payload: { id: myId, x: myPlayer.x, y: myPlayer.y, name: myPlayer.name }
            });
        }
    }

    function startGame() {
        const name = document.getElementById('username').value;
        if (!name) return;
        myPlayer.name = name;
        document.getElementById('login').style.display = 'none';
        initSupabase();
        requestAnimationFrame(gameLoop);
    }

    function gameLoop() {
        myPlayer.vy += 0.8; 
        myPlayer.y += myPlayer.vy;
        myPlayer.x += myPlayer.vx;

        if (myPlayer.y > canvas.height - 50) {
            myPlayer.y = canvas.height - 50;
            myPlayer.vy = 0;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw Me
        ctx.fillStyle = '#00f2ff';
        ctx.fillRect(myPlayer.x, myPlayer.y, 30, 30);
        ctx.fillText(myPlayer.name, myPlayer.x, myPlayer.y - 10);

        // Draw Others
        ctx.fillStyle = '#ff4b2b';
        for (let id in players) {
            if (id !== myId) {
                let p = players[id];
                ctx.fillRect(p.x, p.y, 30, 30);
                ctx.fillText(p.name, p.x, p.y - 10);
            }
        }
        requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') myPlayer.vx = -7;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') myPlayer.vx = 7;
        if ((e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'KeyW') && myPlayer.vy === 0) myPlayer.vy = -15;
    });
    window.addEventListener('keyup', e => {
        if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'].includes(e.code)) myPlayer.vx = 0;
    });
</script>

</body>
</html>
