<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | AI Web Architect</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --border: #334155;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 1000px; }
        
        h1 {
            font-size: 2.5rem;
            text-align: center;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        textarea, input {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-size: 1rem;
            margin-bottom: 12px;
            outline: none;
        }

        .btn-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        
        button {
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--border); color: var(--text); }

        #status-area {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        #timer { color: var(--accent); font-weight: bold; font-family: monospace; }

        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: white;
            margin-top: 15px;
        }

        .history-list { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; }
        .history-chip {
            background: var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Nexus AI</h1>

    <div class="card">
        <textarea id="prompt" rows="3" placeholder="Describe your website (e.g. A sleek dark-mode portfolio)..."></textarea>
        
        <div class="btn-row">
            <div style="display: flex; gap: 10px;">
                <button class="btn-primary" onclick="generatePage()"><i data-lucide="sparkles"></i> Build</button>
                <button class="btn-secondary" onclick="generateRandom()">Random</button>
            </div>
            <div id="timer-box" class="hidden">Build Time: <span id="timer">0.0s</span></div>
        </div>

        <div id="status-area">
            <span id="ai-status">Architecting...</span>
        </div>
    </div>

    <div id="history-section" class="card hidden">
        <div class="history-list" id="history-list"></div>
    </div>

    <div id="edit-section" class="card hidden">
        <input type="text" id="edit-prompt" placeholder="Ask for a change (e.g. 'Make the buttons green')...">
        <button class="btn-primary" onclick="editPage()"><i data-lucide="wand-2"></i> Update</button>
    </div>

    <div id="output-section" class="card hidden">
        <div class="btn-row" style="margin-bottom: 10px;">
            <h3>Live Preview</h3>
            <div style="display: flex; gap: 8px;">
                <button class="btn-secondary" onclick="copyHtml()"><i data-lucide="copy"></i> Copy HTML</button>
                <button class="btn-secondary" onclick="openFull()"><i data-lucide="maximize"></i> Fullscreen</button>
            </div>
        </div>
        <iframe id="preview"></iframe>
    </div>
</div>

<script>
    lucide.createIcons();

    // Replace this with your valid key
    const API_KEY = "YOUR_GEMINI_API_KEY_HERE"; 
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
    
    let currentHtml = "";
    let startTime;
    let timerInt;

    window.onload = loadHistory;

    function startTimer() {
        startTime = Date.now();
        document.getElementById('timer-box').classList.remove('hidden');
        timerInt = setInterval(() => {
            document.getElementById('timer').innerText = ((Date.now() - startTime)/1000).toFixed(1) + 's';
        }, 100);
    }

    async function fetchAI(promptText) {
        const statusArea = document.getElementById('status-area');
        const statusText = document.getElementById('ai-status');
        
        statusArea.style.display = 'block';
        startTimer();

        const thoughts = ["Analyzing request...", "Generating structure...", "Styling components...", "Writing scripts...", "Polishing UI..."];
        let i = 0;
        const thoughtInt = setInterval(() => {
            statusText.innerText = thoughts[i % thoughts.length];
            i++;
        }, 1200);

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);

            let raw = data.candidates[0].content.parts[0].text;
            currentHtml = raw.replace(/```html|```/gi, "").trim();

            document.getElementById('preview').srcdoc = currentHtml;
            document.getElementById('output-section').classList.remove('hidden');
            document.getElementById('edit-section').classList.remove('hidden');
            
            saveHistory(promptText.substring(0, 20) + "...");
        } catch (e) {
            alert("Error: " + e.message + "\n\nNote: Browsers often block AI keys for security. For Vercel, use a 'Serverless Function' backend.");
        } finally {
            clearInterval(timerInt);
            clearInterval(thoughtInt);
            statusArea.style.display = 'none';
        }
    }

    function generatePage() {
        const p = document.getElementById('prompt').value;
        fetchAI(`Create a complete single-file HTML/CSS website for: ${p}. Return ONLY the code.`);
    }

    function editPage() {
        const p = document.getElementById('edit-prompt').value;
        fetchAI(`Update this code: ${currentHtml}\n\nChange: ${p}\n\nReturn ONLY the full updated code.`);
    }

    function saveHistory(name) {
        let h = JSON.parse(localStorage.getItem('nexus_history') || '[]');
        h.unshift({ name, code: currentHtml });
        localStorage.setItem('nexus_history', JSON.stringify(h.slice(0, 5)));
        loadHistory();
    }

    function loadHistory() {
        let h = JSON.parse(localStorage.getItem('nexus_history') || '[]');
        if (h.length === 0) return;
        document.getElementById('history-section').classList.remove('hidden');
        const list = document.getElementById('history-list');
        list.innerHTML = h.map((item, idx) => `<div class="history-chip" onclick="restore(${idx})">${item.name}</div>`).join('');
    }

    window.restore = (idx) => {
        let h = JSON.parse(localStorage.getItem('nexus_history'));
        currentHtml = h[idx].code;
        document.getElementById('preview').srcdoc = currentHtml;
        document.getElementById('output-section').classList.remove('hidden');
    };

    function copyHtml() { navigator.clipboard.writeText(currentHtml); alert("Copied!"); }
    function openFull() {
        const win = window.open();
        win.document.write(currentHtml);
    }
    function generateRandom() {
        const r = ["Space Travel Agency", "Cyberpunk Coffee", "Minimalist Blog", "80s Retro Portfolio"];
        document.getElementById('prompt').value = r[Math.floor(Math.random()*r.length)];
        generatePage();
    }
</script>
</body>
</html>
