<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | AI Web Architect</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 24px;
        }

        textarea, input[type="text"] {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
        }

        textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn-group { display: flex; gap: 10px; }

        button {
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-secondary:hover { background: #475569; }

        /* Thinking/Status UI */
        #status-container {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: rgba(99, 102, 241, 0.1);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
        }

        .thinking-dots {
            display: inline-block;
            font-style: italic;
            color: var(--primary);
        }

        #timer {
            font-family: monospace;
            color: var(--accent);
            font-weight: bold;
        }

        /* Preview Area */
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: white;
        }

        /* History Sidebar */
        .history-section {
            margin-top: 20px;
        }

        .history-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
        }

        .history-item {
            background: var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.85rem;
        }

        .history-item:hover { background: var(--primary); }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Nexus AI</h1>
        <p style="color: var(--text-muted)">Architecting the web through natural language.</p>
    </header>

    <div class="card">
        <textarea id="prompt" rows="3" placeholder="Describe a high-converting landing page for a coffee shop..."></textarea>
        
        <div class="controls">
            <div class="btn-group">
                <button class="btn-primary" id="btn-generate" onclick="generatePage()">
                    <i data-lucide="sparkles"></i> Build Website
                </button>
                <button class="btn-secondary" onclick="generateRandom()">
                    <i data-lucide="shuffle"></i> Surprise Me
                </button>
            </div>
            <div id="timer-display" class="hidden">
                Time: <span id="timer">0.0s</span>
            </div>
        </div>

        <div id="status-container">
            <div id="ai-thought-process" class="thinking-dots">Initializing architect...</div>
        </div>
    </div>

    <div id="history-container" class="history-section hidden">
        <h4 style="margin: 0 0 10px 0;">Recent Designs</h4>
        <div id="history-list" class="history-list"></div>
    </div>

    <div id="edit-section" class="card hidden">
        <input type="text" id="edit-prompt" placeholder="Change the theme to dark mode, or add a pricing section...">
        <button class="btn-primary" onclick="editPage()">
            <i data-lucide="wand-2"></i> Refine Design
        </button>
    </div>

    <div id="output-section" class="card hidden">
        <div class="preview-header">
            <h3>Live Environment</h3>
            <div class="btn-group">
                <button class="btn-secondary" onclick="copyHtml()">
                    <i data-lucide="copy"></i> Copy HTML
                </button>
                <button class="btn-secondary" onclick="openFullscreen()">
                    <i data-lucide="external-link"></i> Full View
                </button>
            </div>
        </div>
        <iframe id="preview"></iframe>
    </div>
</div>

<script>
    // Initialize Lucide Icons
    lucide.createIcons();

    const API_KEY = "AIzaSyC7BC5viMahX6kpTl2gis7l5GgkoHGkcrU"; 
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
    
    let currentHtmlCode = "";
    let startTime;
    let timerInterval;

    // Load history from cookies/localStorage on start
    window.onload = loadHistory;

    function startTimer() {
        startTime = Date.now();
        document.getElementById('timer-display').classList.remove('hidden');
        timerInterval = setInterval(() => {
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            document.getElementById('timer').innerText = `${elapsed}s`;
        }, 100);
    }

    function stopTimer() {
        clearInterval(timerInterval);
    }

    async function fetchAI(promptText, isEdit = false) {
        const statusBox = document.getElementById('status-container');
        const thoughtText = document.getElementById('ai-thought-process');
        const buttons = document.querySelectorAll('button');
        
        buttons.forEach(b => b.disabled = true);
        statusBox.style.display = 'block';
        startTimer();

        const stages = [
            "Analyzing layout requirements...",
            "Structuring semantic HTML5...",
            "Injecting modern CSS3 variables...",
            "Optimizing responsiveness...",
            "Finalizing assets..."
        ];

        let stageIdx = 0;
        const stageInterval = setInterval(() => {
            thoughtText.innerText = stages[stageIdx % stages.length];
            stageIdx++;
        }, 1500);

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const data = await response.json();
            let generatedHtml = data.candidates[0].content.parts[0].text;
            generatedHtml = generatedHtml.replace(/```html\n?/gi, '').replace(/```\n?/gi, '').trim();

            currentHtmlCode = generatedHtml;
            document.getElementById('preview').srcdoc = currentHtmlCode;
            
            // Show UI sections
            document.getElementById('output-section').classList.remove('hidden');
            document.getElementById('edit-section').classList.remove('hidden');
            
            saveToHistory(promptText.substring(0, 30) + "...");

        } catch (error) {
            alert("Connection Error: Check API Key or Vercel Environment.");
        } finally {
            clearInterval(stageInterval);
            stopTimer();
            statusBox.style.display = 'none';
            buttons.forEach(b => b.disabled = false);
        }
    }

    function generatePage() {
        const userText = document.getElementById('prompt').value.trim();
        if (!userText) return;

        const fullPrompt = `You are a world-class frontend dev. Build a complete, modern, single-file HTML/CSS/JS page for: "${userText}". 
        Make it beautiful with modern colors and responsive. RETURN ONLY RAW HTML CODE. NO MARKDOWN.`;

        fetchAI(fullPrompt);
    }

    function editPage() {
        const instruction = document.getElementById('edit-prompt').value.trim();
        if (!instruction) return;

        const editPrompt = `Current Code: ${currentHtmlCode} \n\n User Request: ${instruction}. 
        Apply these changes and return the FULL updated code. RAW HTML ONLY.`;
        
        fetchAI(editPrompt, true);
    }

    function copyHtml() {
        navigator.clipboard.writeText(currentHtmlCode);
        alert("Code copied to clipboard!");
    }

    function openFullscreen() {
        const blob = new Blob([currentHtmlCode], { type: 'text/html' });
        window.open(URL.createObjectURL(blob), '_blank');
    }

    function saveToHistory(label) {
        let history = JSON.parse(localStorage.getItem('webHistory') || '[]');
        history.unshift({ label, code: currentHtmlCode });
        history = history.slice(0, 5); // Keep last 5
        localStorage.setItem('webHistory', JSON.stringify(history));
        loadHistory();
    }

    function loadHistory() {
        const history = JSON.parse(localStorage.getItem('webHistory') || '[]');
        if (history.length === 0) return;

        const list = document.getElementById('history-list');
        document.getElementById('history-container').classList.remove('hidden');
        list.innerHTML = '';
        
        history.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerText = item.label;
            div.onclick = () => {
                currentHtmlCode = item.code;
                document.getElementById('preview').srcdoc = currentHtmlCode;
                document.getElementById('output-section').classList.remove('hidden');
            };
            list.appendChild(div);
        });
    }

    function generateRandom() {
        const ideas = ["SaaS Landing Page", "Cyberpunk Dashboard", "Minimalist Portfolio", "Recipe Blog"];
        document.getElementById('prompt').value = ideas[Math.floor(Math.random() * ideas.length)];
        generatePage();
    }
</script>
</body>
</html>
