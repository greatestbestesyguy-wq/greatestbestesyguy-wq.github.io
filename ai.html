<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STL Recycle Right AI</title>
    <style>
        :root {
            --bg-color: #1a1d21;
            --container-bg: #2b3036;
            --text-main: #e0e6ed;
            --text-muted: #9ba6b1;
            --accent: #38bdf8; /* Blue accent for STL */
            --border-color: #444c56;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            margin: 0; 
            padding: 20px; 
        }

        #chat-container { 
            width: 100%; 
            max-width: 650px; 
            background: var(--container-bg); 
            display: flex;
            flex-direction: column;
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Header */
        .chat-header {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h1 { margin: 0; font-size: 1.2rem; color: var(--accent); }
        .chat-header p { margin: 5px 0 0 0; font-size: 0.85rem; color: var(--text-muted); }

        /* Output Area */
        #output-window { 
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            min-height: 300px;
            max-height: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--accent);
            color: #000;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #3e444d;
            border-bottom-left-radius: 4px;
        }

        .ai-message strong { color: var(--accent); }

        /* Input Area */
        .input-area {
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            background: rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
        }

        input { 
            flex: 1;
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            background: #121417; 
            color: white; 
            font-size: 1rem;
        }
        input:focus { outline: 2px solid var(--accent); border-color: transparent; }

        button { 
            padding: 0 24px; 
            border-radius: 8px; 
            border: none; 
            background: var(--accent); 
            color: #000; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        button:disabled { background: var(--text-muted); cursor: not-allowed; opacity: 1;}

    </style>
</head>
<body>

    <div id="chat-container">
        <div class="chat-header">
            <div>
                <h1>STL Recycle Right AI</h1>
                <p>Gemini 3 Flash • St. Louis City & County Expert</p>
            </div>
        </div>

        <div id="output-window">
            <div class="message ai-message">
                Hello! ♻️ I'm the St. Louis Recycling Assistant. Ask me if any item can go in your **Blue Bin** in STL City or County.
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Can I recycle a pizza box?" autofocus>
            <button id="sendBtn">Ask</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        // SECURITY: Replace this with your newly generated key.
        const API_KEY = "AIzaSyAlPrKzui913HeUtzwRWPv11cp6rhjssQw";

        const genAI = new GoogleGenerativeAI(API_KEY);

        // Define the AI's persona and strict knowledge base (March 2026 guidelines)
        const systemInstruction = `
            You are the "STL Recycling Expert." You speak strictly and authoritatively 
            regarding official recycling guidelines for both St. Louis City and 
            St. Louis County, Missouri.

            Your goal is to determine if an item belongs in the standard single-stream 
            **"Blue Bin" (Curbside Recycling)**, **"Trash" (Landfill)**, or 
            **"Special Handling" (Drop-off only)**.

            ### Core Rules (Always enforce):
            1. Items must be **Empty, Clean, and Dry**.
            2. Items must be placed **Loose** (never bagged in plastic).

            ### Blue Bin (Allowed):
            - **Paper:** Newspapers, magazines, junk mail, office paper, phone books.
            - **Cardboard:** Flattened boxes (cereal, shipping). NO grease-soaked cardboard.
            - **Plastic Bottles & Containers:** Items that hold their shape. Lids must be ON. (Generally codes #1, 2, 3, 5, 7. Avoid #6).
            - **Metal Cans:** Aluminum and steel food/beverage cans (clean).
            - **Glass:** Glass bottles and jars only (clean).
            - **Cartons:** Food/beverage cartons (e.g., milk, juice).

            ### Forbidden in Blue Bin (Trash):
            - **Plastic Bags, Film, & Wrap:** (Attacker: Never allow). Tell users to return these to grocery stores.
            - **Styrofoam:** Never allow.
            - **Food Soiled Items:** Used napkins, paper plates, greasy pizza box bottoms.
            - **Shredded Paper:** Tangles machinery.
            - **Hoses, Wires, Hangers, Chains:** These are "tanglers."
            - **Electronics & Batteries:** Refer to specialized drop-off centers.
            - **Yard Waste:** Must be composted or specialized pickup.

            ### Behavior Guidelines:
            - If an item is ambiguous (e.g., "pizza box"), specify the conditions: "Recycle the clean top; trash the greasy bottom."
            - Be polite, concise, and direct.
            - Do not answer questions outside of recycling in the St. Louis region.
        `;

        const outputWindow = document.getElementById('output-window');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(sender === 'user' ? 'user-message' : 'ai-message');
            
            // Allow basic bolding if the AI uses **markdown**
            msgDiv.innerHTML = text.replace(/\*\*(.*?)\*\*/g, 'strong>$1</strong');
            
            outputWindow.appendChild(msgDiv);
            outputWindow.scrollTop = outputWindow.scrollHeight;
        }

        async function runChat() {
            const prompt = userInput.value;
            if (!prompt) return;

            appendMessage(prompt, 'user');
            userInput.value = "";
            userInput.focus();
            
            sendBtn.disabled = true;
            sendBtn.innerText = "...";

            try {
                // Initialize the model WITH the system instruction
                const model = genAI.getGenerativeModel({ 
                    model: "gemini-3-flash-preview",
                    systemInstruction: systemInstruction 
                });

                // Generate response
                const result = await model.generateContent(prompt);
                const response = await result.response;
                const text = response.text();

                appendMessage(text, 'ai');
            } catch (error) {
                appendMessage("Sorry, I had trouble checking that. Error: " + error.message, 'ai');
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = "Ask";
            }
        }

        sendBtn.addEventListener('click', runChat);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') runChat();
        });
    </script>
</body>
</html>
