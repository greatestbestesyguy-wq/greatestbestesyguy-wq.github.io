<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web Page Builder</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --success-hover: #059669;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        h1, h3 { margin-top: 0; color: var(--text-primary); }
        p { color: var(--text-secondary); }

        .container, .edit-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 15px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea { height: 120px; resize: vertical; }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        button {
            padding: 12px 24px;
            cursor: pointer;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        button:hover { background: var(--accent-hover); transform: translateY(-1px); }
        button.secondary { background: var(--border); color: var(--text-primary); }
        button.secondary:hover { background: #475569; }
        button.success { background: var(--success); }
        button.success:hover { background: var(--success-hover); }
        button:disabled { background: var(--border); color: var(--text-secondary); cursor: not-allowed; transform: none; }

        #status-container {
            display: none;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--accent);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            justify-content: space-between;
            align-items: center;
        }

        .loader { display: flex; align-items: center; gap: 10px; }
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        #timer { font-family: monospace; font-size: 1.2em; font-weight: bold; color: var(--accent); }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 8px;
            background: white;
        }

        #edit-section {
            display: none;
            border-top: 1px solid var(--border);
            padding-top: 25px;
            margin-top: 25px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .history-item {
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .history-item:hover { border-color: var(--accent); }
    </style>
</head>
<body>

    <div class="card">
        <h1>AI Web Page Builder</h1>
        <p>Describe your ideal web page, and let AI automatically generate a modern, responsive design for you.</p>
        
        <div class="container">
            <textarea id="prompt" placeholder="E.g., A sleek landing page for a tech startup..."></textarea>
            <div class="buttons">
                <button id="btn-generate" onclick="generatePage()">✨ Generate Website</button>
                <button id="btn-random" class="secondary" onclick="generateRandom()">Surprise Me</button>
            </div>
            
            <div id="status-container">
                <div class="loader">
                    <div class="spinner"></div>
                    <span id="thinking-text">Initializing AI...</span>
                </div>
                <div id="timer">0.0s</div>
            </div>
        </div>

        <div id="edit-section">
            <h3>Refine & Edit</h3>
            <div class="edit-container">
                <input type="text" id="edit-prompt" placeholder="E.g., Make the background dark mode...">
                <div class="buttons">
                    <button id="btn-edit" onclick="editPage()">Apply AI Edit</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card" id="output-card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3>Live Preview</h3>
            <div class="buttons" style="margin: 0;">
                <button class="success" onclick="copyHtml()">📋 Copy HTML</button>
                <button class="secondary" onclick="openFullscreen()">🔍 Fullscreen</button>
            </div>
        </div>
        <iframe id="preview"></iframe>
    </div>

    <div class="card" id="history-card">
        <h3>Your Past Designs</h3>
        <p>Websites you generate are saved locally to your browser.</p>
        <div class="history-list" id="history-list"></div>
    </div>

    <script>
        const API_URL = "/api/chat";
        let currentHtmlCode = "";
        let timerInterval, thinkingInterval, startTime;

        const thinkingPhases = [
            "Analyzing your prompt...",
            "Structuring HTML layout...",
            "Writing modern CSS styling...",
            "Adding JavaScript interactivity...",
            "Ensuring mobile responsiveness...",
            "Finalizing code..."
        ];

        document.addEventListener("DOMContentLoaded", loadHistory);

        function startTimers() {
            document.getElementById('status-container').style.display = 'flex';
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                document.getElementById('timer').innerText = `${elapsed}s`;
            }, 100);

            let phaseIdx = 0;
            thinkingInterval = setInterval(() => {
                phaseIdx = (phaseIdx + 1) % thinkingPhases.length;
                document.getElementById('thinking-text').innerText = thinkingPhases[phaseIdx];
            }, 2500);
        }

        function stopTimers() {
            clearInterval(timerInterval);
            clearInterval(thinkingInterval);
            document.getElementById('status-container').style.display = 'none';
        }

        async function fetchAI(promptText, isEdit = false, savePrompt = "") {
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => btn.disabled = true);
            startTimers();

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: promptText }) 
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || "Server Error");
                }

                const data = await response.json();
                let generatedHtml = data.candidates[0].content.parts[0].text;
                
                // Clean markdown tags if present
                generatedHtml = generatedHtml.replace(/```html\n?/gi, '').replace(/```\n?/gi, '').trim();

                currentHtmlCode = generatedHtml;
                document.getElementById('preview').srcdoc = currentHtmlCode;
                document.getElementById('output-card').style.display = 'block';
                document.getElementById('edit-section').style.display = 'block';
                document.getElementById('edit-prompt').value = '';

                saveToHistory(savePrompt || promptText, currentHtmlCode);

            } catch (error) {
                alert("Generation Error: " + error.message);
                console.error(error);
            } finally {
                buttons.forEach(btn => btn.disabled = false);
                stopTimers();
            }
        }

        function generatePage() {
            const userText = document.getElementById('prompt').value.trim();
            if (!userText) return alert("Please enter a description.");
            const fullPrompt = `Expert Web Dev: Write a complete, single-file HTML page for "${userText}". Return ONLY raw HTML code. Modern CSS/JS, mobile-responsive.`;
            fetchAI(fullPrompt, false, userText);
        }

        function editPage() {
            const editInstruction = document.getElementById('edit-prompt').value.trim();
            if (!editInstruction || !currentHtmlCode) return alert("Describe the change first.");
            const editPrompt = `Expert Web Dev. Current Code:\n${currentHtmlCode}\nApply: "${editInstruction}". Return entire updated HTML.`;
            fetchAI(editPrompt, true, `Edit: ${editInstruction}`);
        }

        function copyHtml() {
            navigator.clipboard.writeText(currentHtmlCode).then(() => {
                const btn = document.querySelector('.success');
                btn.innerText = "✅ Copied!";
                setTimeout(() => btn.innerText = "📋 Copy HTML", 2000);
            });
        }

        function openFullscreen() {
            const blob = new Blob([currentHtmlCode], { type: 'text/html' });
            window.open(URL.createObjectURL(blob), '_blank');
        }

        function generateRandom() {
            const topics = ["Futuristic dark portfolio", "Neon synthwave landing page", "Minimalist habit tracker"];
            document.getElementById('prompt').value = topics[Math.floor(Math.random() * topics.length)];
            generatePage();
        }

        function saveToHistory(promptText, htmlCode) {
            let history = JSON.parse(localStorage.getItem('ai_sites') || '[]');
            history.unshift({ id: Date.now(), prompt: promptText, html: htmlCode, date: new Date().toLocaleString() });
            localStorage.setItem('ai_sites', JSON.stringify(history.slice(0, 10)));
            loadHistory();
        }

        function loadHistory() {
            const list = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('ai_sites') || '[]');
            list.innerHTML = history.length ? history.map(item => `
                <div class="history-item" onclick="loadPastDesign(${item.id})">
                    <div class="history-text"><strong>${item.prompt}</strong></div>
                    <div style="font-size: 0.8em; color: var(--text-secondary);">${item.date}</div>
                </div>`).join('') : '<p>No past designs yet.</p>';
        }

        function loadPastDesign(id) {
            const item = JSON.parse(localStorage.getItem('ai_sites')).find(i => i.id === id);
            if (item) {
                currentHtmlCode = item.html;
                document.getElementById('preview').srcdoc = currentHtmlCode;
                document.getElementById('output-card').style.display = 'block';
                document.getElementById('edit-section').style.display = 'block';
                document.getElementById('prompt').value = item.prompt;
                window.scrollTo({ top: document.getElementById('output-card').offsetTop, behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
