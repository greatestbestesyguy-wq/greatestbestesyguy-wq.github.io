<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web Page Builder</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            padding: 10px 0;
        }
        .buttons {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }
        button.random { background: #10b981; }
        button.random:hover { background: #059669; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        
        #loading {
            display: none;
            color: #2563eb;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .output-section {
            margin-top: 30px;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }
        #output-code {
            width: 100%;
            height: 250px;
            margin-top: 10px;
            font-family: monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>AI Web Page Builder</h1>
        <p>Describe your ideal web page, choose your settings, and let AI generate it for you.</p>
        
        <div class="container">
            <textarea id="prompt" placeholder="E.g., A colorful landing page for a local bakery with a hero section and a contact form..."></textarea>

            <div class="options">
                <label><input type="checkbox" id="opt-css" checked> Modern CSS Styling</label>
                <label><input type="checkbox" id="opt-js"> Interactive JavaScript</label>
                <label><input type="checkbox" id="opt-responsive" checked> Mobile Responsive</label>
            </div>

            <div class="buttons">
                <button id="btn-generate" onclick="generatePage()">Generate Page</button>
                <button id="btn-random" class="random" onclick="generateRandom()">Surprise Me (Random)</button>
            </div>

            <div id="loading">⏳ Generating your web page... Please wait a few seconds.</div>
        </div>
    </div>

    <div class="output-section">
        <h3>Live Preview</h3>
        <iframe id="preview"></iframe>

        <h3>Raw HTML Output</h3>
        <textarea id="output-code" readonly placeholder="Your generated code will appear here..."></textarea>
    </div>

    <script>
        // Utilizing the provided test API key
        const API_KEY = "AIzaSyAlPrKzui913HeUtzwRWPv11cp6rhjssQw"; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

        async function fetchAI(promptText) {
            const btnGen = document.getElementById('btn-generate');
            const btnRand = document.getElementById('btn-random');
            const loading = document.getElementById('loading');
            
            // Disable UI during generation
            btnGen.disabled = true;
            btnRand.disabled = true;
            loading.style.display = 'block';
            document.getElementById('preview').srcdoc = '';
            document.getElementById('output-code').value = '';

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let generatedHtml = data.candidates[0].content.parts[0].text;

                // Clean up markdown formatting if the AI wraps it in code blocks
                generatedHtml = generatedHtml.replace(/```html\n?/gi, '').replace(/```\n?/gi, '');

                document.getElementById('preview').srcdoc = generatedHtml;
                document.getElementById('output-code').value = generatedHtml;
            } catch (error) {
                alert("Error generating page: " + error.message);
                console.error("API Error:", error);
            } finally {
                // Restore UI
                btnGen.disabled = false;
                btnRand.disabled = false;
                loading.style.display = 'none';
            }
        }

        function generatePage() {
            const userText = document.getElementById('prompt').value.trim();
            if (!userText) {
                alert("Please enter a description for your web page.");
                return;
            }

            // Gather options
            const css = document.getElementById('opt-css').checked ? "Use modern, beautiful, and extensive CSS styling embedded in the <style> tag." : "Do not include any CSS styling.";
            const js = document.getElementById('opt-js').checked ? "Include relevant and functional JavaScript embedded in the <script> tag for interactivity." : "Do not include any JavaScript.";
            const responsive = document.getElementById('opt-responsive').checked ? "Ensure the design is fully mobile-responsive using flexbox/grid and media queries." : "";

            // Construct the strict system prompt
            const fullPrompt = `You are an expert web developer. Write a complete, single-file HTML page for the following request: "${userText}".
            
            Strict Requirements:
            - Return ONLY the raw HTML code. Do not include markdown code blocks, explanations, or introductory text.
            - ${css}
            - ${js}
            - ${responsive}
            - Ensure all code is contained within a single standard HTML5 document format.`;

            fetchAI(fullPrompt);
        }

        function generateRandom() {
            const topics = [
                "A futuristic portfolio for an AI developer", 
                "A retro 80s synthwave landing page for a music festival", 
                "A clean, minimalist dashboard for tracking daily habits", 
                "A vibrant online menu for a tropical smoothie shop",
                "A dark-mode landing page for a cybersecurity firm"
            ];
            const randomTopic = topics[Math.floor(Math.random() * topics.length)];
            document.getElementById('prompt').value = randomTopic;
            generatePage();
        }
    </script>
</body>
</html>
