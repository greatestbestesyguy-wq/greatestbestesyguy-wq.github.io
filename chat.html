<!DOCTYPE html>
<html>
<head>
    <title>Recycle St. Louis Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
        #chat-box { height: 400px; border: 1px solid #ddd; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #f9f9f9; border-radius: 8px; }
        .user { color: blue; margin: 5px 0; }
        .ai { color: green; margin: 5px 0; font-weight: bold; }
        input { width: 80%; padding: 10px; }
        button { padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Ask the Recycling Assistant</h2>
    <div id="chat-box"></div>
    <input type="text" id="user-input" placeholder="How do I recycle plastic in STL?">
    <button onclick="askGroq()">Send</button>

    <script>
        async function askGroq() {
            const input = document.getElementById('user-input');
            const box = document.getElementById('chat-box');
            if (!input.value) return;

            const userMsg = input.value;
            box.innerHTML += `<div class="user">You: ${userMsg}</div>`;
            input.value = '';

            // This calls your secret Vercel function
            const response = await fetch('/api/groq', {
                method: 'POST',
                body: JSON.stringify({ message: userMsg })
            });

            const data = await response.json();
            box.innerHTML += `<div class="ai">Assistant: ${data.reply}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
