<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote Josh Massa</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: #1a1a1a;
        }
        .vote-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
            max-width: 300px;
        }
        .vote-btn:active {
            transform: scale(0.98);
            background-color: #0056b3;
        }
        #message {
            margin-top: 30px;
            font-size: 1.5rem;
            font-weight: 600;
            color: #28a745;
        }
    </style>
</head>
<body>

    <h1>Vote Josh Massa</h1>
    
    <button class="vote-btn" onclick="castVote()">Vote</button>
    
    <div id="message"></div>

    <script>
        function castVote() {
            const messageDiv = document.getElementById("message");
            messageDiv.textContent = "You voted for joshua massa";
        }
    </script>

</body>
</html>
