<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STL Recycling | Article Generator</title>
    <style>
        :root { --bg: #0a0a0a; --card: #141414; --accent: #00ff88; --text: #ffffff; --dim: #a0a0a0; --border: #222; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 40px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        
        .editor-side, .preview-side { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid var(--border); }
        h1 { font-size: 1.5rem; color: var(--accent); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        label { display: block; font-size: 12px; text-transform: uppercase; color: var(--dim); margin-top: 20px; font-weight: bold; }
        input, textarea { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 8px; color: #fff; padding: 12px; margin-top: 5px; font-size: 14px; box-sizing: border-box; }
        textarea { height: 120px; resize: vertical; }
        
        .preview-content { border-top: 2px solid var(--accent); padding-top: 20px; margin-top: 10px; }
        .preview-label { color: var(--accent); font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .preview-title { font-size: 2rem; margin: 10px 0; }
        .preview-img { width: 100%; border-radius: 12px; margin: 15px 0; display: none; }
        .preview-body { white-space: pre-wrap; color: #ccc; }
        
        .btn-group { margin-top: 30px; display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-copy { background: var(--accent); color: #000; }
        .btn-reset { background: #333; color: #fff; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="container">
        <div class="editor-side">
            <h1>✍️ Article Builder</h1>
            
            <label>Section Label (e.g. Policy Update)</label>
            <input type="text" id="in-label" placeholder="New Interview" oninput="update()">
            
            <label>Headline</label>
            <input type="text" id="in-title" placeholder="The State of St. Louis Recycling" oninput="update()">
            
            <label>Image URL</label>
            <input type="url" id="in-img" placeholder="https://..." oninput="update()">
            
            <label>Image Alt Text</label>
            <input type="text" id="in-alt" placeholder="Describe photo for accessibility..." oninput="update()">
            
            <label>Lead Paragraph</label>
            <textarea id="in-body" placeholder="Main content goes here..." oninput="update()"></textarea>

            <label>Deep Dive (Expandable Text)</label>
            <textarea id="in-expand" placeholder="Hidden details that appear when 'Read More' is clicked..." oninput="update()"></textarea>

            <div class="btn-group">
                <button class="btn btn-reset" onclick="reset()">Reset</button>
                <button class="btn btn-copy" onclick="copyJSON()">Copy for content.json</button>
            </div>
        </div>

        <div class="preview-side">
            <h1>👀 Live Preview</h1>
            <div class="preview-content">
                <div id="pre-label" class="preview-label">New Interview</div>
                <h2 id="pre-title" class="preview-title">Article Headline</h2>
                <img id="pre-img" class="preview-img" src="" alt="">
                <p id="pre-body" class="preview-body">Your content will appear here as you type...</p>
                <div id="pre-more" style="color: var(--accent); font-size: 14px; margin-top: 10px; font-style: italic;">+ Read More section active</div>
            </div>
        </div>
    </div>

    <script>
        function update() {
            const label = document.getElementById('in-label').value || 'Label';
            const title = document.getElementById('in-title').value || 'Headline';
            const img = document.getElementById('in-img').value;
            const body = document.getElementById('in-body').value || 'Body text...';
            const expand = document.getElementById('in-expand').value;

            document.getElementById('pre-label').innerText = label;
            document.getElementById('pre-title').innerText = title;
            document.getElementById('pre-body').innerText = body;
            
            const imgEl = document.getElementById('pre-img');
            if(img) {
                imgEl.src = img;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }

            document.getElementById('pre-more').style.display = expand ? 'block' : 'none';
        }

        function copyJSON() {
            const obj = {
                label: document.getElementById('in-label').value,
                title: document.getElementById('in-title').value,
                body: document.getElementById('in-body').value,
                imageUrl: document.getElementById('in-img').value,
                imageAlt: document.getElementById('in-alt').value,
                expandableBody: document.getElementById('in-expand').value,
                buttonText: "Read More ↓",
                buttonUrl: ""
            };
            
            const json = JSON.stringify(obj, null, 2);
            navigator.clipboard.writeText(json);
            alert("Article JSON copied! Paste this into your contentBlocks array in content.json.");
        }

        function reset() {
            document.querySelectorAll('input, textarea').forEach(el => el.value = '');
            update();
        }
    </script>
</body>
</html>
