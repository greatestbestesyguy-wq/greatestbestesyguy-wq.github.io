<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recycle STL | Full-Page Article Generator</title>
    <style>
        :root { --bg: #09090b; --surface: #18181b; --border: #27272a; --accent: #10b981; --text: #f4f4f5; --dim: #a1a1aa; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
        
        /* Editor Sidebar */
        .editor { width: 450px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
        .editor-header { padding: 25px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); }
        .editor-content { flex: 1; overflow-y: auto; padding: 25px; }
        
        /* Input Styling */
        .field { margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        input, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: #fff; padding: 12px; font-size: 14px; outline: none; transition: 0.2s; }
        input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.1); }
        textarea { height: 100px; resize: vertical; }

        /* Preview Area */
        .preview-pane { flex: 1; background: #000; display: flex; flex-direction: column; position: relative; }
        .toolbar { padding: 15px 25px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        
        .iframe-wrap { flex: 1; margin: 20px; border-radius: 12px; overflow: hidden; background: #fff; border: 1px solid var(--border); transition: all 0.3s ease; }
        .iframe-wrap.fullscreen { position: fixed; inset: 0; z-index: 100; margin: 0; border-radius: 0; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Buttons */
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { background: #0da372; transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: var(--border); }
        
        #close-fs { display: none; position: fixed; top: 20px; right: 20px; z-index: 101; background: #ff4444; color: white; }
    </style>
</head>
<body>

    <div class="editor">
        <div class="editor-header">
            <h2 style="font-size: 1.2rem;">Full-Page Generator</h2>
            <p style="font-size: 12px; color: var(--dim);">Build a standalone advocacy article</p>
        </div>
        <div class="editor-content">
            <div class="field"><label>Page Slug (Filename)</label><input type="text" id="in-slug" value="recycling-report" placeholder="e.g. recycling-report"></div>
            <div class="field"><label>Navigation Link Text</label><input type="text" id="in-nav" value="New Article" oninput="update()"></div>
            <div class="field"><label>Main Headline</label><input type="text" id="in-title" value="St. Louis Recycling Breakdown" oninput="update()"></div>
            <div class="field"><label>Hero Image URL</label><input type="text" id="in-img" placeholder="https://..." oninput="update()"></div>
            <div class="field"><label>Hero Image Alt Text</label><input type="text" id="in-alt" placeholder="Description for accessibility..." oninput="update()"></div>
            <div class="field"><label>Lead Paragraph</label><textarea id="in-body" oninput="update()">In light of recent policy changes, Metro High students have analyzed the primary drop-off sites in the St. Louis area...</textarea></div>
            <div class="field"><label>Full Article Content (HTML allowed)</label><textarea id="in-content" style="height: 200px;" oninput="update()"><h3>The Current Status</h3><p>Detailed analysis goes here...</p></textarea></div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn btn-outline" style="flex: 1;" onclick="copyHTML()">📋 Copy HTML</button>
                <button class="btn btn-primary" style="flex: 1;" onclick="downloadHTML()">💾 Download</button>
            </div>
        </div>
    </div>

    <div class="preview-pane">
        <div class="toolbar">
            <span style="font-size: 12px; color: var(--dim);">PREVIEW MODE</span>
            <button class="btn btn-outline" onclick="toggleFullscreen()">⛶ Fullscreen Preview</button>
        </div>
        <div id="wrapper" class="iframe-wrap">
            <iframe id="pre-frame"></iframe>
        </div>
    </div>

    <button id="close-fs" class="btn" onclick="toggleFullscreen()">Exit Fullscreen</button>

    <script>
        function generateFullHTML() {
            const nav = document.getElementById('in-nav').value || 'Article';
            const title = document.getElementById('in-title').value || 'Headline';
            const img = document.getElementById('in-img').value;
            const alt = document.getElementById('in-alt').value;
            const body = document.getElementById('in-body').value;
            const content = document.getElementById('in-content').value;

            return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recycle STL | ${title}</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        .article-hero { padding: 80px 20px; text-align: center; background: #000; border-bottom: 1px solid #222; }
        .article-container { max-width: 800px; margin: 60px auto; padding: 0 25px; line-height: 1.8; color: #ccc; }
        .article-img { width: 100%; border-radius: 16px; margin-bottom: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h1 { font-size: 3rem; color: #fff; margin-bottom: 20px; }
        .lead { font-size: 1.25rem; color: var(--accent, #10b981); margin-bottom: 40px; }
        h3 { color: #fff; margin: 40px 0 20px; }
    </style>
</head>
<body>
    <header style="padding: 20px; text-align: center; border-bottom: 1px solid #222;">
        <nav style="display: flex; justify-content: center; gap: 20px;">
            <a href="/" style="color:#aaa; text-decoration:none;">Home</a>
            <a href="#" style="color:var(--accent, #10b981); font-weight:bold; text-decoration:none;">${nav}</a>
        </nav>
    </header>

    <main>
        <section class="article-hero">
            <h1>${title}</h1>
            <p class="lead">${body}</p>
        </section>

        <article class="article-container">
            ${img ? `<img src="${img}" alt="${alt}" class="article-img">` : ''}
            <div class="rich-text">
                ${content}
            </div>
        </article>
    </main>

    <footer style="padding: 60px 20px; text-align: center; color: #555; border-top: 1px solid #222;">
        Metro Academic & Classical High School Advocacy Project
    </footer>
</body>
</html>`;
        }

        function update() {
            const blob = new Blob([generateFullHTML()], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            document.getElementById('pre-frame').src = url;
        }

        function toggleFullscreen() {
            const wrap = document.getElementById('wrapper');
            const closeBtn = document.getElementById('close-fs');
            const isFs = wrap.classList.toggle('fullscreen');
            closeBtn.style.display = isFs ? 'block' : 'none';
        }

        function copyHTML() {
            navigator.clipboard.writeText(generateFullHTML());
            alert("Full HTML page copied to clipboard!");
        }

        function downloadHTML() {
            const slug = document.getElementById('in-slug').value || 'article';
            const link = document.createElement('a');
            link.href = 'data:text/html;charset=utf-8,' + encodeURIComponent(generateFullHTML());
            link.download = `${slug}.html`;
            link.click();
        }

        // Initial preview
        update();
    </script>
</body>
</html>
