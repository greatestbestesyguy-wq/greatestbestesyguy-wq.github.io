<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Live Painter</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .ui-panel { background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); width: 100%; max-width: 500px; margin-bottom: 20px; }
        .canvas-area { position: relative; background: #000; border: 4px solid #333; line-height: 0; box-shadow: 0 0 20px rgba(0,0,0,1); }
        canvas { image-rendering: pixelated; width: 512px; height: 512px; cursor: crosshair; }
        .loading-bar { height: 4px; background: #4a90e2; width: 0%; transition: width 0.3s; margin-top: 10px; border-radius: 2px; }
        input, select, button { background: #2d2d2d; color: white; border: 1px solid #444; padding: 12px; border-radius: 6px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #0078d4; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:hover { background: #005a9e; transform: translateY(-1px); }
        .status { font-size: 0.8em; color: #888; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="ui-panel">
        <label>Prompt:</label>
        <input type="text" id="promptInput" placeholder="A cozy cabin in the snow...">
        
        <label>Quality:</label>
        <select id="qualitySelect">
            <option value="16">Standard (16x16)</option>
            <option value="32">High (32x32)</option>
            <option value="64">Ultra (64x64)</option>
            <option value="128">Full (128x128) - Slow & Detailed</option>
        </select>

        <button onclick="startGeneration()">Generate Image</button>
        <div id="loading" class="loading-bar"></div>
        <div id="statusText" class="status">Ready</div>

        <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
            <span>Edit Color:</span>
            <input type="color" id="editColor" value="#ffffff" style="width: 50px; height: 40px; padding: 2px;">
            <button onclick="downloadImg()" style="width: auto; padding: 10px 20px;">Save PNG</button>
        </div>
    </div>

    <div class="canvas-area">
        <canvas id="paintCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const loadingBar = document.getElementById('loading');
        const statusText = document.getElementById('statusText');
        let currentSize = 16;
        let pixelIndex = 0;

        function initCanvas(size) {
            currentSize = size;
            canvas.width = size;
            canvas.height = size;
            pixelIndex = 0;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, size, size);
            loadingBar.style.width = '0%';
        }

        async function startGeneration() {
            const prompt = document.getElementById('promptInput').value;
            const size = parseInt(document.getElementById('qualitySelect').value);
            if (!prompt) return;

            initCanvas(size);
            statusText.innerText = "AI is thinking...";

            // We ask for a raw stream of hex codes to make parsing easy
            const streamPrompt = `Act as a painter. Generate a ${size}x${size} grid of hex colors for: ${prompt}. 
            Output ONLY the hex codes separated by commas (e.g. #ffffff,#000000,...). 
            Do not use JSON, markdown, or text. Just the raw codes. Total pixels: ${size * size}.`;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: streamPrompt })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    // Extract text from Gemini's SSE format
                    const matches = chunk.match(/"text":\s*"(.*?)"/g);
                    if (matches) {
                        matches.forEach(m => {
                            const text = m.replace(/"text":\s*"/, "").replace(/"$/, "");
                            processTextChunk(text);
                        });
                    }
                }
                statusText.innerText = "Generation Complete!";
            } catch (err) {
                statusText.innerText = "Error: " + err.message;
            }
        }

        function processTextChunk(text) {
            // Clean up backslashes and split by commas
            const colors = text.replace(/\\n/g, "").split(',');
            
            colors.forEach(color => {
                const cleaned = color.trim();
                if (cleaned.startsWith('#') && cleaned.length >= 4) {
                    drawPixel(cleaned);
                }
            });
        }

        function drawPixel(color) {
            if (pixelIndex >= currentSize * currentSize) return;

            const x = pixelIndex % currentSize;
            const y = Math.floor(pixelIndex / currentSize);
            
            ctx.fillStyle = color;
            ctx.fillRect(x, y, 1, 1);
            
            pixelIndex++;
            const progress = (pixelIndex / (currentSize * currentSize)) * 100;
            loadingBar.style.width = progress + '%';
        }

        // Click to Edit
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scale = currentSize / rect.width;
            const x = Math.floor((e.clientX - rect.left) * scale);
            const y = Math.floor((e.clientY - rect.top) * scale);
            
            ctx.fillStyle = document.getElementById('editColor').value;
            ctx.fillRect(x, y, 1, 1);
        });

        function downloadImg() {
            const link = document.createElement('a');
            link.download = 'ai-generation.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        initCanvas(16);
    </script>
</body>
</html>
