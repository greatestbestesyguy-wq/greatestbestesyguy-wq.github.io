<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recycle STL | Ultimate Studio</title>
    <style>
        :root { --bg: #09090b; --surface: #18181b; --border: #27272a; --accent: #10b981; --accent-hover: #059669; --text: #f4f4f5; --text-dim: #a1a1aa; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #setup-screen { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 20px; text-align: center; }
        .setup-box { max-width: 600px; width: 100%; }
        .setup-box h1 { margin-bottom: 10px; font-size: 2.5rem; color: var(--accent); }
        textarea.json-loader { width: 100%; height: 300px; background: var(--surface); border: 2px dashed var(--border); border-radius: 16px; color: var(--accent); font-family: 'Courier New', monospace; padding: 25px; resize: none; transition: all 0.3s; font-size: 14px; }
        
        #editor-screen { display: none; flex: 1; flex-direction: column; height: 100vh; }
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo { font-weight: 800; letter-spacing: 1px; font-size: 1.2rem; }
        .logo span { color: var(--accent); }
        select { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; outline: none; cursor: pointer; font-size: 14px; }
        
        .header-right { display: flex; gap: 12px; }
        .btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
        .btn-primary { background: var(--accent); color: #000; border: none; font-weight: 700; }
        .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px 10px; font-size: 12px; }

        .workspace { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 480px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 10px 0 30px rgba(0,0,0,0.2); z-index: 10; }
        .sidebar-header { padding: 25px; border-bottom: 1px solid var(--border); }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 25px; }
        
        .field-group { margin-bottom: 24px; }
        .field-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        input[type="text"], input[type="url"], textarea, select.field-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 14px; font-size: 14px; outline: none; }
        
        .array-item { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .preview-area { flex: 1; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 40px; }
        .device-toggle { position: absolute; top: 25px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; display: flex; overflow: hidden; z-index: 20; }
        .device-toggle button { background: transparent; color: var(--text-dim); border: none; padding: 10px 20px; cursor: pointer; font-size: 12px; }
        .device-toggle button.active { background: var(--border); color: var(--text); }
        
        .iframe-container { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: white; transition: width 0.4s; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; width: 650px; max-width: 90%; padding: 40px; }
        .modal textarea { height: 350px; background: var(--bg); color: var(--accent); width: 100%; margin-bottom: 20px; padding: 15px; font-family: monospace; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="setup-box">
            <h1>Studio <span>Setup</span></h1>
            <p>Paste your <strong>content.json</strong> to begin editing.</p>
            <textarea id="json-loader" class="json-loader" placeholder='{ "metadata": { ... } }' autofocus></textarea>
        </div>
    </div>

    <div id="editor-screen">
        <header>
            <div class="header-left">
                <div class="logo">RECYCLE<span>STL</span></div>
                <select id="page-selector" onchange="switchPage(this.value)">
                    <option value="home">Home Settings</option>
                    <option value="map">Map Settings</option>
                    <option value="interviews">Interview Settings</option>
                    <option value="about">About Settings</option>
                    <option value="quiz">Quiz Settings</option>
                </select>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" onclick="openGitHubModal()">⚡ Export & GitHub</button>
            </div>
        </header>

        <div class="workspace">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2 id="sidebar-title">Editing Home</h2>
                </div>
                <div class="sidebar-content" id="form-container"></div>
            </aside>

            <section class="preview-area">
                <div class="device-toggle">
                    <button id="btn-desktop" class="active" onclick="setDevice('desktop')">Desktop</button>
                    <button id="btn-mobile" onclick="setDevice('mobile')">Mobile</button>
                </div>
                <div class="iframe-container" id="iframe-wrap">
                    <iframe id="preview-frame" src="./index.html"></iframe>
                </div>
            </section>
        </div>
    </div>

    <div id="github-modal" class="modal-overlay">
        <div class="modal">
            <h2>Ready to Publish!</h2>
            <textarea id="export-json" readonly></textarea>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn" onclick="closeGitHubModal()">Cancel</button>
                <button class="btn btn-primary" onclick="copyJSON()">📋 Copy JSON</button>
            </div>
        </div>
    </div>

    <script>
        let db = null;
        let currentPage = 'home';

        document.getElementById('json-loader').addEventListener('input', function(e) {
            try {
                db = JSON.parse(e.target.value);
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('editor-screen').style.display = 'flex';
                switchPage('home');
            } catch(err) {}
        });

        function switchPage(pageKey) {
            currentPage = pageKey;
            document.getElementById('sidebar-title').innerText = `Editing ${pageKey.charAt(0).toUpperCase() + pageKey.slice(1)}`;
            const frame = document.getElementById('preview-frame');
            const routes = { home: 'index.html', map: 'map.html', interviews: 'interviews.html', about: 'about.html', quiz: 'quiz.html' };
            frame.src = `./${routes[pageKey]}`;
            renderForm();
        }

        function setDevice(type) {
            document.getElementById('btn-desktop').classList.toggle('active', type === 'desktop');
            document.getElementById('btn-mobile').classList.toggle('active', type === 'mobile');
            document.getElementById('iframe-wrap').style.width = type === 'mobile' ? '375px' : '100%';
        }

        function setPath(obj, path, value) {
            const keys = path.split('.');
            let current = obj;
            for (let i = 0; i < keys.length - 1; i++) {
                if (!current[keys[i]]) current[keys[i]] = {};
                current = current[keys[i]];
            }
            current[keys[keys.length - 1]] = value;
            syncIframe();
        }

        function syncIframe() {
            const iframe = document.getElementById('preview-frame');
            if (iframe.contentWindow) {
                iframe.contentWindow.postMessage({ type: 'UPDATE_CONTENT', data: db }, '*');
            }
        }

        function renderForm() {
            const container = document.getElementById('form-container');
            container.innerHTML = '';
            
            if (currentPage === 'home') {
                renderGroup(container, "General", [
                    { label: "Popup Enabled", path: "popup.enabled", type: "select", options: [{l:"Yes", v:true}, {l:"No", v:false}] },
                    { label: "Popup Msg", path: "popup.message", type: "text" },
                    { label: "Hero Title", path: "hero.title", type: "text" }
                ]);
            } else if (currentPage === 'map') {
                renderGroup(container, "Map View", [
                    { label: "Page Title", path: "mapPage.title", type: "text" },
                    { label: "Map URL", path: "mapPage.mapUrl", type: "text" },
                    { label: "Instructions", path: "mapPage.instructionsBody", type: "textarea" }
                ]);
            } else if (currentPage === 'about') {
                renderGroup(container, "Mission", [
                    { label: "Title", path: "aboutPage.title", type: "text" },
                    { label: "Mission Text", path: "aboutPage.missionBody", type: "textarea" }
                ]);
            } else if (currentPage === 'interviews') {
                renderGroup(container, "Video", [
                    { label: "Video URL", path: "interviewsPage.featuredVideoUrl", type: "text" }
                ]);
            } else if (currentPage === 'quiz') {
                container.innerHTML = "<p>Quiz questions are managed in the content.json array.</p>";
            }
        }

        function renderGroup(container, title, fields) {
            let html = `<h3>${title}</h3>`;
            fields.forEach(f => {
                const val = f.path.split('.').reduce((o, i) => (o ? o[i] : ''), db);
                html += `<div class="field-group"><label>${f.label}</label>`;
                if (f.type === "select") {
                    html += `<select class="field-input" onchange="setPath(db, '${f.path}', this.value === 'true')">`;
                    f.options.forEach(o => html += `<option value="${o.v}" ${val == o.v ? 'selected' : ''}>${o.l}</option>`);
                    html += `</select>`;
                } else if (f.type === "textarea") {
                    html += `<textarea onchange="setPath(db, '${f.path}', this.value)">${val}</textarea>`;
                } else {
                    html += `<input type="text" value="${val}" onchange="setPath(db, '${f.path}', this.value)">`;
                }
                html += `</div>`;
            });
            container.innerHTML += html;
        }

        function openGitHubModal() {
            document.getElementById('export-json').value = JSON.stringify(db, null, 2);
            document.getElementById('github-modal').style.display = 'flex';
        }
        function closeGitHubModal() { document.getElementById('github-modal').style.display = 'none'; }
        function copyJSON() {
            document.getElementById('export-json').select();
            document.execCommand("copy");
            alert("Copied!");
        }
    </script>
</body>
</html>
