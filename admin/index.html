<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recycle STL | Ultimate Studio</title>
    <style>
        :root { --bg: #09090b; --surface: #18181b; --border: #27272a; --accent: #10b981; --accent-hover: #059669; --text: #f4f4f5; --text-dim: #a1a1aa; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Setup Screen */
        #setup-screen { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 20px; text-align: center; }
        .setup-box { max-width: 600px; width: 100%; }
        .setup-box h1 { margin-bottom: 10px; font-size: 2.5rem; color: var(--accent); }
        .setup-box p { color: var(--text-dim); margin-bottom: 25px; font-size: 1.1rem; }
        textarea.json-loader { width: 100%; height: 300px; background: var(--surface); border: 2px dashed var(--border); border-radius: 16px; color: var(--accent); font-family: 'Courier New', monospace; padding: 25px; resize: none; transition: all 0.3s; font-size: 14px; }
        textarea.json-loader:focus { outline: none; border-color: var(--accent); background: #1c1c21; }
        
        /* Main Layout */
        #editor-screen { display: none; flex: 1; flex-direction: column; height: 100vh; }
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo { font-weight: 800; letter-spacing: 1px; font-size: 1.2rem; }
        .logo span { color: var(--accent); }
        select { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; outline: none; cursor: pointer; font-size: 14px; }
        
        .header-right { display: flex; gap: 12px; }
        .btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
        .btn:hover { background: var(--border); transform: translateY(-1px); }
        .btn-primary { background: var(--accent); color: #000; border: none; font-weight: 700; }
        .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px 10px; font-size: 12px; }
        .btn-danger:hover { background: var(--danger); color: white; }

        .workspace { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 480px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: 10px 0 30px rgba(0,0,0,0.2); z-index: 10; }
        .sidebar-header { padding: 25px; border-bottom: 1px solid var(--border); }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 25px; }
        
        /* Form Controls */
        .field-group { margin-bottom: 24px; }
        .field-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        input[type="text"], input[type="url"], textarea, select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 14px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        input:focus, textarea:focus, select:focus { border-color: var(--accent); }
        textarea { height: 120px; resize: vertical; line-height: 1.5; }
        
        /* Array/Section Blocks */
        .array-item { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; position: relative; }
        .array-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .array-item-title { font-size: 13px; font-weight: bold; color: var(--accent); letter-spacing: 0.5px; }

        /* Preview Area */
        .preview-area { flex: 1; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 40px; }
        .device-toggle { position: absolute; top: 25px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; display: flex; overflow: hidden; z-index: 20; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .device-toggle button { background: transparent; color: var(--text-dim); border: none; padding: 10px 20px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .device-toggle button.active { background: var(--border); color: var(--text); }
        
        .iframe-container { width: 100%; height: 100%; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: white; transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Export Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; width: 650px; max-width: 90%; padding: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
        .modal h2 { margin-bottom: 15px; color: var(--accent); font-size: 1.8rem; }
        .modal p { color: var(--text-dim); margin-bottom: 25px; line-height: 1.6; }
        .modal textarea { height: 350px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; color: var(--accent); font-family: monospace; font-size: 12px; padding: 20px; margin-bottom: 25px; width: 100%; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }

        h3 { font-size: 14px; color: var(--text); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        h3::before { content: ''; width: 4px; height: 14px; background: var(--accent); border-radius: 2px; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="setup-box">
            <h1>Studio <span>Setup</span></h1>
            <p>Paste your <strong>content.json</strong> or fetch it from the server.</p>
            <button class="btn btn-primary" onclick="fetchJSON()" style="margin-bottom: 15px; width: 100%; justify-content: center;">☁ Fetch JSON from Live Site</button>
            <textarea id="json-loader" class="json-loader" placeholder='{ "metadata": { ... } }' autofocus></textarea>
        </div>
    </div>

    <div id="editor-screen">
        <header>
            <div class="header-left">
                <div class="logo">RECYCLE<span>STL</span></div>
                <select id="page-selector" onchange="switchPage(this.value)">
                    <option value="home">Home Settings</option>
                    <option value="map">Map Settings</option>
                    <option value="interviews">Interview Settings</option>
                    <option value="about">About Settings</option>
                    <option value="quiz">Quiz Settings</option>
                </select>
            </div>
            <div class="header-right">
                <button class="btn" onclick="reloadPreview()">↻ Reload Live Site</button>
                <button class="btn btn-primary" onclick="openGitHubModal()">⚡ Export & GitHub</button>
            </div>
        </header>

        <div class="workspace">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2 id="sidebar-title" style="font-size: 1.2rem;">Editing Home</h2>
                    <p style="font-size: 12px; color: var(--text-dim); margin-top: 6px;">Fields below update the site instantly.</p>
                </div>
                <div class="sidebar-content" id="form-container">
                </div>
            </aside>

            <section class="preview-area">
                <div class="device-toggle">
                    <button id="btn-desktop" class="active" onclick="setDevice('desktop')">Desktop</button>
                    <button id="btn-mobile" onclick="setDevice('mobile')">Mobile</button>
                </div>
                <div class="iframe-container" id="iframe-wrap">
                    <iframe id="preview-frame" src="https://stl.planet-recycling.pl/"></iframe>
                </div>
            </section>
        </div>
    </div>

    <div id="github-modal" class="modal-overlay">
        <div class="modal">
            <h2>Ready to Publish!</h2>
            <p>Your updated configuration is ready. Copy the code below, then click the button to open GitHub and update your file.</p>
            <textarea id="export-json" readonly></textarea>
            <div class="modal-actions">
                <button class="btn" onclick="closeGitHubModal()">Cancel</button>
                <button class="btn" onclick="copyJSON()">📋 Copy JSON</button>
                <a href="https://github.com/greatestbestesyguy-wq/greatestbestesyguy-wq.github.io/blob/main/content.json" target="_blank" class="btn btn-primary" onclick="closeGitHubModal()">↗ Open GitHub Repo</a>
            </div>
        </div>
    </div>

    <script>
        let db = null;
        let currentPage = 'home';

        const pageUrls = {
            home: 'https://stl.planet-recycling.pl/',
            map: 'https://stl.planet-recycling.pl/map.html',
            interviews: 'https://stl.planet-recycling.pl/interviews.html',
            about: 'https://stl.planet-recycling.pl/about.html',
            quiz: 'https://stl.planet-recycling.pl/quiz.html'
        };

        const pageConfigs = {
            home: { title: 'Home Page' },
            map: { title: 'Map Page' },
            interviews: { title: 'Interviews' },
            about: { title: 'About Page' },
            quiz: { title: 'Quiz Application' }
        };

        // --- FETCH ENGINE ---
        async function fetchJSON() {
            const btn = document.querySelector('#setup-screen .btn-primary');
            const originalText = btn.innerText;
            try {
                btn.innerText = "⌛ Fetching...";
                const response = await fetch('https://stl.planet-recycling.pl/content.json');
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                db = data;
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('editor-screen').style.display = 'flex';
                switchPage('home');
            } catch (err) {
                alert("Failed to fetch JSON. Check your connection or CORS settings.");
                console.error(err);
                btn.innerText = originalText;
            }
        }

        // --- AUTO-LOADER ---
        document.getElementById('json-loader').addEventListener('input', function(e) {
            try {
                db = JSON.parse(e.target.value);
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('editor-screen').style.display = 'flex';
                switchPage('home');
            } catch(err) { /* Waiting for valid JSON */ }
        });

        function switchPage(pageKey) {
            currentPage = pageKey;
            document.getElementById('sidebar-title').innerText = `Editing ${pageConfigs[pageKey].title}`;
            document.getElementById('page-selector').value = pageKey;
            
            // Auto-navigate iframe to the correct page so the user can see their edits
            const iframe = document.getElementById('preview-frame');
            if (iframe.src !== pageUrls[pageKey]) {
                iframe.src = pageUrls[pageKey];
                setTimeout(syncIframe, 1000); // Give it a second to load the new HTML before syncing data
            } else {
                syncIframe();
            }

            renderForm();
        }

        function reloadPreview() {
            document.getElementById('preview-frame').src = pageUrls[currentPage];
            setTimeout(syncIframe, 800);
        }

        function setDevice(type) {
            document.getElementById('btn-desktop').classList.toggle('active', type === 'desktop');
            document.getElementById('btn-mobile').classList.toggle('active', type === 'mobile');
            document.getElementById('iframe-wrap').style.width = type === 'mobile' ? '375px' : '100%';
        }

        // --- DATA BINDING HELPERS ---
        function getPath(obj, path) {
            return path.split('.').reduce((o, i) => (o ? o[i] : undefined), obj);
        }

        function setPath(obj, path, value) {
            const keys = path.split('.');
            let current = obj;
            for (let i = 0; i < keys.length - 1; i++) {
                if (current[keys[i]] === undefined) {
                    // Create an array if the next key is a number, otherwise an object
                    current[keys[i]] = isNaN(keys[i + 1]) ? {} : [];
                }
                current = current[keys[i]];
            }
            current[keys[keys.length - 1]] = value;
        }

        function updateData(path, value) {
            setPath(db, path, value);
            syncIframe();
        }

        function syncIframe() {
            const iframe = document.getElementById('preview-frame');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ type: 'UPDATE_CONTENT', data: db }, '*');
            }
        }

        // --- DYNAMIC ARRAY HELPERS ---
        window.addArrayItem = function(path, type) {
            let arr = getPath(db, path);
            if (!arr) {
                setPath(db, path, []);
                arr = getPath(db, path);
            }

            let newItem = {};
            if (type === 'heroBtn') newItem = { text: "New Button", url: "#" };
            else if (type === 'stat') newItem = { value: "0", label: "New Stat" };
            else if (type === 'interview') newItem = { label: "NEW", title: "New Interview", description: "" };
            else if (type === 'team') newItem = { name: "New Member", role: "Role" };
            else if (type === 'quiz') newItem = { q: "New Question?", a: "Yes", info: "Explanation here." };
            else if (type === 'block') newItem = { label: "", title: "New Content Block", body: "", imageUrl: "", buttonText: "", buttonUrl: "", expandableBody: "" };

            arr.push(newItem);
            renderForm();
            syncIframe();
        };

        window.removeArrayItem = function(path, index) {
            let arr = getPath(db, path);
            if (arr) {
                arr.splice(index, 1);
                renderForm();
                syncIframe();
            }
        };

        // --- RENDER FORM ENGINE ---
        function renderForm() {
            const container = document.getElementById('form-container');
            const addBtnStyle = "width:100%; justify-content:center; margin-top:10px; background: rgba(16, 185, 129, 0.1); border-color: var(--accent); color: var(--accent);";
            let html = '';

            // Safe init
            if (!db.metadata) db.metadata = {};
            if (!db.hero) db.hero = {};
            if (!db.hero.buttons) db.hero.buttons = [];
            if (!db.stats) db.stats = [];
            if (!db.popup) db.popup = {};
            if (!db.contentBlocks) db.contentBlocks = [];
            
            if (!db.mapPage) db.mapPage = {};
            if (!db.interviewsPage) db.interviewsPage = {};
            if (!db.interviewsPage.entries) db.interviewsPage.entries = [];
            if (!db.aboutPage) db.aboutPage = {};
            if (!db.aboutPage.team) db.aboutPage.team = [];
            if (!db.quizPage) db.quizPage = {};
            if (!db.quizPage.questions) db.quizPage.questions = [];

            if (currentPage === 'home') {
                html += `
                    <div style="margin: 0 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Metadata</h3></div>
                    <div class="field-group"><label>Page Title</label><input type="text" value="${db.metadata.pageTitle || ''}" onchange="updateData('metadata.pageTitle', this.value)"></div>
                    <div class="field-group"><label>Meta Title</label><input type="text" value="${db.metadata.metaTitle || ''}" onchange="updateData('metadata.metaTitle', this.value)"></div>
                    <div class="field-group"><label>Meta Description</label><textarea onchange="updateData('metadata.metaDescription', this.value)">${db.metadata.metaDescription || ''}</textarea></div>

                    <div style="margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Popup Notifier</h3></div>
                    <div class="field-group"><label>Popup Enabled</label>
                        <select onchange="updateData('popup.enabled', this.value === 'true')">
                            <option value="true" ${db.popup.enabled ? 'selected' : ''}>Yes</option>
                            <option value="false" ${!db.popup.enabled ? 'selected' : ''}>No</option>
                        </select>
                    </div>
                    <div class="field-group"><label>Popup Message (HTML allowed)</label><textarea onchange="updateData('popup.message', this.value)">${db.popup.message || ''}</textarea></div>
                    <div class="field-group"><label>Popup Link Text</label><input type="text" value="${db.popup.linkText || ''}" onchange="updateData('popup.linkText', this.value)"></div>
                    <div class="field-group"><label>Popup Link URL</label><input type="text" value="${db.popup.linkUrl || ''}" onchange="updateData('popup.linkUrl', this.value)"></div>

                    <div style="margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Hero Section</h3></div>
                    <div class="field-group"><label>Hero Title</label><input type="text" value="${db.hero.title || ''}" onchange="updateData('hero.title', this.value)"></div>
                    <div class="field-group"><label>Hero Tagline</label><textarea onchange="updateData('hero.tagline', this.value)">${db.hero.tagline || ''}</textarea></div>
                `;

                db.hero.buttons.forEach((btn, index) => {
                    html += `<div class="array-item">
                        <div class="array-item-header"><span class="array-item-title">Button ${index+1}</span><button class="btn-danger" onclick="removeArrayItem('hero.buttons', ${index})">Remove</button></div>
                        <div class="field-group"><label>Button Text</label><input type="text" value="${btn.text || ''}" onchange="updateData('hero.buttons.${index}.text', this.value)"></div>
                        <div class="field-group"><label>Button URL</label><input type="text" value="${btn.url || ''}" onchange="updateData('hero.buttons.${index}.url', this.value)"></div>
                    </div>`;
                });
                html += `<button class="btn" onclick="addArrayItem('hero.buttons', 'heroBtn')" style="${addBtnStyle}">+ Add Button</button>`;

                html += `<div style="margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Stats Grid</h3></div>`;
                db.stats.forEach((stat, index) => {
                    html += `<div class="array-item">
                        <div class="array-item-header"><span class="array-item-title">Stat ${index+1}</span><button class="btn-danger" onclick="removeArrayItem('stats', ${index})">Remove</button></div>
                        <div class="field-group"><label>Value</label><input type="text" value="${stat.value || ''}" onchange="updateData('stats.${index}.value', this.value)"></div>
                        <div class="field-group"><label>Label</label><input type="text" value="${stat.label || ''}" onchange="updateData('stats.${index}.label', this.value)"></div>
                    </div>`;
                });
                html += `<button class="btn" onclick="addArrayItem('stats', 'stat')" style="${addBtnStyle}">+ Add Stat</button>`;

                html += `<div style="margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">
                    <h3 style="color:var(--accent);">Content Blocks</h3>
                    <p style="font-size:11px; color:var(--text-dim);">Articles & expanding lists. Leave empty to hide.</p>
                </div>`;
                db.contentBlocks.forEach((block, index) => {
                    html += `<div class="array-item">
                        <div class="array-item-header">
                            <span class="array-item-title">Block ${index + 1}</span>
                            <button class="btn-danger" onclick="removeArrayItem('contentBlocks', ${index})">Remove</button>
                        </div>
                        <div class="field-group"><label>Small Label</label><input type="text" value="${block.label || ''}" onchange="updateData('contentBlocks.${index}.label', this.value)"></div>
                        <div class="field-group"><label>Image URL</label><input type="text" value="${block.imageUrl || ''}" onchange="updateData('contentBlocks.${index}.imageUrl', this.value)"></div>
                        <div class="field-group"><label>Title (Big Text)</label><input type="text" value="${block.title || ''}" onchange="updateData('contentBlocks.${index}.title', this.value)"></div>
                        <div class="field-group"><label>Body Text</label><textarea onchange="updateData('contentBlocks.${index}.body', this.value)">${block.body || ''}</textarea></div>
                        <div class="field-group"><label>Expandable Part (Hidden until clicked)</label><textarea onchange="updateData('contentBlocks.${index}.expandableBody', this.value)">${block.expandableBody || ''}</textarea></div>
                        <div class="field-group"><label>Button Text</label><input type="text" value="${block.buttonText || ''}" onchange="updateData('contentBlocks.${index}.buttonText', this.value)"></div>
                        <div class="field-group"><label>Button URL</label><input type="text" value="${block.buttonUrl || ''}" onchange="updateData('contentBlocks.${index}.buttonUrl', this.value)"></div>
                    </div>`;
                });
                html += `<button class="btn" onclick="addArrayItem('contentBlocks', 'block')" style="${addBtnStyle}">+ Add Content Block</button>`;

            } else if (currentPage === 'map') {
                html += `
                    <div style="margin: 0 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Map Metadata</h3></div>
                    <div class="field-group"><label>Page Title</label><input type="text" value="${db.mapPage.pageTitle || ''}" onchange="updateData('mapPage.pageTitle', this.value)"></div>
                    <div class="field-group"><label>Meta Title</label><input type="text" value="${db.mapPage.metaTitle || ''}" onchange="updateData('mapPage.metaTitle', this.value)"></div>
                    <div class="field-group"><label>Meta Description</label><textarea onchange="updateData('mapPage.metaDescription', this.value)">${db.mapPage.metaDescription || ''}</textarea></div>

                    <div style="margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Map Content</h3></div>
                    <div class="field-group"><label>Title</label><input type="text" value="${db.mapPage.title || ''}" onchange="updateData('mapPage.title', this.value)"></div>
                    <div class="field-group"><label>Tagline</label><textarea onchange="updateData('mapPage.tagline', this.value)">${db.mapPage.tagline || ''}</textarea></div>
                    <div class="field-group"><label>Map iFrame URL</label><input type="text" value="${db.mapPage.mapUrl || ''}" onchange="updateData('mapPage.mapUrl', this.value)"></div>
                    <div class="field-group"><label>Instructions Title</label><input type="text" value="${db.mapPage.instructionsTitle || ''}" onchange="updateData('mapPage.instructionsTitle', this.value)"></div>
                    <div class="field-group"><label>Instructions Body</label><textarea onchange="updateData('mapPage.instructionsBody', this.value)">${db.mapPage.instructionsBody || ''}</textarea></div>
                `;

            } else if (currentPage === 'interviews') {
                html += `
                    <div style="margin: 0 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Interviews Metadata</h3></div>
                    <div class="field-group"><label>Page Title</label><input type="text" value="${db.interviewsPage.pageTitle || ''}" onchange="updateData('interviewsPage.pageTitle', this.value)"></div>
                    <div class="field-group"><label>Meta Title</label><input type="text" value="${db.interviewsPage.metaTitle || ''}" onchange="updateData('interviewsPage.metaTitle', this.value)"></div>
                    <div class="field-group"><label>Meta Description</label><textarea onchange="updateData('interviewsPage.metaDescription', this.value)">${db.interviewsPage.metaDescription || ''}</textarea></div>

                    <div style="margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Main Content</h3></div>
                    <div class="field-group"><label>Title</label><input type="text" value="${db.interviewsPage.title || ''}" onchange="updateData('interviewsPage.title', this.value)"></div>
                    <div class="field-group"><label>Tagline</label><textarea onchange="updateData('interviewsPage.tagline', this.value)">${db.interviewsPage.tagline || ''}</textarea></div>
                    <div class="field-group"><label>Featured Video Embed URL</label><input type="text" value="${db.interviewsPage.featuredVideoUrl || ''}" onchange="updateData('interviewsPage.featuredVideoUrl', this.value)"></div>

                    <div style="margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Interview Entries</h3></div>
                `;
                db.interviewsPage.entries.forEach((entry, index) => {
                    html += `<div class="array-item">
                        <div class="array-item-header"><span class="array-item-title">Entry ${index+1}</span><button class="btn-danger" onclick="removeArrayItem('interviewsPage.entries', ${index})">Remove</button></div>
                        <div class="field-group"><label>Label (Small text)</label><input type="text" value="${entry.label || ''}" onchange="updateData('interviewsPage.entries.${index}.label', this.value)"></div>
                        <div class="field-group"><label>Title</label><input type="text" value="${entry.title || ''}" onchange="updateData('interviewsPage.entries.${index}.title', this.value)"></div>
                        <div class="field-group"><label>Description</label><textarea onchange="updateData('interviewsPage.entries.${index}.description', this.value)">${entry.description || ''}</textarea></div>
                    </div>`;
                });
                html += `<button class="btn" onclick="addArrayItem('interviewsPage.entries', 'interview')" style="${addBtnStyle}">+ Add Entry</button>`;

            } else if (currentPage === 'about') {
                html += `
                    <div style="margin: 0 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">About Metadata</h3></div>
                    <div class="field-group"><label>Page Title</label><input type="text" value="${db.aboutPage.pageTitle || ''}" onchange="updateData('aboutPage.pageTitle', this.value)"></div>
                    <div class="field-group"><label>Meta Title</label><input type="text" value="${db.aboutPage.metaTitle || ''}" onchange="updateData('aboutPage.metaTitle', this.value)"></div>
                    <div class="field-group"><label>Meta Description</label><textarea onchange="updateData('aboutPage.metaDescription', this.value)">${db.aboutPage.metaDescription || ''}</textarea></div>

                    <div style="margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Header</h3></div>
                    <div class="field-group"><label>Title</label><input type="text" value="${db.aboutPage.title || ''}" onchange="updateData('aboutPage.title', this.value)"></div>
                    <div class="field-group"><label>Tagline</label><textarea onchange="updateData('aboutPage.tagline', this.value)">${db.aboutPage.tagline || ''}</textarea></div>

                    <div style="margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Mission Section</h3></div>
                    <div class="field-group"><label>Mission Title</label><input type="text" value="${db.aboutPage.missionTitle || ''}" onchange="updateData('aboutPage.missionTitle', this.value)"></div>
                    <div class="field-group"><label>Mission Body (HTML allowed)</label><textarea onchange="updateData('aboutPage.missionBody', this.value)">${db.aboutPage.missionBody || ''}</textarea></div>

                    <div style="margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Context Section</h3></div>
                    <div class="field-group"><label>Context Title</label><input type="text" value="${db.aboutPage.contextTitle || ''}" onchange="updateData('aboutPage.contextTitle', this.value)"></div>
                    <div class="field-group"><label>Course/Class</label><input type="text" value="${db.aboutPage.contextCourse || ''}" onchange="updateData('aboutPage.contextCourse', this.value)"></div>
                    <div class="field-group"><label>Date</label><input type="text" value="${db.aboutPage.contextDate || ''}" onchange="updateData('aboutPage.contextDate', this.value)"></div>
                    <div class="field-group"><label>Focus</label><input type="text" value="${db.aboutPage.contextFocus || ''}" onchange="updateData('aboutPage.contextFocus', this.value)"></div>
                    <div class="field-group"><label>Quote</label><textarea onchange="updateData('aboutPage.contextQuote', this.value)">${db.aboutPage.contextQuote || ''}</textarea></div>

                    <div style="margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Team Members</h3></div>
                `;
                db.aboutPage.team.forEach((member, index) => {
                    html += `<div class="array-item">
                        <div class="array-item-header"><span class="array-item-title">Member ${index+1}</span><button class="btn-danger" onclick="removeArrayItem('aboutPage.team', ${index})">Remove</button></div>
                        <div class="field-group"><label>Name</label><input type="text" value="${member.name || ''}" onchange="updateData('aboutPage.team.${index}.name', this.value)"></div>
                        <div class="field-group"><label>Role</label><input type="text" value="${member.role || ''}" onchange="updateData('aboutPage.team.${index}.role', this.value)"></div>
                    </div>`;
                });
                html += `<button class="btn" onclick="addArrayItem('aboutPage.team', 'team')" style="${addBtnStyle}">+ Add Member</button>`;

            } else if (currentPage === 'quiz') {
                html += `
                    <div style="margin: 0 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Quiz Metadata</h3></div>
                    <div class="field-group"><label>Page Title</label><input type="text" value="${db.quizPage.pageTitle || ''}" onchange="updateData('quizPage.pageTitle', this.value)"></div>

                    <div style="margin: 30px 0 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;"><h3 style="color:var(--accent);">Questions</h3></div>
                `;
                db.quizPage.questions.forEach((q, index) => {
                    html += `<div class="array-item">
                        <div class="array-item-header"><span class="array-item-title">Question ${index+1}</span><button class="btn-danger" onclick="removeArrayItem('quizPage.questions', ${index})">Remove</button></div>
                        <div class="field-group"><label>Question Text</label><input type="text" value="${q.q || ''}" onchange="updateData('quizPage.questions.${index}.q', this.value)"></div>
                        <div class="field-group"><label>Correct Answer</label>
                            <select onchange="updateData('quizPage.questions.${index}.a', this.value)">
                                <option value="Yes" ${q.a === 'Yes' ? 'selected' : ''}>Yes</option>
                                <option value="No" ${q.a === 'No' ? 'selected' : ''}>No</option>
                            </select>
                        </div>
                        <div class="field-group"><label>Explanation Info</label><textarea onchange="updateData('quizPage.questions.${index}.info', this.value)">${q.info || ''}</textarea></div>
                    </div>`;
                });
                html += `<button class="btn" onclick="addArrayItem('quizPage.questions', 'quiz')" style="${addBtnStyle}">+ Add Question</button>`;
            }

            container.innerHTML = html;
        }

        function openGitHubModal() {
            document.getElementById('export-json').value = JSON.stringify(db, null, 2);
            document.getElementById('github-modal').style.display = 'flex';
        }

        function closeGitHubModal() {
            document.getElementById('github-modal').style.display = 'none';
        }

        function copyJSON() {
            const copyText = document.getElementById('export-json');
            copyText.select();
            document.execCommand("copy");
            alert("Copied to clipboard!");
        }
    </script>
</body>
</html>
