<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title id="page-title">Recycle St. Louis</title>
    
    <link rel="stylesheet" href="./style.css">

    <meta name="title" id="meta-title" content="">
    <meta name="description" id="meta-desc" content="">

    <style>
        /* --- GLOBAL RESETS --- */
        *, *::before, *::after {
            box-sizing: border-box; 
        }

        :root {
            --accent: #10b981;
            --surface: #18181b;
            --border: #27272a;
            --text: #ffffff;
            --text-dim: #a1a1aa;
            --danger: #ef4444;
        }

        /* --- SHARE BUTTON (MOBILE ONLY, HIDDEN AT TOP) --- */
        #share-site-btn {
            position: fixed; top: 15px; right: 15px;
            background: rgba(16, 185, 129, 0.15); color: var(--accent);
            border: 1px solid var(--accent); border-radius: 8px;
            padding: 8px 16px; font-weight: bold; cursor: pointer;
            z-index: 10001; transition: opacity 0.3s, visibility 0.3s, background 0.2s; backdrop-filter: blur(5px);
            opacity: 0; visibility: hidden; /* Hidden until scrolled */
        }
        #share-site-btn.scrolled {
            opacity: 1; visibility: visible;
        }
        #share-site-btn:hover { background: var(--accent); color: #000; }

        @media (min-width: 769px) {
            #share-site-btn { display: none !important; }
        }

        /* --- POPUP NOTIFICATION (ULTRA COMPACT) --- */
        #popup-notif { 
            position: fixed; top: 75px; right: 20px; 
            background: var(--surface); color: var(--text); 
            padding: 8px 12px; /* Tight padding */
            border-radius: 8px; z-index: 10000; 
            border: 1px solid var(--accent); box-shadow: 0 6px 15px rgba(0,0,0,0.6); 
            width: max-content; max-width: 280px; 
            font-size: 13px; /* Slightly smaller font */
        }
        .close-notif { position: absolute; top: 2px; right: 6px; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-dim); transition: 0.2s; padding: 0; }
        .close-notif:hover { color: var(--danger); }
        .popup-link { color: var(--accent); font-weight: bold; text-decoration: none; display: inline-block; margin-top: 2px; }

        /* --- HACKER TERMINAL --- */
        #hacker-terminal {
            display: none; position: fixed; inset: 0; background: rgba(0, 10, 0, 0.95); z-index: 99999;
            color: #0f0; font-family: 'Courier New', monospace; padding: 40px; overflow: hidden; border: 4px solid #050;
        }
        .terminal-header { border-bottom: 2px solid #050; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .terminal-header span { font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .scanline { width: 100%; height: 2px; background: rgba(0, 255, 0, 0.1); position: absolute; top: 0; left: 0; pointer-events: none; animation: scan 4s linear infinite; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
        .admin-links { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
        .admin-links a, .admin-links button { background: transparent; border: 1px solid #0f0; color: #0f0; padding: 12px; text-decoration: none; text-align: left; cursor: pointer; font-family: monospace; transition: 0.2s; max-width: 400px; }
        .admin-links a:hover, .admin-links button:hover { background: #0f0; color: #000; box-shadow: 0 0 15px #0f0; }
        #code-scroll { position: absolute; right: 40px; top: 80px; width: 45%; height: 80vh; color: rgba(0, 255, 0, 0.4); font-size: 11px; white-space: pre; overflow: hidden; border-left: 1px solid #050; padding-left: 20px; }
        .close-terminal { color: #0f0; background: none; border: none; font-size: 24px; cursor: pointer; }
        
        /* --- MAIN CONTENT & DYNAMIC BLOCKS --- */
        #main-content { display: flex; flex-direction: column; align-items: center; width: 100%; padding-top: 20px; }
        
        .dynamic-block { 
            max-width: 800px; width: 100%; 
            margin: 0 auto 50px; padding: 30px; 
            background: rgba(255,255,255,0.03); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            transition: transform 0.2s; 
        }
        .dynamic-block:hover { border-color: var(--accent); }

        .block-label { color: var(--accent); font-weight: 800; font-size: 12px; text-transform: uppercase; display: block; margin-bottom: 10px; letter-spacing: 1.5px; text-align: center; }
        .block-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .block-title { margin-bottom: 15px; font-size: 1.8rem; text-align: center; }
        .block-body { margin-bottom: 20px; line-height: 1.6; color: var(--text-dim); font-size: 1.1rem; }
        
        /* Buttons */
        .hero-btn { padding: 12px 24px; background: var(--accent); color: #000; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.2s; display: inline-block; }
        .hero-btn:hover { box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        
        /* Centered action group */
        .action-group { margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; align-items: center; }
        .action-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); cursor: pointer; font-weight: bold; padding: 10px 20px; border-radius: 8px; transition: 0.2s; text-decoration: none; display: inline-block; }
        .action-btn:hover { background: var(--accent); color: #000; }
        .action-btn.secondary { border-color: #3f3f46; color: #e4e4e7; }
        .action-btn.secondary:hover { background: #3f3f46; color: #fff; }

        /* --- EXPANDABLE STYLES (DESKTOP) --- */
        .expand-content { position: relative; max-height: 0; overflow: hidden; transition: max-height 0.4s ease-in-out, padding 0.4s ease-in-out, opacity 0.4s ease-in-out, margin-bottom 0.4s ease-in-out; opacity: 0; padding: 0 20px; background: rgba(0,0,0,0.2); border-left: 4px solid var(--accent); border-radius: 6px; color: #e4e4e7; font-size: 1.1rem; line-height: 1.8; max-width: 100%; white-space: pre-wrap; margin-bottom: 0; }
        .expand-content.expanded { max-height: 3500px; opacity: 1; padding: 25px 30px; margin-bottom: 20px; }
        .inline-sources-container { margin-top: 30px; padding-top: 20px; border-top: 1px solid #333; text-align: center; }

        /* --- FULLSCREEN ICON (INSIDE READ MORE) --- */
        .fullscreen-icon { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-dim); font-size: 1.2rem; cursor: pointer; opacity: 0.4; transition: 0.2s; padding: 5px; }
        .fullscreen-icon:hover { color: var(--accent); opacity: 1; }

        /* --- MODAL STYLES --- */
        #article-modal { visibility: hidden; opacity: 0; pointer-events: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 20000; backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 20px; transition: opacity 0.3s ease, visibility 0.3s ease; }
        #article-modal.show { visibility: visible; opacity: 1; pointer-events: auto; }
        .modal-content-box { background: #111; width: 100%; max-width: 750px; max-height: 85vh; border: 1px solid var(--accent); border-radius: 15px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0, 255, 136, 0.2); transform: translateY(30px) scale(0.95); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        #article-modal.show .modal-content-box { transform: translateY(0) scale(1); }
        .modal-header { padding: 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .modal-close { background: none; border: none; color: #fff; font-size: 30px; cursor: pointer; line-height: 1; transition: 0.2s; }
        .article-text { font-family: 'Inter', -apple-system, sans-serif; max-width: 65ch; margin: 0 auto; white-space: pre-wrap; }

        .modal-actions { margin-top: 30px; padding-top: 25px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 12px; }
        .modal-actions a { text-align: center; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 1.05rem; transition: 0.2s; }
        .btn-recycle { background: rgba(16, 185, 129, 0.1); color: var(--accent); border: 1px solid var(--accent); }
        .btn-recycle:hover { background: var(--accent); color: #000; }
        .btn-sources { background: rgba(255, 255, 255, 0.05); color: #e4e4e7; border: 1px solid #3f3f46; }
        .btn-sources:hover { background: #3f3f46; color: #fff; }

        /* --- MOBILE SCROLL INDICATOR --- */
        .mobile-scroll-indicator { display: none; position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 10px 24px; border-radius: 30px; font-size: 0.9rem; font-weight: bold; z-index: 9000; pointer-events: none; box-shadow: 0 5px 15px rgba(0,0,0,0.4); animation: bounce 2s infinite; transition: opacity 0.3s ease, visibility 0.3s; opacity: 0; visibility: hidden; }
        body:not(.modal-open) .mobile-scroll-indicator.visible { opacity: 1; visibility: visible; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); }
            40% { transform: translateY(-10px) translateX(-50%); }
            60% { transform: translateY(-5px) translateX(-50%); }
        }

        /* --- RESPONSIVE ADJUSTMENTS --- */
        @media (max-width: 768px) {
            /* Kill the notification completely on mobile */
            #popup-notif { display: none !important; }
            
            .dynamic-block { padding: 20px; }
            .modal-content-box { max-height: 90vh; }
            #modal-body-content { padding: 20px !important; font-size: 1.05rem !important; }
            .mobile-scroll-indicator { display: block; }
            
            /* Hide desktop specific buttons on mobile */
            .hide-on-mobile { display: none !important; } 
        }
    </style>
</head>
<body>

    <button id="share-site-btn" onclick="shareSite()">Share ↗</button>

    <div id="hacker-terminal">
        <div class="scanline"></div>
        <div class="terminal-header">
            <span>[ SYSTEM OVERRIDE: AUTHORIZED ACCESS ]</span>
            <button class="close-terminal" onclick="toggleTerminal(false)">×</button>
        </div>
        <div id="terminal-content">
            <p>> root@recycle-stl:~# access_granted</p>
            <p>> initializing admin_panel_v3.0...</p>
            <div class="admin-links">
                <a href="/admin/test">> 📂 VIEW TEST PAGE</a>
                <a href="/admin">> ⚡ OPEN ADMIN STUDIO</a>
                <a href="/admin/articlegen">> ⚡ OPEN Article STUDIO</a>
                <a href="https://github.com/greatestbestesyguy-wq/greatestbestesyguy-wq.github.io" target="_blank">> 🛠 GITHUB REPOSITORY</a>
                <button onclick="startHackerTyper()">> 💾 INITIALIZE DECRYPTION SEQUENCER</button>
            </div>
        </div>
        <div id="code-scroll"></div>
    </div>

    <div id="popup-notif" style="display:none;">
        <button class="close-notif" onclick="closePopup()">×</button>
        <div id="popup-content" style="padding-right: 15px; font-size: 13px; line-height: 1.3;"></div>
    </div>

    <div class="container">
        <div id="header-placeholder"></div>

        <main id="main-content">
            <h1 id="hero-title" style="text-align:center;"></h1>
            <p id="hero-tagline" class="tagline" style="text-align:center;"></p>
            <div id="hero-buttons" class="action-group" style="margin-top: 20px;"></div>

            <div id="stats-grid" class="stats-grid"></div>

            <section id="interview-container" class="interview-section" style="display:none;"></section>
            <section id="article-section" style="display:none;"></section>
            <div id="additional-articles-container" style="display:none;"></div>
        </main>

        <div id="footer-placeholder"></div>
    </div>

    <div id="mobile-scroll-indicator" class="mobile-scroll-indicator visible">
        Scroll to see more ↓
    </div>

    <div id="article-modal">
        <div class="modal-content-box">
            <div class="modal-header">
                <span id="modal-label" class="block-label" style="margin-bottom:0;">Article</span>
                <button onclick="closeArticleModal()" class="modal-close">&times;</button>
            </div>
            <div id="modal-body-content" style="padding:30px; overflow-y:auto; color:#eee; font-size:1.1rem; line-height:1.8;">
                <h2 id="modal-title" class="block-title" style="color:#fff; text-align: center;"></h2>
                <img id="modal-image" class="block-img" src="" style="display:none;">
                <div id="modal-text" class="article-text"></div>
                
                <div class="modal-actions">
                    <a href="/maps" class="btn-recycle">Recycle Now</a>
                    <a href="/sources" class="btn-sources">View Sources</a>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
    <script>
        // --- SHARE BUTTON LOGIC ---
        function shareSite() {
            const shareData = {
                title: document.title,
                text: 'Check out Recycle St. Louis!',
                url: window.location.href
            };
            if (navigator.share) {
                navigator.share(shareData).catch(err => console.log('Error sharing:', err));
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Link copied to clipboard!");
            }
        }

        // --- HYBRID READ MORE LOGIC ---
        function handleReadMore(index, expId, btnEl) {
            if (window.innerWidth <= 768) {
                openArticleModal(index); // Mobile defaults to modal
            } else {
                // Desktop expands inline
                const el = document.getElementById(expId);
                el.classList.toggle('expanded');
                btnEl.innerText = el.classList.contains('expanded') ? 'Read Less ↑' : 'Read More ↓';
            }
        }

        // --- MODAL LOGIC ---
        function openArticleModal(index) {
            const block = window.siteContentBlocks[index];
            document.getElementById('modal-title').innerText = block.title || '';
            document.getElementById('modal-label').innerText = block.label || 'Article';
            document.getElementById('modal-text').innerHTML = block.expandableBody;
            
            const modalImg = document.getElementById('modal-image');
            if (block.imageUrl) {
                modalImg.src = block.imageUrl;
                modalImg.style.display = 'block';
            } else {
                modalImg.style.display = 'none';
            }
            
            const modal = document.getElementById('article-modal');
            modal.classList.add('show');
            document.body.style.overflow = 'hidden'; 
            document.body.classList.add('modal-open'); 
        }

        function closeArticleModal() {
            const modal = document.getElementById('article-modal');
            modal.classList.remove('show');
            document.body.style.overflow = 'auto'; 
            document.body.classList.remove('modal-open');
        }

        function closePopup() {
            document.getElementById('popup-notif').style.display = 'none';
            sessionStorage.setItem('notifClosed', 'true');
        }

        // --- SCROLL LISTENERS (Mobile Indicator & Share Button) ---
        window.addEventListener('scroll', () => {
            // Share button logic (hide at very top to protect nav)
            const shareBtn = document.getElementById('share-site-btn');
            if (shareBtn) {
                if (window.scrollY > 50) {
                    shareBtn.classList.add('scrolled');
                } else {
                    shareBtn.classList.remove('scrolled');
                }
            }

            // Mobile indicator logic
            const indicator = document.getElementById('mobile-scroll-indicator');
            if (indicator && window.innerWidth <= 768) {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 150) {
                    indicator.classList.remove('visible');
                } else {
                    indicator.classList.add('visible');
                }
            }
        });

        // --- ADMIN SEQUENCE LOGIC ---
        let inputString = "";
        window.addEventListener("keydown", (e) => {
            inputString += e.key.toLowerCase();
            if (inputString.length > 10) inputString = inputString.substring(1);
            if (inputString.endsWith("admin")) {
                toggleTerminal(true);
                inputString = "";
            }
        });

        function toggleTerminal(show) { document.getElementById('hacker-terminal').style.display = show ? 'block' : 'none'; }

        function startHackerTyper() {
            const codeBox = document.getElementById('code-scroll');
            const codeSnippets = [
                "import os\nimport sys\n# Bypassing firewall...",
                "def init_hack(ip):\n  return 'SUCCESS' if ping(ip) else 'FAIL'",
                "GET /admin/v3/config HTTP/1.1\nHost: planet-recycling.pl",
                "01001000 01100001 01100011 01101011",
                "const db = connect('stl_prod');\ndb.users.find({ role: 'admin' });",
                "CRITICAL WARNING: HEURISTIC DETECTION ACTIVE",
                "sudo rm -rf /var/log/access_logs",
                "Packet injection successful at port 8080..."
            ];
            setInterval(() => {
                codeBox.innerText += "\n" + codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
                codeBox.scrollTop = codeBox.scrollHeight;
            }, 80);
        }

        // --- CONTENT RENDERING ---
        function renderContent(data) {
            window.siteContentBlocks = data.contentBlocks; 

            document.title = data.metadata.pageTitle;
            const metaTitle = document.getElementById('meta-title');
            const metaDesc = document.getElementById('meta-desc');
            if(metaTitle) metaTitle.content = data.metadata.metaTitle;
            if(metaDesc) metaDesc.content = data.metadata.metaDescription;

            // Popup Logic (Height Fixed)
            const popup = document.getElementById('popup-notif');
            if (data.popup && data.popup.enabled && !sessionStorage.getItem('notifClosed')) {
                const popupContent = document.getElementById('popup-content');
                if(popupContent) {
                    let pLink = (data.popup.linkText && data.popup.linkUrl) ? `<a href="${data.popup.linkUrl}" class="popup-link">${data.popup.linkText} →</a>` : '';
                    popupContent.innerHTML = `<p style="margin:0;">${data.popup.message || ''}</p>${pLink}`;
                }
                if(popup) popup.style.display = ''; 
            } else {
                if(popup) popup.style.display = 'none';
            }

            // Hero Logic
            document.getElementById('hero-title').innerText = data.hero.title;
            document.getElementById('hero-tagline').innerText = data.hero.tagline;
            const btnContainer = document.getElementById('hero-buttons');
            if (btnContainer) {
                btnContainer.innerHTML = '';
                if (data.hero.buttons) {
                    data.hero.buttons.forEach(btn => {
                        const a = document.createElement('a');
                        a.href = btn.url || '#';
                        a.innerText = btn.text || 'Click Here';
                        a.className = 'hero-btn'; 
                        btnContainer.appendChild(a);
                    });
                }
            }

            // Main Content Rendering
            const mainContent = document.getElementById('main-content');
            document.querySelectorAll('.dynamic-block').forEach(e => e.remove());

            if (data.contentBlocks) {
                data.contentBlocks.forEach((block, index) => {
                    const sec = document.createElement('section');
                    sec.className = 'dynamic-block';
                    
                    let html = '';
                    if (block.label) html += `<span class="block-label">${block.label}</span>`;
                    if (block.imageUrl) html += `<img src="${block.imageUrl}" class="block-img">`;
                    if (block.title) html += `<h2 class="block-title">${block.title}</h2>`;
                    if (block.body) html += `<p class="block-body">${block.body}</p>`;
                    
                    if (block.expandableBody) {
                        const expId = 'exp-' + index;
                        
                        // Sources button appended to the BOTTOM of the expanded text
                        const sourcesBtnHtml = `<div class="inline-sources-container hide-on-mobile"><a href="/sources" class="action-btn secondary">View Sources</a></div>`;
                        
                        // Hidden Fullscreen Icon (Inside Read More box)
                        const fullscreenIcon = `<button class="fullscreen-icon hide-on-mobile" title="Fullscreen" onclick="openArticleModal(${index})">⛶</button>`;
                        
                        // Wrap it all inside the expand container
                        html += `<div id="${expId}" class="expand-content">${fullscreenIcon}${block.expandableBody}${sourcesBtnHtml}</div>`;
                        
                        // Action buttons centered below (removed fullscreen from here)
                        html += `<div class="action-group">`;
                        html += `<button class="action-btn" onclick="handleReadMore(${index}, '${expId}', this)">Read More ↓</button>`;
                        html += `</div>`;
                        
                    } else if (block.buttonText && block.buttonUrl) {
                        html += `<div class="action-group"><a href="${block.buttonUrl}" class="hero-btn">${block.buttonText}</a></div>`;
                    }
                    
                    sec.innerHTML = html;
                    mainContent.appendChild(sec);
                });
            }
        }

        async function loadPageData() {
            try {
                const response = await fetch('./content.json');
                const data = await response.json();
                renderContent(data);
            } catch (error) {
                console.error("Error loading JSON content:", error);
            }
        }

        loadPageData();

        window.addEventListener('message', (event) => {
            if (event.data.type === 'UPDATE_CONTENT') renderContent(event.data.data);
        });

        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>
</html>
