<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-R1Y5DRSP21"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-R1Y5DRSP21');

    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Recycle St. Louis</title>
    
    <link rel="stylesheet" href="./style.css">

    <meta name="title" id="meta-title" content="">
    <meta name="description" id="meta-desc" content="">

    <style>
        /* HACKER TERMINAL STYLES */
        #hacker-terminal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 10, 0, 0.95);
            z-index: 9999;
            color: #0f0;
            font-family: 'Courier New', monospace;
            padding: 40px;
            overflow: hidden;
            border: 4px solid #050;
        }

        .terminal-header { border-bottom: 2px solid #050; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .terminal-header span { font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        
        .scanline {
            width: 100%; height: 2px; background: rgba(0, 255, 0, 0.1); position: absolute;
            top: 0; left: 0; pointer-events: none; animation: scan 4s linear infinite;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        .admin-links { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
        .admin-links a, .admin-links button {
            background: transparent; border: 1px solid #0f0; color: #0f0; padding: 12px;
            text-decoration: none; text-align: left; cursor: pointer; font-family: monospace;
            transition: 0.2s; max-width: 400px;
        }
        .admin-links a:hover, .admin-links button:hover { background: #0f0; color: #000; box-shadow: 0 0 15px #0f0; }

        #code-scroll {
            position: absolute; right: 40px; top: 80px; width: 45%; height: 80vh;
            color: rgba(0, 255, 0, 0.4); font-size: 11px; white-space: pre;
            overflow: hidden; border-left: 1px solid #050; padding-left: 20px;
        }

        .close-terminal { color: #0f0; background: none; border: none; font-size: 24px; cursor: pointer; }
        
        /* POPUP & CONTENT STYLES */
        #popup-notif { position: fixed; bottom: 20px; right: 20px; background: var(--surface, #18181b); color: var(--text, #fff); padding: 25px; border-radius: 12px; z-index: 10000; border: 2px solid var(--accent, #10b981); box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 320px; }
        .close-notif { position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-dim, #a1a1aa); transition: 0.2s; }
        .close-notif:hover { color: var(--danger, #ef4444); }
        .dynamic-block { max-width: 800px; margin: 0 auto 50px; padding: 30px; background: rgba(255,255,255,0.03); border: 1px solid var(--border, #27272a); border-radius: 16px; transition: transform 0.2s; }
        .dynamic-block:hover { border-color: var(--accent, #10b981); }

        /* SMOOTH EXPANDABLE STYLES */
        .expand-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out, padding 0.4s ease-in-out, opacity 0.4s ease-in-out, margin-bottom 0.4s ease-in-out;
            opacity: 0;
            padding: 0 20px;
            background: rgba(0,0,0,0.2);
            border-left: 4px solid var(--accent, #10b981);
            border-radius: 6px;
            color: var(--text, #fff);
            white-space: pre-wrap;
            margin-bottom: 0;
        }
        .expand-content.expanded {
            max-height: 800px; /* arbitrary large height to accommodate content smoothly */
            opacity: 1;
            padding: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="hacker-terminal">
        <div class="scanline"></div>
        <div class="terminal-header">
            <span>[ SYSTEM OVERRIDE: AUTHORIZED ACCESS ]</span>
            <button class="close-terminal" onclick="toggleTerminal(false)">×</button>
        </div>

        <div id="terminal-content">
            <p>> root@recycle-stl:~# access_granted</p>
            <p>> initializing admin_panel_v3.0...</p>
            
            <div class="admin-links">
                <a href="/admin/test">> 📂 VIEW TEST PAGE</a>
                <a href="/admin">> ⚡ OPEN ADMIN STUDIO</a>
                <a href="https://github.com/greatestbestesyguy-wq/greatestbestesyguy-wq.github.io" target="_blank">> 🛠 GITHUB REPOSITORY</a>
                <button onclick="startHackerTyper()">> 💾 INITIALIZE DECRYPTION SEQUENCER</button>
            </div>
        </div>

        <div id="code-scroll"></div>
    </div>

    <div id="popup-notif" style="display:none;">
        <button class="close-notif" onclick="closePopup()">×</button>
        <div id="popup-content" style="margin-top: 5px; font-size: 14.5px; line-height: 1.5;"></div>
    </div>

    <div class="container">
        <div id="header-placeholder"></div>

        <main id="main-content">
            <h1 id="hero-title"></h1>
            <p id="hero-tagline" class="tagline"></p>
            <div id="hero-buttons" style="display: flex; gap: 15px; margin-top: 20px; justify-content: center;"></div>

            <div id="stats-grid" class="stats-grid"></div>

            <section id="interview-container" class="interview-section" style="display:none;"></section>
            <section id="article-section" style="display:none;"></section>
            <div id="additional-articles-container" style="display:none;"></div>
        </main>

        <div id="footer-placeholder"></div>
    </div>

    <script src="./script.js"></script>
    <script>
        // --- ADMIN SEQUENCE LOGIC ---
        let inputString = "";
        window.addEventListener("keydown", (e) => {
            inputString += e.key.toLowerCase();
            if (inputString.length > 10) inputString = inputString.substring(1);
            
            if (inputString.endsWith("admin")) {
                toggleTerminal(true);
                inputString = "";
            }
        });

        function toggleTerminal(show) {
            document.getElementById('hacker-terminal').style.display = show ? 'block' : 'none';
        }

        function startHackerTyper() {
            const codeBox = document.getElementById('code-scroll');
            const codeSnippets = [
                "import os\nimport sys\n# Bypassing firewall...",
                "def init_hack(ip):\n  return 'SUCCESS' if ping(ip) else 'FAIL'",
                "GET /admin/v3/config HTTP/1.1\nHost: planet-recycling.pl",
                "01001000 01100001 01100011 01101011",
                "const db = connect('stl_prod');\ndb.users.find({ role: 'admin' });",
                "CRITICAL WARNING: HEURISTIC DETECTION ACTIVE",
                "sudo rm -rf /var/log/access_logs",
                "Packet injection successful at port 8080..."
            ];
            
            let i = 0;
            setInterval(() => {
                codeBox.innerText += "\n" + codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
                codeBox.scrollTop = codeBox.scrollHeight;
            }, 80);
        }

        function closePopup() {
            const popup = document.getElementById('popup-notif');
            if(popup) popup.style.display = 'none';
        }

        // --- EXISTING CONTENT LOGIC ---
        function renderContent(data) {
            document.title = data.metadata.pageTitle;
            const metaTitle = document.getElementById('meta-title');
            const metaDesc = document.getElementById('meta-desc');
            if(metaTitle) metaTitle.content = data.metadata.metaTitle;
            if(metaDesc) metaDesc.content = data.metadata.metaDescription;

            const popup = document.getElementById('popup-notif');
            if (data.popup && data.popup.enabled) {
                const popupContent = document.getElementById('popup-content');
                if(popupContent) {
                    let pLink = (data.popup.linkText && data.popup.linkUrl) ? `<br><br><a href="${data.popup.linkUrl}" style="color: var(--accent, #10b981); font-weight: bold; text-decoration: none; display: inline-block;">${data.popup.linkText} →</a>` : '';
                    popupContent.innerHTML = `<p style="margin-bottom:0;">${data.popup.message || ''}</p>${pLink}`;
                }
                if(popup) popup.style.display = 'block';
            } else {
                if(popup) popup.style.display = 'none';
            }

            document.getElementById('hero-title').innerText = data.hero.title;
            document.getElementById('hero-tagline').innerText = data.hero.tagline;
            
            const btnContainer = document.getElementById('hero-buttons');
            if (btnContainer) {
                btnContainer.innerHTML = '';
                if (data.hero.buttons) {
                    data.hero.buttons.forEach(btn => {
                        const a = document.createElement('a');
                        a.href = btn.url || '#';
                        a.innerText = btn.text || 'Click Here';
                        a.className = 'btn-primary'; 
                        a.style = "padding: 12px 24px; background: var(--accent, #10b981); color: #000; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.2s;";
                        btnContainer.appendChild(a);
                    });
                }
            }

            const statsGrid = document.getElementById('stats-grid');
            if(statsGrid && data.stats) {
                statsGrid.innerHTML = ''; 
                data.stats.forEach(stat => {
                    const card = document.createElement('div');
                    card.className = 'stat-card';
                    card.innerHTML = `<h2>${stat.value}</h2><p>${stat.label}</p>`;
                    statsGrid.appendChild(card);
                });
            }

            const mainContent = document.getElementById('main-content');
            document.querySelectorAll('.dynamic-block').forEach(e => e.remove());

            if (data.contentBlocks) {
                data.contentBlocks.forEach((block, index) => {
                    const sec = document.createElement('section');
                    sec.className = 'dynamic-block';
                    
                    let html = '';
                    if (block.label) html += `<span style="color:var(--accent, #10b981); font-weight:800; font-size:12px; text-transform:uppercase; display:block; margin-bottom:10px; letter-spacing:1.5px;">${block.label}</span>`;
                    if (block.imageUrl) html += `<img src="${block.imageUrl}" style="width:100%; max-height: 400px; object-fit: cover; border-radius:12px; margin-bottom:20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">`;
                    if (block.title) html += `<h2 style="margin-bottom:15px; font-size: 1.8rem;">${block.title}</h2>`;
                    if (block.body) html += `<p style="margin-bottom:20px; line-height: 1.6; color: var(--text-dim, #ccc); font-size: 1.1rem;">${block.body}</p>`;
                    
                    if (block.expandableBody) {
                        const expId = 'exp-' + index;
                        // Added new dynamic smooth transition classes here
                        html += `<div id="${expId}" class="expand-content">${block.expandableBody}</div>`;
                        html += `<button onclick="const el = document.getElementById('${expId}'); el.classList.toggle('expanded'); this.innerText = el.classList.contains('expanded') ? 'Read Less ↑' : 'Read More ↓';" style="background:transparent; border: 1px solid var(--accent, #10b981); color:var(--accent, #10b981); cursor:pointer; font-weight:bold; padding:10px 20px; margin-right: 15px; margin-bottom: 20px; border-radius: 8px; transition: 0.2s;">Read More ↓</button>`;
                    }

                    if (block.buttonText && block.buttonUrl) {
                        html += `<a href="${block.buttonUrl}" style="display:inline-block; padding:12px 24px; background:var(--accent, #10b981); color:#000; text-decoration:none; border-radius:8px; font-weight:bold; transition: 0.2s; margin-bottom: 20px;">${block.buttonText}</a>`;
                    }
                    
                    sec.innerHTML = html;
                    mainContent.appendChild(sec);
                });
            }
        }

        async function loadPageData() {
            try {
                const response = await fetch('./content.json');
                const data = await response.json();
                renderContent(data);
            } catch (error) {
                console.error("Error loading JSON content:", error);
            }
        }

        loadPageData();

        window.addEventListener('message', (event) => {
            if (event.data.type === 'UPDATE_CONTENT') {
                renderContent(event.data.data);
            }
        });

        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>
</html>
