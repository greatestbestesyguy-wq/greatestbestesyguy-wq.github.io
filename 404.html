<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="data:,"> <title>404 - Lost in the Landfill | Recycle STL</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --accent: #10b981;
            --accent-hover: #059669;
            --text: #f4f4f5;
            --text-dim: #a1a1aa;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            overflow: hidden;
            touch-action: none;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-home {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--text);
            color: #000;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 800;
            text-decoration: none;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.2s;
            font-size: 0.8rem;
        }
        .btn-home:hover { transform: scale(1.05); background: var(--accent); }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            backdrop-filter: blur(8px);
            padding: 20px;
        }

        .overlay h1 { font-size: clamp(3rem, 15vw, 6rem); color: var(--accent); margin-bottom: 5px; }
        .overlay p { font-size: 1.1rem; margin-bottom: 25px; color: var(--text-dim); text-align: center; max-width: 400px; line-height: 1.4;}

        .btn-play {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 18px 45px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
            transition: all 0.2s;
        }
        .btn-play:hover { transform: scale(1.1); background: var(--accent-hover); }

        .stats {
            position: fixed;
            top: 20px;
            right: 20px;
            text-align: right;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .stats div { font-size: 1.4rem; font-weight: bold; }
    </style>
</head>
<body>

    <a href="https://stl.planet-recycling.pl/" class="btn-home">🏠 RETURN HOME</a>

    <div class="stats">
        <div style="color: var(--accent)">SCORE: <span id="score">0</span></div>
        <div style="font-size: 0.9rem; color: var(--text-dim)">BEST: <span id="highScore">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="startScreen" class="overlay">
            <h1>404</h1>
            <p>Page missing. Help clean the landfill!<br><b>Move your finger or mouse to steer.</b></p>
            <button class="btn-play" onclick="initGame()">START CLEANING</button>
        </div>

        <div id="gameOverScreen" class="overlay" style="display:none;">
            <h1 id="gameOverTitle" style="color: #ef4444">CRASH!</h1>
            <p id="gameOverMsg">You recycled <span id="finalScore" style="color:white; font-weight:bold;">0</span> items.</p>
            <button class="btn-play" onclick="initGame()">TRY AGAIN</button>
        </div>
    </div>

    <script>
        // Use a wrapper to ensure everything exists before running
        window.addEventListener('load', () => {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreEl = document.getElementById('score');
            const highScoreEl = document.getElementById('highScore');
            const gameOverTitle = document.getElementById('gameOverTitle');
            const gameOverMsg = document.getElementById('gameOverMsg');
            const finalScoreEl = document.getElementById('finalScore');
            
            const arenaOffset = 40;
            const recyclables = ['📰', '🥫', '📦', '🍾', '♻️'];
            
            let score = 0;
            let highScore = localStorage.getItem('snake360Score') || 0;
            if(highScoreEl) highScoreEl.innerText = highScore;

            let snake = [];
            let food = { x: 0, y: 0, emoji: '♻️' };
            let angle = 0; 
            let speed = 4;
            let gameActive = false;
            let pointer = { x: 0, y: 0, active: false };
            let effects = []; 
            let gameLoopReq = null;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const handleInput = (e) => {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                pointer.x = clientX;
                pointer.y = clientY;
                pointer.active = true;
            };

            window.addEventListener('mousemove', handleInput);
            window.addEventListener('touchstart', handleInput, {passive: false});
            window.addEventListener('touchmove', handleInput, {passive: false});

            function spawnFood() {
                food.x = (arenaOffset + 60) + Math.random() * (canvas.width - (arenaOffset * 2) - 120);
                food.y = (arenaOffset + 60) + Math.random() * (canvas.height - (arenaOffset * 2) - 120);
                food.emoji = recyclables[Math.floor(Math.random() * recyclables.length)];
            }

            function createEffect(x, y) {
                effects.push({ x, y, opacity: 1, velocity: 1.5 });
            }

            window.initGame = function() {
                gameActive = false;
                if (gameLoopReq) cancelAnimationFrame(gameLoopReq);
                
                document.getElementById('startScreen').style.display = 'none';
                document.getElementById('gameOverScreen').style.display = 'none';
                
                score = 0;
                if(scoreEl) scoreEl.innerText = score;
                speed = 4;
                effects = [];
                angle = -Math.PI / 2;
                
                const startX = canvas.width / 2;
                const startY = canvas.height / 2;
                pointer.x = startX;
                pointer.y = startY - 100;
                pointer.active = false;

                snake = [];
                for (let i = 0; i < 25; i++) {
                    snake.push({ x: startX, y: startY + (i * 4) });
                }
                
                spawnFood();
                gameActive = true;
                gameLoop();
            }

            function gameLoop() {
                if (!gameActive) return;
                update();
                draw();
                gameLoopReq = requestAnimationFrame(gameLoop);
            }

            function update() {
                const head = { ...snake[0] };

                if (pointer.active) {
                    const targetAngle = Math.atan2(pointer.y - head.y, pointer.x - head.x);
                    let diff = targetAngle - angle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    angle += diff * 0.12; 
                }

                head.x += Math.cos(angle) * speed;
                head.y += Math.sin(angle) * speed;

                if (head.x < arenaOffset || head.x > canvas.width - arenaOffset || 
                    head.y < arenaOffset || head.y > canvas.height - arenaOffset) {
                    endGame(); return;
                }

                for (let i = 25; i < snake.length; i++) {
                    const dx = head.x - snake[i].x;
                    const dy = head.y - snake[i].y;
                    if (dx*dx + dy*dy < 144) {
                        endGame(); return;
                    }
                }

                const fdx = head.x - food.x;
                const fdy = head.y - food.y;
                if (fdx*fdx + fdy*fdy < 1500) {
                    score++;
                    if(scoreEl) scoreEl.innerText = score;
                    speed += 0.04;
                    createEffect(food.x, food.y);
                    spawnFood();
                    for(let i=0; i<8; i++) snake.push({ ...snake[snake.length-1] });
                }

                snake.unshift(head);
                snake.pop();

                for (let i = effects.length - 1; i >= 0; i--) {
                    effects[i].y -= effects[i].velocity;
                    effects[i].opacity -= 0.02;
                    if (effects[i].opacity <= 0) effects.splice(i, 1);
                }
            }

            function draw() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 4;
                ctx.strokeRect(arenaOffset, arenaOffset, canvas.width - (arenaOffset * 2), canvas.height - (arenaOffset * 2));

                if (score === 0) {
                    const pulse = 30 + Math.sin(Date.now() / 200) * 15;
                    ctx.beginPath();
                    ctx.arc(food.x, food.y, pulse, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(16, 185, 129, 0.6)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = '#10b981';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('COLLECT ME', food.x, food.y + 45);
                }

                ctx.font = '34px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(food.emoji, food.x, food.y);

                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = 20;
                ctx.strokeStyle = '#10b981';
                ctx.beginPath();
                ctx.moveTo(snake[0].x, snake[0].y);
                for (let i = 1; i < snake.length; i++) {
                    ctx.lineTo(snake[i].x, snake[i].y);
                }
                ctx.stroke();

                ctx.font = 'bold 24px Arial';
                effects.forEach(eff => {
                    ctx.fillStyle = `rgba(16, 185, 129, ${eff.opacity})`;
                    ctx.fillText('+1', eff.x, eff.y);
                });

                ctx.shadowBlur = 20;
                ctx.shadowColor = '#34d399';
                ctx.fillStyle = '#34d399';
                ctx.beginPath();
                ctx.arc(snake[0].x, snake[0].y, 12, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            function endGame() {
                gameActive = false;
                if (gameLoopReq) cancelAnimationFrame(gameLoopReq);
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snake360Score', highScore);
                    if(highScoreEl) highScoreEl.innerText = highScore;
                }
                
                // Safety check: only update if elements exist
                if(finalScoreEl) finalScoreEl.innerText = score;
                
                if (score === 0) {
                    if(gameOverTitle) gameOverTitle.innerText = "Don't Give Up!";
                    if(gameOverMsg) gameOverMsg.innerHTML = "<b>Tip:</b> Drag your finger toward icons like ♻️. Avoid the green line!";
                } else {
                    if(gameOverTitle) gameOverTitle.innerText = "CRASH!";
                    if(gameOverMsg) gameOverMsg.innerHTML = `You recycled <span style="color:white; font-weight:bold;">${score}</span> items.`;
                }
                
                document.getElementById('gameOverScreen').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
