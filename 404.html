<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - Lost in the Landfill | Recycle STL</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --accent: #10b981;
            --accent-hover: #059669;
            --text: #f4f4f5;
            --text-dim: #a1a1aa;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        /* High Visibility Home Button */
        .btn-home {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--text);
            color: #000;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 800;
            text-decoration: none;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(255,255,255,0.2);
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .btn-home:hover { transform: scale(1.05); background: var(--accent); }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #111 0%, #000 100%);
        }

        canvas {
            background: #000;
            display: block;
            border: 3px solid var(--accent);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
            border-radius: 8px;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            backdrop-filter: blur(8px);
        }

        .overlay h1 { font-size: 4rem; color: var(--accent); margin-bottom: 10px; }
        .overlay p { font-size: 1.2rem; margin-bottom: 30px; color: var(--text-dim); }

        .btn-play {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 20px 50px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            transition: all 0.2s;
        }
        .btn-play:hover { transform: scale(1.1); background: var(--accent-hover); }

        .stats {
            position: fixed;
            top: 20px;
            right: 20px;
            text-align: right;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
        }
        .stats div { font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>

    <a href="https://stl.planet-recycling.pl/" class="btn-home">🏠 RETURN HOME</a>

    <div class="stats">
        <div style="color: var(--accent)">SCORE: <span id="score">0</span></div>
        <div style="font-size: 1rem; color: var(--text-dim)">BEST: <span id="highScore">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="startScreen" class="overlay">
            <h1>404</h1>
            <p>Page lost. Start cleaning the landfill?</p>
            <button class="btn-play" onclick="initGame()">START CLEANING</button>
        </div>

        <div id="gameOverScreen" class="overlay" style="display:none;">
            <h1 style="color: var(--danger)">CRASHED!</h1>
            <p>You recycled <span id="finalScore">0</span> items.</p>
            <button class="btn-play" onclick="initGame()">TRY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        
        let score = 0;
        let highScore = localStorage.getItem('snake360Score') || 0;
        highScoreEl.innerText = highScore;

        let snake = [];
        let food = { x: 0, y: 0, emoji: '♻️' };
        let angle = 0; // In radians
        let speed = 3;
        let turnSpeed = 0.08;
        let gameActive = false;
        let canvasSize = { w: 0, h: 0 };

        const recyclables = ['📰', '🥫', '📦', '🍾', '♻️'];

        function resize() {
            canvasSize.w = window.innerWidth * 0.9;
            canvasSize.h = window.innerHeight * 0.8;
            canvas.width = canvasSize.w;
            canvas.height = canvasSize.h;
        }

        window.addEventListener('resize', resize);
        resize();

        function initGame() {
            // Fullscreen attempt
            const container = document.getElementById('game-container');
            if (container.requestFullscreen) container.requestFullscreen().catch(() => {});
            
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            
            score = 0;
            scoreEl.innerText = score;
            speed = 3;
            angle = -Math.PI / 2;
            
            // Start snake in center
            snake = [];
            const startX = canvas.width / 2;
            const startY = canvas.height / 2;
            for (let i = 0; i < 20; i++) {
                snake.push({ x: startX, y: startY + (i * 5) });
            }
            
            spawnFood();
            gameActive = true;
            requestAnimationFrame(update);
        }

        function spawnFood() {
            food.x = 50 + Math.random() * (canvas.width - 100);
            food.y = 50 + Math.random() * (canvas.height - 100);
            food.emoji = recyclables[Math.floor(Math.random() * recyclables.length)];
        }

        // Input handling
        let keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // Mobile touch steering
        let touchX = null;
        window.addEventListener('touchstart', e => touchX = e.touches[0].clientX);
        window.addEventListener('touchmove', e => {
            const currentX = e.touches[0].clientX;
            if (currentX < touchX) angle -= turnSpeed;
            else if (currentX > touchX) angle += turnSpeed;
            touchX = currentX;
        });

        function update() {
            if (!gameActive) return;

            // Handle Turning
            if (keys['ArrowLeft'] || keys['a']) angle -= turnSpeed;
            if (keys['ArrowRight'] || keys['d']) angle += turnSpeed;

            // Move Head
            const head = { ...snake[0] };
            head.x += Math.cos(angle) * speed;
            head.y += Math.sin(angle) * speed;

            // Wall Collision
            if (head.x < 0 || head.x > canvas.width || head.y < 0 || head.y > canvas.height) {
                endGame(); return;
            }

            // Self Collision (skip first 15 segments to allow tight turns)
            for (let i = 15; i < snake.length; i++) {
                const dx = head.x - snake[i].x;
                const dy = head.y - snake[i].y;
                if (Math.sqrt(dx*dx + dy*dy) < 10) {
                    endGame(); return;
                }
            }

            // Food Collision
            const fdx = head.x - food.x;
            const fdy = head.y - food.y;
            if (Math.sqrt(fdx*fdx + fdy*fdy) < 25) {
                score++;
                scoreEl.innerText = score;
                speed += 0.1;
                spawnFood();
                // Add length
                for(let i=0; i<5; i++) snake.push({ ...snake[snake.length-1] });
            }

            snake.unshift(head);
            snake.pop();

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Food
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(food.emoji, food.x, food.y);

            // Draw Snake Trail/Body
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 15;
            ctx.strokeStyle = '#10b981';
            
            ctx.beginPath();
            ctx.moveTo(snake[0].x, snake[0].y);
            for (let i = 1; i < snake.length; i++) {
                ctx.lineTo(snake[i].x, snake[i].y);
            }
            ctx.stroke();

            // Head glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#34d399';
            ctx.fillStyle = '#34d399';
            ctx.beginPath();
            ctx.arc(snake[0].x, snake[0].y, 10, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function endGame() {
            gameActive = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snake360Score', highScore);
                highScoreEl.innerText = highScore;
            }
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOverScreen').style.display = 'flex';
            if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        }
    </script>
</body>
</html>
