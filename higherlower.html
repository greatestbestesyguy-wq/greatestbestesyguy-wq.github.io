<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Higher or Lower</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { padding: 20px; text-align: center; background: #1e1e1e; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        .score-board { font-size: 1.2rem; font-weight: bold; }
        .category-title { font-size: 1.5rem; color: #4facfe; text-transform: uppercase; letter-spacing: 2px;}

        .game-container { display: flex; flex: 1; flex-direction: column; }
        @media (min-width: 768px) { .game-container { flex-direction: row; } }

        .card { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px; position: relative; transition: background 0.3s; }
        .card:first-child { background: linear-gradient(135deg, #2c3e50, #3498db); border-bottom: 2px solid #121212; }
        .card:last-child { background: linear-gradient(135deg, #8e44ad, #c0392b); }
        @media (min-width: 768px) {
            .card:first-child { border-bottom: none; border-right: 2px solid #121212; }
        }

        .emoji { font-size: 5rem; margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .name { font-size: 2.5rem; font-weight: bold; margin-bottom: 10px; }
        .value { font-size: 3rem; font-weight: bold; color: #f1c40f; text-shadow: 1px 1px 5px rgba(0,0,0,0.5); }
        .unit { font-size: 1.2rem; opacity: 0.8; }

        .controls { margin-top: 20px; display: flex; gap: 15px; flex-direction: column; }
        button { padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; text-transform: uppercase; transition: transform 0.2s, box-shadow 0.2s; }
        button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .btn-higher { background-color: #2ecc71; color: white; }
        .btn-lower { background-color: #e74c3c; color: white; }
        button:disabled { background-color: #7f8c8d; cursor: not-allowed; transform: none; box-shadow: none; }

        .vs-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: #f1c40f; color: #121212; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.5rem; z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        #loading-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(18, 18, 18, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; transition: opacity 0.3s; }
        .spinner { border: 6px solid #333; border-top: 6px solid #4facfe; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { opacity: 0; pointer-events: none; }
        
        .correct-flash { animation: flashGreen 0.6s ease-out; }
        .wrong-flash { animation: flashRed 0.6s ease-out; }
        @keyframes flashGreen { 0% { background-color: #2ecc71; } }
        @keyframes flashRed { 0% { background-color: #e74c3c; } }
    </style>
</head>
<body>

    <header>
        <div class="score-board">Score: <span id="score">0</span></div>
        <div class="category-title" id="category-display">Loading...</div>
        <div class="score-board">High Score: <span id="high-score">0</span></div>
    </header>

    <div class="game-container">
        <div class="card" id="card-1">
            <div class="emoji" id="emoji-1">⏳</div>
            <div class="name" id="name-1">Loading</div>
            <div class="value" id="value-1">--</div>
            <div class="unit" id="unit-1"></div>
        </div>

        <div class="vs-circle">VS</div>

        <div class="card" id="card-2">
            <div class="emoji" id="emoji-2">⏳</div>
            <div class="name" id="name-2">Loading</div>
            <div class="value" id="value-2">?</div>
            <div class="unit" id="unit-2"></div>
            
            <div class="controls" id="controls">
                <button class="btn-higher" onclick="guess('higher')">▲ Higher</button>
                <button class="btn-lower" onclick="guess('lower')">▼ Lower</button>
            </div>
        </div>
    </div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <h2 id="loading-text">AI is generating a challenge...</h2>
    </div>

    <script>
        let score = 0;
        let highScore = localStorage.getItem('aiHigherLowerHighScore') || 0;
        document.getElementById('high-score').innerText = highScore;

        let currentItem1 = null;
        let currentItem2 = null;
        let currentCategory = "";

        // Function to fetch data from your API
        async function fetchAIChallenge() {
            showLoading(true);
            
            const prompt = `Generate 2 random, interesting, and highly comparable subjects based on a random numeric metric. 
            Choose a unique category (like weight in kg, speed in mph, global population, release year, height in meters, etc.).
            Return strictly as a JSON object with this exact structure:
            {
              "category": "The chosen category (e.g., Top Speed)",
              "items": [
                {"name": "Subject 1", "value": 100, "unit": "mph", "emoji": "🐆"},
                {"name": "Subject 2", "value": 5, "unit": "mph", "emoji": "🐢"}
              ]
            }
            Do not include any formatting, markdown, or other text. Return ONLY the JSON object.`;

            try {
                const response = await fetch('/api/chat', { // Make sure this matches your route
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: prompt,
                        requireJson: true // Triggers the clean JSON output in your updated API
                    })
                });

                const data = await response.json();
                
                // Parse the Gemini response
                const textOutput = data.candidates[0].content.parts[0].text;
                const parsedData = JSON.parse(textOutput);

                currentCategory = parsedData.category;
                currentItem1 = parsedData.items[0];
                currentItem2 = parsedData.items[1];

                updateUI();
                showLoading(false);
            } catch (error) {
                console.error("Error fetching AI data:", error);
                document.getElementById('loading-text').innerText = "Error generating challenge. Retrying...";
                setTimeout(fetchAIChallenge, 2000); // Retry on failure
            }
        }

        function updateUI() {
            document.getElementById('category-display').innerText = currentCategory;
            
            // Item 1 (Known)
            document.getElementById('emoji-1').innerText = currentItem1.emoji;
            document.getElementById('name-1').innerText = currentItem1.name;
            document.getElementById('value-1').innerText = currentItem1.value.toLocaleString();
            document.getElementById('unit-1').innerText = currentItem1.unit;

            // Item 2 (To Guess)
            document.getElementById('emoji-2').innerText = currentItem2.emoji;
            document.getElementById('name-2').innerText = currentItem2.name;
            document.getElementById('value-2').innerText = "?";
            document.getElementById('unit-2').innerText = currentItem2.unit;
            
            document.getElementById('controls').style.display = 'flex';
        }

        function guess(choice) {
            document.getElementById('controls').style.display = 'none';
            document.getElementById('value-2').innerText = currentItem2.value.toLocaleString();

            const isHigher = currentItem2.value > currentItem1.value;
            const isLower = currentItem2.value < currentItem1.value;
            const isTie = currentItem2.value === currentItem1.value;

            let correct = false;
            if (isTie) { correct = true; } // Ties are always wins to be fair
            else if (choice === 'higher' && isHigher) { correct = true; }
            else if (choice === 'lower' && isLower) { correct = true; }

            const card2 = document.getElementById('card-2');

            if (correct) {
                card2.classList.add('correct-flash');
                score++;
                document.getElementById('score').innerText = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('aiHigherLowerHighScore', highScore);
                    document.getElementById('high-score').innerText = highScore;
                }
                
                setTimeout(() => {
                    card2.classList.remove('correct-flash');
                    fetchAIChallenge(); // Load next round
                }, 1500);
            } else {
                card2.classList.add('wrong-flash');
                setTimeout(() => {
                    card2.classList.remove('wrong-flash');
                    gameOver();
                }, 1500);
            }
        }

        function gameOver() {
            score = 0;
            document.getElementById('score').innerText = score;
            alert("Game Over! The AI outsmarted you. Click OK to try again.");
            fetchAIChallenge();
        }

        function showLoading(show) {
            const overlay = document.getElementById('loading-overlay');
            if (show) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        // Start game on load
        fetchAIChallenge();
    </script>
</body>
</html>
